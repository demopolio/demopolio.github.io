<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DEMopólio</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1F47C2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DEMopólio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: tabuleiro de azulejo à esquerda, painel de jogo à direita; no telemóvel o tabuleiro desliza na horizontal */
:root{
  --bg:#EEF2FA; --surface:#FFFFFF; --tile:#F8FAFE; --ink:#0F1C44; --muted:#5A6688;
  --line:#C3CDE6; --cobalt:#1F47C2; --cobalt-soft:#DCE4FA; --gold:#B57A0E; --danger:#C2362B; --ok:#167A4A;
  --pattern:rgba(31,71,194,.09); --pawn-edge:#FFFFFF;
  --sky1:#CFE0FA; --sky2:#F4F7FD; --sun:#FCE7B0; --star:transparent; --hill2:#DCE4F4; --hill:#E7ECF7; --bld:#C2CDE8; --win:#E9EEF9; --river1:#B9D0F3; --river2:#D6E4F8; --wave:#FFFFFF; --bridge:#AFBEDF; --tile1:#F3F6FD; --tile2:#9DB2E6; --shadow:0 6px 24px rgba(15,28,68,.14);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0A1022; --surface:#121A33; --tile:#17213D; --ink:#E7ECFA; --muted:#9AA6C8;
  --line:#2C3963; --cobalt:#7C9BFF; --cobalt-soft:#1E2A55; --gold:#E7B44A; --danger:#FF7B6E; --ok:#4FD08F;
  --pattern:rgba(124,155,255,.09); --pawn-edge:#C9D3F0;
  --sky1:#070C1C; --sky2:#141F40; --sun:#E9E3C6; --star:#C9D3F0; --hill2:#18234A; --hill:#1C2852; --bld:#26335F; --win:#E7B44A; --river1:#1A2B58; --river2:#122045; --wave:#3E5598; --bridge:#2E3D70; --tile1:#141E3D; --tile2:#34488A; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark }}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto}
.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:var(--bg)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;color:var(--ink);background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{color:var(--muted);font-size:13px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:14px}
.banner.warn{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}

/* HOME */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:28px}
.hero h1{font-size:clamp(40px,7vw,76px);font-weight:800;line-height:.95}
.hero h1 span{color:var(--cobalt)}
.hero p{max-width:52ch;color:var(--muted);margin:12px 0 0}
.azulejo{aspect-ratio:1;max-width:100%;border-radius:18px;border:1px solid var(--line);
  background:radial-gradient(circle at 50% 50%,transparent 18%,var(--pattern) 19% 22%,transparent 23%) 0 0/50% 50%,
   conic-gradient(from 45deg at 50% 50%,var(--pattern) 0 25%,transparent 0 50%,var(--pattern) 0 75%,transparent 0) 0 0/25% 25%,var(--surface);
  display:grid;place-items:center}
.azulejo .seal{display:flex;gap:6px;align-items:flex-end;background:var(--surface);padding:14px 22px;border-radius:999px;border:2px solid var(--cobalt)}
.azulejo .seal svg{width:44px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:20px}
.roomlist{display:flex;flex-direction:column;gap:8px}
.roomitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--tile)}
.code{font-family:var(--f-mono);font-weight:700;letter-spacing:.08em}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--cobalt-soft);color:var(--cobalt);text-transform:uppercase;letter-spacing:.06em}
.pill.end{background:var(--tile);color:var(--muted)}
.pill.live{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}

/* JOGO */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.topbar h1{font-size:26px;font-weight:800}
.game{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.boardwrap{overflow-x:auto;overflow-y:hidden;border-radius:18px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.board{container-type:inline-size;position:relative;aspect-ratio:1;width:100%;display:grid;grid-template-columns:1.6fr repeat(9,1fr) 1.6fr;grid-template-rows:1.6fr repeat(9,1fr) 1.6fr;gap:2px;background:var(--line);border:3px solid var(--line);border-radius:18px;overflow:hidden}
.swipe{display:none}
.cell{position:relative;display:flex;background:var(--tile);overflow:hidden;border:0;padding:0;color:var(--ink);min-width:0;min-height:0;text-align:center}
.cell:hover{background:color-mix(in srgb,var(--cobalt-soft) 70%,var(--tile))}
.cell.sel{outline:3px solid var(--cobalt);outline-offset:-3px;z-index:3}
.cell.b{flex-direction:column}.cell.t{flex-direction:column-reverse}.cell.l{flex-direction:row-reverse}.cell.r{flex-direction:row}
.band{flex:none;display:flex;align-items:center;justify-content:center;gap:1px;position:relative;z-index:1}
.cell.b .band,.cell.t .band{height:21%}
.cell.l .band,.cell.r .band{width:21%;flex-direction:column}
.band .bld{display:flex;align-items:flex-end;gap:1px;background:var(--surface);border-radius:4px;padding:1px 2px}
.cell.l .band .bld,.cell.r .band .bld{flex-direction:column;align-items:center}
.band svg.h{width:clamp(7px,1.25cqw,13px);height:auto}
.band svg.hotel{width:clamp(13px,2.4cqw,24px);height:auto}
.cell.l .band svg.hotel,.cell.r .band svg.hotel{width:clamp(11px,1.9cqw,20px)}
.cbody{flex:1;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:4px 3px 3px;min-width:0;min-height:0;position:relative;z-index:1;gap:2px}
.nm{font-size:clamp(7px,1.3cqw,12.5px);font-weight:700;line-height:1.1;text-wrap:balance;overflow-wrap:anywhere;hyphens:auto}
.pr{font-family:var(--f-mono);font-size:clamp(6.5px,1.1cqw,11px);color:var(--muted);font-weight:500}
.bgic{position:absolute;left:50%;top:50%;width:62%;max-width:58px;transform:translate(-50%,-46%);opacity:.16;color:var(--ink);pointer-events:none;z-index:0}
.cell.corner .bgic{opacity:.2;width:52%;max-width:70px}
.cell.corner{flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:6px}
.cell.corner .nm{font-family:var(--f-display);font-weight:800;font-size:clamp(9px,1.7cqw,16px)}
.cell.corner .sub{font-size:clamp(6.5px,1.05cqw,10.5px);color:var(--muted);font-weight:600}
.cell .mort{position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--danger) 20%,transparent) 6px 8px);pointer-events:none;z-index:2}
.cell .ownflag{position:absolute;z-index:2;width:clamp(8px,1.4cqw,14px);height:clamp(8px,1.4cqw,14px);border-radius:50%;border:2px solid var(--surface);right:3px;bottom:3px}
.chatlist{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto;min-height:60px}
.msg{display:grid;grid-template-columns:10px minmax(0,1fr);gap:8px;align-items:start;font-size:13.5px}
.msg .mdot,.chatnt .mdot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.msg .mh{display:flex;gap:8px;align-items:baseline}
.msg .mh span{color:var(--muted);font-size:11px}
.msg .mt{overflow-wrap:anywhere}
.msg.mine .mh b{color:var(--cobalt)}
.chatform{display:flex;gap:8px}
.chatform input{flex:1;min-width:0;padding:8px 10px}
.chatnt{cursor:pointer}
.ticker{position:absolute;top:10%;left:50%;transform:translateX(-50%);width:84%;display:flex;flex-direction:column;align-items:center;gap:.5cqw;z-index:4;pointer-events:none}
.tk{display:flex;align-items:center;gap:.7cqw;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.55cqw 1.5cqw .55cqw .7cqw;font-size:max(12.5px,1.65cqw);box-shadow:0 2px 8px rgba(15,28,68,.12);animation:slidein .25s ease-out}
.tk span:not(.amt){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tk svg{width:max(15px,2.1cqw);flex:none}
.tk .amt{font-family:var(--f-mono);font-weight:700;white-space:nowrap;margin-left:.4cqw}
.tk.gain .amt{color:var(--ok)}.tk.loss .amt{color:var(--danger)}
.tk.land{border-color:var(--cobalt)}
.cfg{display:flex;flex-direction:column;gap:8px}
.cfgrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.cfgrow select{padding:6px 8px;max-width:58%}
.emos{display:flex;gap:4px;flex-wrap:wrap}
.emo{border:1px solid var(--line);background:var(--tile);border-radius:8px;padding:2px 7px;font-size:16px;line-height:1.3}
.emo:hover{border-color:var(--cobalt)}
.msg .mt.big{font-size:26px;line-height:1.2}
.gtimer,.ttimer{font-family:var(--f-mono);font-weight:700;font-size:13px;background:var(--tile);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.ttimer{margin-left:auto;font-size:14px}
.gtimer.low,.ttimer.low{color:var(--danger);border-color:var(--danger)}
.potnote{background:var(--surface);border:1px solid var(--gold);border-radius:999px;padding:.3cqw 1.2cqw;font-size:max(11px,1.35cqw)}
.landing.auction .abid{font-size:max(14px,1.9cqw)}
.landing.auction .atime{font-size:max(13px,1.6cqw);color:var(--muted)}
.landing.auction .atime b{font-family:var(--f-mono);color:var(--danger);font-size:1.2em}
.landing.auction small{opacity:.75;font-weight:500}
.landing.endscreen{inset:6%;gap:1cqw}
.endscreen .winner{display:flex;align-items:center;gap:1cqw;font-family:var(--f-display);font-size:max(20px,3.6cqw);color:var(--cobalt)}
.endscreen .winner svg{width:max(28px,4.5cqw)}
.endscreen .rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4cqw;width:min(100%,46cqw);font-size:max(12px,1.6cqw)}
.endscreen .rank li{display:grid;grid-template-columns:2.2em max(16px,2.2cqw) minmax(0,1fr) auto;align-items:center;gap:.8cqw;background:var(--tile);border-radius:1cqw;padding:.3cqw 1cqw;text-align:left}
.endscreen .rank li:first-child{border:2px solid var(--gold)}
.endscreen .rank svg{width:100%}
.endscreen .hls{display:grid;grid-template-columns:1fr 1fr;gap:.8cqw;width:min(100%,52cqw);text-align:left;font-size:max(11px,1.4cqw)}
.endscreen .hls>div{background:var(--tile);border-radius:1cqw;padding:.6cqw 1cqw}
.pl .brk{font-size:11px;color:var(--muted);white-space:nowrap;margin-top:1px}
.pl .brk b{font-family:var(--f-mono);font-weight:700;color:var(--ink)}
.pl .brk b.neg{color:var(--danger)}
.modepick{max-width:760px;margin:6vh auto 0;display:flex;flex-direction:column;gap:12px;text-align:center;align-items:center}
.modepick h1{font-size:clamp(40px,9vw,72px);color:var(--cobalt);font-weight:800;line-height:1}
.modecards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;margin-top:10px}
.modecard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 18px;border:2px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);text-align:center}
.modecard:hover{border-color:var(--cobalt)}
.modecard .mic{font-size:44px}
.modecard b{font-family:var(--f-display);font-size:20px}
.modecard span{color:var(--muted);font-size:14px}
@media (max-width:560px){.modecards{grid-template-columns:1fr}}
/* ---------- versão telemóvel ---------- */
body.m{padding-block:0 calc(70px + env(safe-area-inset-bottom,0px))}
.mvw .mhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:10px}
body.m::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.mvw .mhinfo{display:flex;flex-direction:column;line-height:1.1;min-width:0;margin-right:auto}
.mvw .mhinfo b{font-family:var(--f-display);font-size:18px}
.mvw .mhinfo .code{font-size:12px;color:var(--muted)}
.mvw .mmoney{font-family:var(--f-mono);font-weight:700;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.mvw .mmoney.neg{color:var(--danger);border-color:var(--danger)}
.mvw .mmenu{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.mvw .mpane{display:none;flex-direction:column;gap:12px}
.mvw .mpane.on{display:flex}
.mvw .mpane{padding-bottom:64px}
.mvw #actions{order:0}
.mvw #actions .turn{display:none}
.mvw #actions:empty{display:none}
.mvw .mturn{display:flex;align-items:center;gap:8px;font-size:15px}
.mvw .mturn svg{width:24px}
.mvw .mturn .btn{margin-left:auto}
.mvw .boardwrap{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));border-radius:0}
.sht{display:none}
.mvw .board{width:max(760px,100%)}
.mvw .boardwrap.fit{overflow:visible;display:flex;justify-content:center}
.mvw .boardwrap.fit .board{width:min(100%,calc(100dvh - 190px));min-width:300px;border-width:2px;border-radius:10px;gap:1px}
.mvw .boardwrap.fit .lng{display:none}
.mvw .boardwrap.fit .sht{display:inline}
.mvw .boardwrap.fit .nm{font-size:max(7px,2.15cqw);font-weight:700;line-height:1.05;letter-spacing:-.01em;hyphens:manual;overflow-wrap:normal;word-break:normal}
.mvw .boardwrap.fit .cell.b .nm,.mvw .boardwrap.fit .cell.t .nm{font-size:max(6.6px,1.95cqw)}
.mvw .boardwrap.fit .cell.corner .nm{font-size:max(8px,2.6cqw)}
.mvw .boardwrap.fit .pr,.mvw .boardwrap.fit .cell.corner .sub{display:none}
.mvw .boardwrap.fit .cbody{justify-content:center;padding:1px}
.mvw .boardwrap.fit .bgic{opacity:.28;width:58%;transform:translate(-50%,-30%)}
.mvw .boardwrap.fit .cell.l .bgic,.mvw .boardwrap.fit .cell.r .bgic{width:40%;transform:translate(-50%,-50%)}
.mvw .boardwrap.fit .cell.l .cbody,.mvw .boardwrap.fit .cell.r .cbody{justify-content:center}
.mvw .boardwrap.fit .ownflag{width:6px;height:6px;border-width:1px;right:1px;bottom:1px}
.mvw .boardwrap.fit .center{padding:4%;gap:2.4cqw}
.mvw .boardwrap.fit .center .logo{font-size:max(18px,6.2cqw)}
.mvw .boardwrap.fit .center .logo small,.mvw .boardwrap.fit .center .now,.mvw .boardwrap.fit .potnote{display:none}
.mvw .boardwrap.fit .die{--s:max(32px,8.4cqw)}
.mvw .boardwrap.fit .cardnote{font-size:max(10.5px,2.6cqw);padding:6px 10px}
.mvw .boardwrap.fit .evnote{font-size:max(10px,2.5cqw)}
.mvw .boardwrap.fit .ticker{top:4%;width:92%}
.mvw .boardwrap.fit .tk{font-size:max(11.5px,3cqw)}
.mvw .boardwrap.fit .pwn{width:max(13px,4cqw);min-width:0}
.mvw .boardwrap.fit .pwarrow span{font-size:max(8px,2.3cqw)}
.mvw #detail{position:fixed;left:8px;right:8px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:28;max-height:58vh;overflow:auto;box-shadow:0 -8px 30px rgba(10,16,34,.25)}
.mvw .chatlist{max-height:55vh;overflow:auto}
.mvw .log{max-height:none}
.mvw .msheet{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:30;padding:0 max(10px,env(safe-area-inset-left,0px));container-type:inline-size;pointer-events:none}
.mvw .msheet .landing{position:relative;inset:auto;max-height:68vh;pointer-events:auto;border-radius:20px;padding:18px 16px;gap:10px;box-shadow:0 -8px 30px rgba(10,16,34,.25)}
.mvw .msheet .landing .lsq b{font-size:24px}
.mvw .msheet .landing ul{max-width:none;font-size:14px}
.mvw .msheet .landing .lact .btn{font-size:15px}
.mvw .msheet .endscreen .rank,.mvw .msheet .endscreen .hls{width:100%}
.mvw .mprim{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;padding:8px max(16px,env(safe-area-inset-left,0px));display:flex}
.mvw .mprim .btn{flex:1;padding:12px;font-size:16px;box-shadow:var(--shadow)}
.mvw .mtabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px))}
.mvw .mtab{position:relative;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:600;padding:6px 0;border-radius:10px}
.mvw .mtab .mti{font-size:20px;line-height:1.1}
.mvw .mtab.on{color:var(--cobalt);background:var(--cobalt-soft)}
.mvw .mbadge{position:absolute;top:2px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
body.m .notes{top:calc(64px + env(safe-area-inset-top,0px))}
body.m .modal{max-height:82vh}
.evnote{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:2px solid var(--gold);border-radius:12px;padding:.5cqw 1.4cqw;font-size:max(11px,1.35cqw);text-align:center;max-width:80%}
.evnote b{font-family:var(--f-display);font-size:1.15em}
.updbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:90;background:var(--cobalt);color:var(--bg);border:0;border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);font-size:14px;max-width:92vw}
.hall{grid-column:1 / -1}
.hallt{display:flex;flex-direction:column;gap:4px;overflow-x:auto}

.pl .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pl .who small{font-weight:500;color:var(--muted)}
.neg{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--tile);font-size:12.5px;color:var(--ink)}
.chip .sw{width:10px;height:10px;border-radius:2px;flex:none}
.chip.m{opacity:.55;text-decoration:line-through}
.spcard{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--tile)}
.spcard .ico{width:40px;height:52px;border-radius:7px;display:grid;place-items:center;background:var(--cobalt);color:var(--bg);font-family:var(--f-display);font-weight:800;font-size:18px}
.spcard .ico svg{width:24px;stroke:var(--bg)}
.spcard b{display:block}
.detail table{width:100%;border-collapse:collapse;font-size:13px}
.detail td{padding:4px 0;border-bottom:1px solid var(--line)}
.detail td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.detail .head{border-radius:10px;padding:12px;color:#fff;font-family:var(--f-display);font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.detail .head svg{width:34px;flex:none;opacity:.9}
.log{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:13px}
.log .pe{display:flex;gap:10px;justify-content:space-between;align-items:baseline}
.log .pe .amt{font-family:var(--f-mono);font-weight:700;white-space:nowrap}
.log .gain{color:var(--ok)}.log .loss{color:var(--danger)}
.log .cd b{color:var(--gold);font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.tabs{display:flex;gap:4px;background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;padding:5px 10px;border-radius:7px}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:70;max-width:90vw}
.notes{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;z-index:60;width:min(360px,calc(100vw - 24px));pointer-events:none}
.nt{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);font-size:14px;animation:slidein .25s ease-out;pointer-events:auto}
.nt svg{width:26px;flex:none}
.nt .amt{margin-left:auto;font-family:var(--f-mono);font-weight:700;white-space:nowrap}
.nt.me{border-color:var(--cobalt)}
.nt.gain .amt{color:var(--ok)}.nt.loss .amt{color:var(--danger)}
.nt.go{border-color:var(--gold)}
@keyframes slidein{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.modalbg{position:fixed;inset:0;background:rgba(5,10,25,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(600px,100%);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.tcols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tcols label.pk{display:flex;gap:6px;align-items:center;font-size:13px;padding:3px 0}
.tcols .cardin{display:grid;grid-template-columns:1fr 64px;gap:6px;align-items:center;font-size:13px}
.lobbylist{display:flex;flex-direction:column;gap:8px}
.tok{display:inline-block}
@media (max-width:1099px){
  .game{display:flex;flex-direction:column;align-items:stretch;gap:14px}
  .game>*,.side>*,.col>*{width:100%;min-width:0}
  .side,.col{display:contents}
  #actions{order:-2}
  .boardcol{order:-1}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero .azulejo{display:none}
}
/* Computador: tudo cabe no ecrã, sem deslizar a página */
@media (min-width:1100px){
  body{padding-block:12px}
  .wrap.gv{max-width:none;height:calc(100dvh - 24px);display:flex;flex-direction:column}
  .gv .topbar{margin-bottom:10px;flex:none}
  .gv .topbar h1{font-size:22px}
  .gv .game{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:14px;align-items:stretch}
  .gv .boardcol{height:100%;aspect-ratio:1;max-width:calc(100vw - 32px - 620px);min-width:0;align-self:start}
  .gv .boardwrap{overflow:hidden}
  .gv .side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;min-height:0;height:100%}
  .gv .col{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
  .gv .col>.panel{flex:0 1 auto;min-height:0;padding:14px;gap:10px;overflow:auto}
  .gv .panel h2{font-size:17px}
  .gv #actions{flex:0 4 auto;max-height:36%;min-height:110px;overflow:auto}
  .gv .col>.grow{flex:1 1 0;min-height:130px;overflow:hidden}
  .gv .col>.panel.collapsed{flex:none;min-height:0}
  .gv .pplayers{flex:0 1 auto;max-height:62%;min-height:150px;display:flex;flex-direction:column}
  .gv .col>.panel.actions{flex:0 4 auto;min-height:110px}
  .gv .col>.pprops.grow{flex:1 1 0;min-height:76px}
  .gv .pplayers .mycode{padding:4px 8px;font-size:11.5px}
  .gv .pchat{min-height:210px}
  .gv .col>.pprops.grow{min-height:120px;display:flex;flex-direction:column;overflow:auto}
  .gv .pprops #myprops{max-height:none}
  .gv .plog{min-height:140px}
  .gv .pcards{flex:0 1 auto;max-height:34%}
  .gv .chatlist{max-height:none}
  .gv .scroll{flex:1;min-height:0;overflow:auto}
  .gv .log{max-height:none}
  .gv .pl{padding:6px 8px}
  .gv .spcard{padding:8px}
}
@media (max-width:780px){
  .board{width:780px}
  .swipe{display:block;margin-top:6px}
}
@media (max-width:640px){
  .cards{grid-template-columns:minmax(0,1fr)}
  .tcols{grid-template-columns:1fr}
}

const PHOTO_RE=/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;
const okPhoto=u=>typeof u==='string'&&u.length<24000&&PHOTO_RE.test(u);
const APP_VER='2026-11-14.1';
let newVer=false;
async function checkVersion(){
  if(newVer||location.protocol==='file:') return;
  try{
    const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
    const t=await r.text(), m=t.match(/const APP_VER='([^']+)'/);
    if(m&&m[1]!==APP_VER){ newVer=true; showUpdate() }
  }catch(e){}
}
function showUpdate(){
  if($('#updbar')) return;
  const b=document.createElement('button'); b.id='updbar'; b.className='updbar';
  b.innerHTML='<b>Há uma versão nova do DEMopólio.</b> <span>Toca aqui para atualizar.</span>';
  b.onclick=()=>location.reload(); document.body.appendChild(b);
}
setInterval(checkVersion,90000); addEventListener('visibilitychange',()=>{ if(!document.hidden) checkVersion() });
/* ---------- instalar como app ---------- */
let installEvt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; if(!code) renderHome?.() });
addEventListener('appinstalled',()=>{ installEvt=null; try{ localStorage.setItem('mv-install-x','1') }catch(e){} toast('DEMopólio instalado. Já o tens no ecrã principal.'); if(!code) renderHome() });
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});

  if(dismissed||!played) return '';
  if(!installEvt&&!isMob()) return '';
  const how= installEvt ? `<button class="btn primary" id="installbtn">Instalar o DEMopólio</button>`

    : `<p class="note" style="margin:0">No menu do browser (os três pontos ⋮), escolhe <b>Instalar app</b> ou <b>Adicionar ao ecrã principal</b>.</p>`;
  return `<div class="panel installcard"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start">

    <p class="note" style="margin:2px 0 0">Abre num toque, em ecrã inteiro, como uma app. Ideal para chamar o grupo para mais uma partida.</p></div></div>
    <button class="btn small" id="installx" aria-label="Fechar">✕</button></div>${how}</div>`;
}
function bindInstall(){
  $('#installbtn')&&($('#installbtn').onclick=async()=>{ if(!installEvt) return; installEvt.prompt(); try{ await installEvt.userChoice }catch(e){} installEvt=null; renderHome() });
  $('#installx')&&($('#installx').onclick=()=>{ try{ localStorage.setItem('mv-install-x','1') }catch(e){} renderHome() });
}
let MODE=null; try{ MODE=localStorage.getItem('mv-mode') }catch(e){}
const isMob=()=>MODE==='m';
function applyMode(){ document.body.classList.toggle('m',MODE==='m'); document.body.classList.toggle('d',MODE==='d') }
function setMode(m){ MODE=m; try{ localStorage.setItem('mv-mode',m) }catch(e){} applyMode(); if(code&&state) render(); else renderHome() }
function roomBtns(st){
  if(!st) return '';

  return q+(st.host===me.id?'<button class="btn small danger" id="topclose">Encerrar sala</button>':'');
}
function myCode(st){ const p=st&&st.players[myIdx(st)]; return p&&p.rc&&!p.out?`<span class="mycode" title="Abre o link da sala noutro dispositivo e escreve este código para continuares a jogar lá">🔑 Código para jogares noutro dispositivo: <b class="code">${p.rc}</b></span>`:'' }
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STANDALONE=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
// o iPhone não deixa nenhuma página fechar-se; só mostramos o botão no Android com a app instalada
let timeMenu=false;
function timerHTML(st){
  if(st.status!=='playing'||!st.endsAt) return '';
  const t=`<span id="gametimer">${clock(st.endsAt-Date.now())}</span>`;
  if(st.host!==me.id) return `<span class="gtimer">${t}</span>`;
  return `<span class="gtwrap"><button class="gtimer host" id="gtbtn" title="Acrescentar tempo de jogo" aria-expanded="${timeMenu}">${t}<span class="gtplus">＋</span></button>${timeMenu?`<span class="tmenu" role="menu"><span class="note">Acrescentar tempo</span>${[5,10,15,30].map(m=>`<button class="btn small" data-addt="${m}">+${m} min</button>`).join('')}</span>`:''}</span>`;
}
function bindTimer(){
  const b=$('#gtbtn'); if(b) b.onclick=e=>{ e.stopPropagation(); timeMenu=!timeMenu; render() };
  app.querySelectorAll('[data-addt]').forEach(x=>x.onclick=e=>{ e.stopPropagation(); timeMenu=false; render(); act('addTime',{min:+x.dataset.addt}) });
}

function closeBtn(){ return isMob()&&!IOS&&STANDALONE?'<button class="btn small" data-closeapp>✕ Fechar aplicação</button>':'' }
function closeApp(){
  try{ window.close() }catch(e){}
  setTimeout(()=>{ if(document.hidden) return;
    document.body.innerHTML='<div class="closedapp"><div><h2>Podes fechar a aplicação</h2><p>O teu telemóvel não deixa a página fechar-se sozinha. Desliza a app para fora no ecrã de apps recentes.</p><p>Se estavas num jogo, continuas lá: quando voltares, entras na mesma sala.</p><button class="btn primary" onclick="location.reload()">Abrir de novo</button></div></div>';
  },400);
}

  $('#topclose')&&confirmBtn($('#topclose'),'Confirmar: encerrar para todos?',()=>closeRoom(code),'top:'+code);

}
function modeBtn(){ return `<button class="btn small" id="modebtn" title="${isMob()?'Mudar para a versão de computador':'Mudar para a versão de telemóvel'}">${isMob()?'🖥️ Computador':'📱 Telemóvel'}</button>` }
function bindMode(){ const b=$('#modebtn'); if(b) b.onclick=()=>setMode(isMob()?'d':'m') }
function chooseMode(){
  return new Promise(res=>{
    const small=Math.min(innerWidth,innerHeight)<700||matchMedia('(pointer:coarse)').matches;
    app.classList.remove('gv','mvw');
    app.innerHTML=`<section class="modepick">
      <div class="eyebrow">Bem-vindo ao</div><h1>DEMopólio</h1>
      <p class="note" style="margin:0">Em que dispositivo vais jogar? Podes mudar mais tarde no menu.</p>
      <div class="modecards">
        <button class="modecard" data-mode="m"><span class="mic">📱</span><b>Versão para telemóvel</b><span>Ecrã simples com separadores em baixo: tabuleiro, jogadores, chat e registo.</span>${small?'<span class="pill">recomendado</span>':''}</button>

function endGame(st,why){

  st.finalWorth=st.players.map((p,i)=>p.out?0:worth(st,i));
  log(st,why); log(st,`${pname(st,st.winner)} ganhou o jogo com ${fmt(st.finalWorth[st.winner])} de património!`);
}
function liquidate(st,pi){
  const p=st.players[pi]; let guard=0;
  while(p.money<0&&guard++<80){
    const built=Object.keys(st.props).map(Number).filter(i=>st.props[i].o===pi&&st.props[i].h>0);
    if(built.length){ built.sort((a,b)=>st.props[b].h-st.props[a].h||SQ[b].p-SQ[a].p); const i=built[0]; st.props[i].h--; pay(st,null,pi,G[SQ[i].g].hc/2,`venda de construção em ${SQ[i].s}`,true); continue }
    const mort=Object.keys(st.props).map(Number).filter(i=>st.props[i].o===pi&&!st.props[i].m).sort((a,b)=>SQ[a].p-SQ[b].p);
    if(mort.length){ const i=mort[0]; st.props[i].m=true; pay(st,null,pi,SQ[i].p/2,`hipoteca de ${SQ[i].s}`,true); continue }
    break;
  }
  return p.money>=0;
}
function note(st,t){ if(st.landing&&st.landing.notes) st.landing.notes.push(t) }
function plog(st,pi,t,v=null){
  if(pi===null||pi===undefined||!st.players[pi]) return;
  st.plog=st.plog||{}; const k=String(pi);
  st.plog[k]=[{t,v},...(st.plog[k]||[])].slice(0,60);
}
function pay(st,from,to,amt,why,quiet){
  if(!amt) return;
  if(from!==null) st.players[from].money-=amt;
  if(to!==null) st.players[to].money+=amt;
  if(why!==null&&why!==undefined&&!quiet) event(st,{a:from,b:to,v:amt,w:why});
  const lbl=why?` · ${why}`:'';
  if(from!==null) plog(st,from,`Pagaste ${to===null?'ao banco':'a '+pname(st,to)}${lbl}`,-amt);
  if(to!==null) plog(st,to,`Recebeste ${from===null?'do banco':'de '+pname(st,from)}${lbl}`,amt);
}
function passGo(st,pi){
  const p=st.players[pi]; p.money+=GO_MONEY; p.laps=(p.laps||0)+1;
  log(st,`${p.name} passou pela Partida e recebeu a mesada dos pais (${fmt(GO_MONEY)}).`);
  event(st,{a:null,b:pi,v:GO_MONEY,w:'mesada dos pais',go:true});
  plog(st,pi,'Passaste pela Partida · mesada dos pais',GO_MONEY); note(st,`Passagem pela Partida: +${fmt(GO_MONEY)} de mesada dos pais`);
}
function moveBy(st,pi,steps){
  const p=st.players[pi], np=((p.pos+steps)%40+40)%40;
  if(steps>0 && np<p.pos) passGo(st,pi);
  p.pos=np;
}
function moveTo(st,pi,target){
  const p=st.players[pi];
  if(target<p.pos || target===0) passGo(st,pi);
  p.pos=target;
}
function sendJail(st,pi){
  const p=st.players[pi]; p.pos=10; p.inJail=true; p.jailTurns=0; st.again=false; stat(st,'jail',pi,1);
  log(st,`${p.name} foi para a Prisão.`); plog(st,pi,'Foste para a Prisão'); note(st,'Vai direto para a Prisão');
}
function land(st,pi,dice,depth=0){
  const p=st.players[pi], i=p.pos, s=SQ[i];
  if(BUYABLE(s.t)){
    const pr=st.props[i];
    if(!pr){
      if(cfg(st).firstLap&&(p.laps||0)<1){ log(st,`${p.name} ainda está na primeira volta e não pode comprar ${s.n}.`); note(st,`À venda por ${fmt(s.p)}, mas na primeira volta ainda não dá para comprar`); return }
      st.phase='buy'; st.pendingBuy=i; note(st,`À venda por ${fmt(s.p)}`); return
    }
    if(pr.o===pi){ note(st,'Esta propriedade já é tua'); return }
    if(pr.m){ log(st,`${s.n} está hipotecada: ${p.name} não paga renda.`); plog(st,pr.o,`${p.name} caiu em ${s.s}, mas está hipotecada: não recebeste renda`); note(st,`De ${pname(st,pr.o)}, mas está hipotecada: não há renda a pagar`); return }
    if(p.shield){ log(st,`${p.name} usou a Borla e não pagou renda em ${s.s}.`); plog(st,pr.o,`${p.name} caiu em ${s.s} com a carta Borla: não recebeste renda`); note(st,`De ${pname(st,pr.o)}: a carta Borla evitou a renda`); return }
    const r=rentFor(st,i,dice); pay(st,pi,pr.o,r,`renda de ${s.s}`); stat(st,'rp',pi,r); stat(st,'rr',pr.o,r); stat(st,'prop',i,r);
    log(st,`${p.name} pagou ${fmt(r)} de renda a ${pname(st,pr.o)} (${s.s}).`); note(st,`Renda de ${fmt(r)} paga a ${pname(st,pr.o)}`);
  } else if(s.t==='tax'){ toBank(st,pi,s.p,s.n); log(st,`${p.name} pagou ${fmt(s.p)} de ${s.n}.`); note(st,`Paga ${fmt(s.p)} de ${s.n} ao banco`) }
  else if(s.t==='jail'){ note(st,'Só de visita à Prisão') }
  else if(s.t==='free'){
    if((st.pot||0)>0){ const v=st.pot; st.pot=0; pay(st,null,pi,v,'prémio do Parque Verde'); log(st,`${p.name} ganhou o prémio do Parque Verde: ${fmt(v)}!`); note(st,`Prémio do Parque Verde: +${fmt(v)}`) }
    else note(st,cfg(st).pot?'Parque Verde: o prémio está vazio':'Descanso no Parque Verde: não acontece nada');
  }
  else if(s.t==='gotojail'){ sendJail(st,pi) }
  else if((s.t==='chance'||s.t==='chest') && depth<3){
    const deck=s.t==='chance'?CHANCE:CHEST, c=deck[Math.floor(Math.random()*deck.length)];
    st.card={deck:s.n,x:c.x,by:pi}; log(st,`${p.name} tirou ${s.n}: ${c.x}`);
    st.cardlog=[{by:pi,deck:s.n,x:c.x},...(st.cardlog||[])].slice(0,50); plog(st,pi,`Tiraste ${s.n}: ${c.x}`); note(st,`Carta de ${s.n}: ${c.x}`);
    applyCard(st,pi,c,dice,depth);
  }
}
function applyCard(st,pi,c,dice,depth){
  const p=st.players[pi], others=st.players.map((q,j)=>j).filter(j=>j!==pi&&!st.players[j].out);
  switch(c.a){
    case 'money': c.v>0 ? pay(st,null,pi,c.v,c.w) : toBank(st,pi,-c.v,c.w); break;
    case 'moveTo': moveTo(st,pi,c.v); land(st,pi,dice,depth+1); break;
    case 'back': moveBy(st,pi,-c.v); land(st,pi,dice,depth+1); break;
    case 'rail': { let t=p.pos; do{t=(t+1)%40}while(SQ[t].t!=='rail'); moveTo(st,pi,t); land(st,pi,dice,depth+1); break }
    case 'jail': sendJail(st,pi); break;
    case 'card': inv(p)[c.k]=(inv(p)[c.k]||0)+1; break;
    case 'repairs': { let tot=0; Object.values(st.props).forEach(pr=>{ if(pr.o===pi&&pr.h) tot+= pr.h===5?c.v[1]:pr.h*c.v[0] }); toBank(st,pi,tot,'obras'); if(tot) log(st,`${p.name} pagou ${fmt(tot)} em obras.`); break }
    case 'payEach': others.forEach(j=>pay(st,pi,j,c.v,c.w)); break;
    case 'collectEach': others.forEach(j=>pay(st,j,pi,c.v,c.w)); break;
  }
}
function nextPhase(st,pi){ st.phase = (st.again && !st.players[pi].inJail) ? 'roll' : 'end' }
function alive(st){ return st.players.map((p,i)=>i).filter(i=>!st.players[i].out) }
function advanceTurn(st){
  const cur=st.players[st.turn]; if(cur) cur.shield=false;
  const n=st.players.length; let t=st.turn;
  const from=st.turn;
  for(let k=0;k<n;k++){ t=(t+1)%n; if(!st.players[t].out) break }
  st.turn=t; st.phase='roll'; st.dbl=0; st.again=false; st.pendingBuy=null;
  roundTick(st,t<=from);
  log(st,`Vez de ${pname(st,t)}.`);
}
function bankrupt(st,pi,why){
  const p=st.players[pi]; p.out=true; p.money=0; p.inv={jail:0,borla:0,extra:0}; p.shield=false;
  Object.keys(st.props).forEach(k=>{ if(st.props[k].o===pi) delete st.props[k] });
  log(st,why||`${p.name} declarou falência. As propriedades voltaram ao banco.`); plog(st,pi,'Saíste do jogo. As tuas propriedades voltaram ao banco.');
  (st.trades||[]).filter(t=>t.from===pi||t.to===pi).forEach(t=>histTrade(st,t,'anulada',`${st.players[pi].name} saiu do jogo`));
  st.trades=(st.trades||[]).filter(t=>t.from!==pi&&t.to!==pi);
  const a=alive(st);
  if(a.length<=1){ endGame(st,'Só resta um jogador em jogo.'); return }
  if(st.turn===pi) advanceTurn(st);
}
function canStillAct(st,pi){
  const p=st.players[pi];
  if(p.money<0) return true;
  if(inv(p).extra&&!p.inJail) return true;
  for(const [k,pr] of Object.entries(st.props)){
    if(pr.o!==pi) continue; const s=SQ[k];
    if(pr.m && p.money>=Math.ceil(s.p*0.55)) return true;
    if(s.t==='prop'&&!pr.m&&pr.h<5&&ownsGroup(st,pi,s.g)){
      const grp=groupOf(s.g);
      if(grp.every(j=>!st.props[j].m) && pr.h<=Math.min(...grp.map(j=>st.props[j].h)) && p.money>=G[s.g].hc) return true;
    }
  }
  return false;
}
function autoEnd(st,pi){
  if(st.status!=='playing'||st.phase!=='end'||st.turn!==pi||canStillAct(st,pi)) return;
  log(st,`${st.players[pi].name} não tinha mais nada para fazer: a vez passou automaticamente.`);
  advanceTurn(st);
}
function tradeable(st,i){ const s=SQ[i]; if(s.t!=='prop') return true; return groupOf(s.g).every(j=>!st.props[j]||!st.props[j].h) }
function myIdx(st){ return st.players.findIndex(p=>p.id===me.id) }
function myTurn(st){ const i=st.turn; return st.status==='playing'&&st.players[i]&&st.players[i].id===me.id ? i : -1 }
function cleanCards(o){ const r={}; SKEYS.forEach(k=>r[k]=Math.max(0,Math.floor(+((o||{})[k])||0))); return r }
function validTrade(st,t){
  const f=st.players[t.from], o=st.players[t.to];
  if(!f||!o||f.out||o.out) return 'Um dos jogadores já não está em jogo.';
  if(!t.give.every(i=>st.props[i]&&st.props[i].o===t.from&&tradeable(st,i))) return `As propriedades de ${f.name} mudaram.`;
  if(!t.get.every(i=>st.props[i]&&st.props[i].o===t.to&&tradeable(st,i))) return `As propriedades de ${o.name} mudaram.`;
  if(t.gm>0&&f.money<t.gm) return `${f.name} já não tem esse dinheiro.`;
  if(t.tm>0&&o.money<t.tm) return `${o.name} já não tem esse dinheiro.`;
  if(SKEYS.some(k=>(inv(f)[k]||0)<t.gc[k])) return `${f.name} já não tem essas cartas.`;
  if(SKEYS.some(k=>(inv(o)[k]||0)<t.tc[k])) return `${o.name} já não tem essas cartas.`;
  return null;
}
function histTrade(st,t,res,why){
  st.tradelog=[{id:t.id,at:Date.now(),from:t.from,to:t.to,h:tradeSummary(st,t),res,why:why||''},...(st.tradelog||[])].slice(0,40);
}
function emptyTrade(t){ return !t.give.length&&!t.get.length&&!t.gm&&!t.tm&&SKEYS.every(k=>!t.gc[k]&&!t.tc[k]) }

/* ===================== BOTS ===================== */
const BOTRES={facil:40,medio:120,dificil:200};
function botValue(st,bi,i){
  const c=cfg(st), d=c.botDiff, s=SQ[i]; if(!s.p) return 0;
  let v=s.p*({facil:.8,medio:1,dificil:1.1}[d]||1);
  if(s.t==='prop'){
    const grp=groupOf(s.g), mine=grp.filter(j=>j!==i&&st.props[j]&&st.props[j].o===bi).length;
    if(mine===grp.length-1) v*=d==='dificil'?2:1.6; else if(mine>0) v*=1.15;
    if(d==='dificil'){
      const others=grp.filter(j=>j!==i&&st.props[j]&&st.props[j].o!==bi).map(j=>st.props[j].o);
      if(others.length===grp.length-1&&new Set(others).size===1) v*=1.4;
      if(['laranja','vermelho','verde'].includes(s.g)) v*=1.1;
    }
  } else if(s.t==='rail'){ v*=1+.15*countType(st,bi,'rail') } else v*=.9;
  if(d==='facil') v*=.8+Math.random()*.4;
  return Math.round(v);
}
function botBuild(st,bi){
  const c=cfg(st), d=c.botDiff, p=st.players[bi], res=BOTRES[d]*({facil:3,medio:1.5,dificil:1}[d]);
  if(d==='facil'&&Math.random()<.5) return;
  for(let n=0;n<8;n++){
    const opts=Object.keys(st.props).map(Number).filter(i=>{ const s=SQ[i], pr=st.props[i]; if(pr.o!==bi||s.t!=='prop'||pr.m||pr.h>=5||!ownsGroup(st,bi,s.g)) return false;
      const grp=groupOf(s.g); return grp.every(j=>!st.props[j].m)&&pr.h<=Math.min(...grp.map(j=>st.props[j].h)) });
    if(!opts.length) return;
    opts.sort((a,b)=>st.props[a].h-st.props[b].h||SQ[b].p-SQ[a].p);
    const i=opts[0], hc=G[SQ[i].g].hc; if(p.money-hc<res) return;
    A.build(st,{i});
  }
}
function botUnmortgage(st,bi){
  const p=st.players[bi], res=BOTRES[cfg(st).botDiff]*3;
  Object.keys(st.props).map(Number).filter(i=>st.props[i].o===bi&&st.props[i].m).forEach(i=>{ const c=Math.ceil(SQ[i].p*.55); if(p.money-c>res) A.unmortgage(st,{i}) });
}
function botTradeEval(st,t){
  const c=cfg(st), bi=t.to, th={facil:.8,normal:.97,dificil:1.25}[c.botTrade]||.97;
  const CV={jail:50,borla:60,extra:40};
  const mort=i=>st.props[i]&&st.props[i].m?.55:1;
  const loseVal=i=>{ const s=SQ[i]; let v=s.p*mort(i); if(s.t==='prop'){ const grp=groupOf(s.g); const theirs=grp.filter(j=>j!==i&&st.props[j]&&st.props[j].o===t.from).length;
      if(theirs===grp.length-1) v*=c.botTrade==='facil'?1.15:c.botTrade==='dificil'?2.2:1.5;
      if(grp.filter(j=>j!==i&&st.props[j]&&st.props[j].o===bi).length) v*=1.2 } return v };
  const bm=st.players[bi].money, cash=bm<250?1.2:bm>1800?.9:1;
  const give=t.tm+t.get.reduce((a,i)=>a+loseVal(i),0)+SKEYS.reduce((a,k)=>a+t.tc[k]*CV[k],0);
  const recv=t.gm*cash+t.give.reduce((a,i)=>a+botValue(st,bi,i)*mort(i),0)+SKEYS.reduce((a,k)=>a+t.gc[k]*CV[k],0);
  const need=give*th*(.97+Math.random()*.06), cap=Math.max(0,bm-BOTRES[c.botDiff]/2);
  return {ok:recv>=need&&t.tm<=cap, gap:Math.max(0,need-recv), give, recv, cap};
}
function botTradeOk(st,t){ return botTradeEval(st,t).ok }
// em vez de recusar logo, o bot tenta uma contraproposta razoável (no máximo 2 rondas)
function botCounter(st,t,e){
  if((t.depth||0)>=2||!e.give) return null;
  const r10=x=>Math.round(x/10)*10, h=st.players[t.from];
  let tm=t.tm, gm=t.gm, gap=e.gap;
  if(tm>e.cap){ tm=Math.floor(e.cap/10)*10 }
  if(gap>0&&tm>0){ const cut=Math.min(tm,Math.ceil(gap*1.03/10)*10); tm-=cut; gap-=cut }
  if(gap>0){ if(gap>e.give*.75) return null; gm=Math.ceil((gm+gap*1.03)/10)*10 }
  if(gm>Math.max(0,h.money)) return null;
  if(tm===t.tm&&gm===t.gm) return null;
  const o={id:t.id,give:t.get,get:t.give,gm:Math.max(0,r10(tm)),tm:Math.max(0,gm),gc:t.tc,tc:t.gc};
  if(!o.give.length&&!o.get.length&&!o.gm&&!o.tm) return null;
  return o;
}
function botPropose(st,bi){
  const c=cfg(st), p=st.players[bi];
  if((st.trades||[]).some(t=>t.from===bi)) return false;
  st.botAsk=st.botAsk||{}; const last=st.botAsk[p.id]; if(last!==undefined&&(st.rollId||0)-last<6*alive(st).length) return false;
  for(const g of Object.keys(G)){
    const grp=groupOf(g), mine=grp.filter(j=>st.props[j]&&st.props[j].o===bi);
    if(mine.length!==grp.length-1) continue;
    const i=grp.find(j=>!mine.includes(j)), pr=st.props[i];
    if(!pr||pr.o===bi||st.players[pr.o].out||!tradeable(st,i)) continue;
    const mult={facil:1.6,medio:2,dificil:2.2}[c.botDiff]||2, gm=Math.round(Math.min(p.money-BOTRES[c.botDiff],SQ[i].p*mult)/10)*10;
    if(gm<SQ[i].p) continue;
    st.botAsk[p.id]=st.rollId||0;
    return A.propose(st,{to:pr.o,give:[],get:[i],gm,tm:0,gc:{},tc:{}})===undefined;
  }
  return false;
}
function botStep(st){
  if(st.status!=='playing') return false;
  const c=cfg(st), now=Date.now();
  if(st.phase==='auction'&&st.auction){
    const a=st.auction;
    if(now>=a.endsAt) return A.auctionEnd(st);
    const bots=st.players.map((p,i)=>i).filter(i=>st.players[i].bot&&!st.players[i].out&&i!==a.by).sort(()=>Math.random()-.5);
    for(const bi of bots){
      const p=st.players[bi], step=SQ[a.i].p>=200?20:10, amt=a.bid+step, v=botValue(st,bi,a.i);
      if(v>=amt&&p.money-BOTRES[c.botDiff]>=amt) return withActor(st,bi,()=>A.bid(st,{amt}));
    }
    return false;
  }
  for(const t of (st.trades||[])){
    const b=st.players[t.to]; if(!b||!b.bot||now-(t.at||0)<2500) continue;
    return withActor(st,t.to,()=>{
      if(validTrade(st,t)!==null) return A.reject(st,{id:t.id});
      const e=botTradeEval(st,t); if(e.ok) return A.accept(st,{id:t.id});
      const ct=botCounter(st,t,e); if(ct&&A.counter(st,ct)===undefined) return true;
      return A.reject(st,{id:t.id});
    });
  }
  const bi=st.turn, p=st.players[bi]; if(!p||!p.bot||p.out) return false;
  return withActor(st,bi,()=>{
    if(st.phase==='roll'){
      if(p.money<0&&!liquidate(st,bi)){ bankrupt(st,bi); return }
      if(p.inJail){ if(inv(p).jail) A.useCard(st,{k:'jail'}); else if(c.botDiff==='dificil'&&p.jailTurns===0&&p.money>BOTRES.dificil+JAIL_FEE&&countType(st,bi,'prop')<4) A.payJail(st) }
      return A.roll(st);
    }
    if(st.phase==='buy'){
      const i=st.pendingBuy, s=SQ[i], v=botValue(st,bi,i);
      const completes=s.t==='prop'&&groupOf(s.g).every(j=>j===i||(st.props[j]&&st.props[j].o===bi));
      const ok=p.money>=s.p&&(p.money-s.p>=BOTRES[c.botDiff]||completes)&&v>=s.p*.85&&!(c.botDiff==='facil'&&Math.random()<.2);
      return ok?A.buy(st):A.pass(st);
    }
    if(st.phase==='end'){
      if(p.money<0&&!liquidate(st,bi)){ bankrupt(st,bi); return }
      botPropose(st,bi); botBuild(st,bi); botUnmortgage(st,bi);
      if(inv(p).extra&&!p.inJail&&c.botDiff!=='facil'){ A.useCard(st,{k:'extra'}); return }
      return A.end(st);
    }
    return false;
  });
}

/* ===================== AÇÕES (correm dentro de uma transação) ===================== */
const A = {
  join(st,{name}){
    if(st.players.some(p=>p.id===me.id)) return true;
    if(st.status!=='lobby') return 'O jogo desta sala já começou.';
    if(st.players.length>=MAXP) return `A sala está cheia (máx. ${MAXP}).`;
    const used=st.players.map(p=>p.color);
    st.players.push({id:me.id,name:name.slice(0,18),color:COLORS.find(c=>!used.includes(c)),rc:rcode(),...(okPhoto(myPhoto())?{photo:myPhoto()}:{})});
    st.pids=[...new Set([...(st.pids||[]),me.id])];
    log(st,`${name} entrou na sala.`);
  },
  leave(st){
    if(st.status!=='lobby') return 'Não podes sair a meio do jogo; declara falência.';
    const i=myIdx(st); if(i<0) return false;
    log(st,`${st.players[i].name} saiu da sala.`); st.players.splice(i,1); st.pids=(st.pids||[]).filter(x=>x!==me.id);
    if(st.host===me.id && st.players[0]) st.host=st.players[0].id;
  },
  kick(st,{idx}){
    if(st.host!==me.id) return 'Só o anfitrião pode retirar jogadores.';
    if(st.status==='lobby'){ const kid=st.players[idx].id; log(st,`${st.players[idx].name} foi retirado.`); st.players.splice(idx,1); st.pids=(st.pids||[]).filter(x=>x!==kid); return }
    if(st.status==='playing') bankrupt(st,idx,`${st.players[idx].name} foi retirado pelo anfitrião.`);
  },
  start(st){

const RETRY=new Set(['aborted','failed-precondition','unavailable','deadline-exceeded','resource-exhausted','internal']);
async function mutate(fn,arg,room=code,quiet=false,tries=0){
  if(!room||!db) return;
  const ref=db.doc('rooms/'+room); let msg=null, out=null, pre0=null;
  try{
    await db.runTransaction(async tx=>{
      msg=null; out=null;
      const snap=await tx.get(ref);
      if(!snap.exists){ msg='Esta sala já não existe.'; return }
      const st=structuredClone(snap.data());
      const res=fn(st,arg||{});
      if(typeof res==='string'){ msg=res; return }
      if(res===false||res===true) return;
      const pre=snap.data(); pre0=pre.status; if(st.turn!==pre.turn||st.phase!==pre.phase) st.turnAt=Date.now();
      st.rev=(st.rev||0)+1; st.updatedAt=Date.now();
      tx.set(ref,st); out=st;
    });
    if(msg&&!quiet) toast(msg);
    if(out&&out.status==='ended'&&pre0!=='ended') recordGame(out);
    if(out&&room===code) applyState(out);
    return out||(!msg);
  }catch(e){

const SFX={on:ls.get('mv-sound')!=='0',ctx:null};
function audio(){ if(!SFX.ctx){ try{ SFX.ctx=new (window.AudioContext||window.webkitAudioContext)() }catch(e){} } if(SFX.ctx&&SFX.ctx.state==='suspended') SFX.ctx.resume(); return SFX.ctx }
addEventListener('pointerdown',()=>{ if(SFX.on) audio() },{passive:true});
function tone(f1,f2,dur,type='sine',vol=.12,delay=0){ const c=SFX.ctx; if(!c) return; const t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.02) }
function noise(dur,vol=.06,delay=0,freq=2000,ftype='bandpass',q=1.2,f2=null){ const c=SFX.ctx; if(!c) return; const t=c.currentTime+delay;
  if(!SFX.nb){ const n=c.sampleRate; SFX.nb=c.createBuffer(1,n,n); const d=SFX.nb.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1 }
  const src=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); src.buffer=SFX.nb; f.type=ftype; f.frequency.setValueAtTime(freq,t); if(f2) f.frequency.exponentialRampToValueAtTime(f2,t+dur); f.Q.value=q;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); src.connect(f); f.connect(g); g.connect(c.destination); src.start(t,Math.random()*.5); src.stop(t+dur+.02) }
let stepN=0, lastSfx={};
function sfx(k){
  if(!SFX.on||!SFX.ctx||SFX.ctx.state!=='running') return;
  const now=performance.now(); if(lastSfx[k]&&now-lastSfx[k]<(k==='step'?60:120)) return; lastSfx[k]=now;
  switch(k){
    case 'dice': // chocalhar no copo e dois toques ao cair
      for(let i=0;i<9;i++) noise(.035,.09,i*.07+Math.random()*.03,2200+Math.random()*1800,'bandpass',4);
      [.62,.8,.93].forEach((d,i)=>{ tone(170-i*20,70,.09,'sine',.18-i*.05,d); noise(.05,.08-i*.02,d,700,'lowpass',.7) }); break;
    case 'step': { const f=(stepN++%2)?470:400; tone(f,f*.7,.06,'sine',.07); noise(.025,.025,0,3200,'highpass',.7); break }
    case 'coin': tone(988,null,.08,'square',.045); tone(1319,null,.22,'square',.045,.08); tone(2637,null,.12,'sine',.02,.1); break;
    case 'loss': noise(.22,.05,0,2400,'bandpass',1.5,500); tone(520,260,.22,'triangle',.07,.02); break;
    case 'buy': noise(.06,.07,0,5000,'highpass',.8); tone(1568,null,.09,'square',.04,.04); tone(2093,null,.28,'square',.04,.12); tone(392,null,.18,'triangle',.08,0); break;
    case 'build': [0,.16,.32].forEach(d=>{ tone(210,110,.08,'square',.06,d); noise(.06,.1,d,900,'lowpass',.8) }); break;
    case 'card': [0,.05,.1].forEach((d,i)=>noise(.07,.05,d,1500+i*900,'bandpass',.9,4000)); break;
    case 'accept': [523,659,784,1047].forEach((f,i)=>tone(f,null,.22,'triangle',.09,i*.075)); tone(2093,null,.3,'sine',.03,.3); break;
    case 'reject': tone(330,300,.12,'square',.05); tone(233,200,.22,'square',.05,.13); break;
    case 'counter': tone(660,null,.1,'sine',.09); tone(784,null,.16,'sine',.09,.11); break;
    case 'offer': tone(1175,null,.12,'sine',.08); tone(1568,null,.25,'sine',.08,.13); break;
    case 'mesada': [784,988,1175,1568,1976].forEach((f,i)=>tone(f,null,.12,'square',.03,i*.06)); break;
    case 'jail': tone(130,90,.45,'square',.06); noise(.3,.05,.05,600,'lowpass',.7); break;
    case 'turn': tone(660,null,.12,'sine',.1); tone(990,null,.22,'sine',.1,.12); break;
    case 'bid': tone(1200,null,.05,'square',.04); break;
    case 'win': [523,659,784,1047].forEach((f,i)=>tone(f,null,.25,'triangle',.1,i*.14)); [1319,1568].forEach((f,i)=>tone(f,null,.4,'sine',.05,.6+i*.1)); break;
  }
}

  const room=code; let ok=false;
  try{ ok=await mutate(A.join,{name},room,true) }catch(e){}
  const inRoom=()=>state&&state.players.some(p=>p.id===me.id);
  if(!ok&&!inRoom()&&db&&room===code){
    // plano B: junta-te sem transação
    try{
      const snap=await db.doc('rooms/'+room).get(); const st=snap.data();
      if(!st) joinErr='Esta sala já não existe.';
      else if(st.status!=='lobby') joinErr='O jogo desta sala já começou.';
      else if((st.players||[]).length>=MAXP) joinErr=`A sala está cheia (máx. ${MAXP}).`;
      else if(!(st.players||[]).some(p=>p.id===me.id)){
        const used=(st.players||[]).map(p=>p.color);
        const pl={id:me.id,name:name.slice(0,18),color:COLORS.find(c=>!used.includes(c)),rc:rcode(),...(okPhoto(myPhoto())?{photo:myPhoto()}:{})};
        const FV=firebase.firestore.FieldValue;
        await db.doc('rooms/'+room).update({players:FV.arrayUnion(pl),pids:FV.arrayUnion(me.id),log:[`${name} entrou na sala.`,...(st.log||[])].slice(0,60),updatedAt:Date.now()});
      }
    }catch(e){ joinErr=`Não consegui entrar na sala (erro: ${e&&e.code||e&&e.message||'desconhecido'}). Tira uma captura a isto e envia ao anfitrião.` }

    const a=st.tradelog||[], RES={aceite:['Aceite','ok'],recusada:['Recusada','no'],cancelada:['Cancelada','no'],anulada:['Anulada','no'],contraproposta:['Contraproposta','mid']};
    const hh=d=>{ const x=new Date(d); return String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0') };
    el.innerHTML=a.length?a.map(e=>{ const r=RES[e.res]||[e.res,'mid'], mine=meIdx>=0&&(e.from===meIdx||e.to===meIdx);
      return `<div class="th ${mine?'mine':''}"><div class="thtop"><b>${esc(pname(st,e.from))} → ${esc(pname(st,e.to))}</b><span class="thres ${r[1]}">${r[0]}</span><span class="note">${hh(e.at)}</span></div><div class="thbody">${e.h}</div>${e.why?`<div class="note">${esc(e.why)}</div>`:''}</div>` }).join('')
      :'<span class="note">Ainda não houve propostas terminadas. Aqui aparecem as aceites, recusadas, canceladas e as que tiveram contraproposta.</span>';
  } else el.innerHTML=(st.log||[]).map(l=>`<div>${esc(l)}</div>`).join('');
}
function myPhoto(){ return ls.get('mv-photo') }
function pickPhoto(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
    const url=URL.createObjectURL(f), img=new Image();
    img.onload=()=>{ const S=96, c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d');
      const m=Math.min(img.width,img.height); x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
      let q=.8, d=c.toDataURL('image/jpeg',q); while(d.length>20000&&q>.3){ q-=.1; d=c.toDataURL('image/jpeg',q) }
      URL.revokeObjectURL(url); ls.set('mv-photo',d); if(code&&state) act('setPhoto',{photo:d}); else renderHome?.(); toast('Foto atualizada.') };
    img.onerror=()=>toast('Não consegui abrir essa imagem.'); img.src=url };
  inp.click();
}
function removePhoto(){ try{ localStorage.removeItem('mv-photo') }catch(e){} if(code&&state) act('setPhoto',{photo:null}); toast('Foto removida.') }
function photoCtl(p){
  const has=p&&okPhoto(p.photo);
  return `<div class="photoctl">${pawnSVG(p?.color||COLORS[0],p?.name||ls.get('mv-nick')||'?','style="width:34px"',p?p.photo:myPhoto())}
    <button class="btn small" data-photo="pick">${has?'Mudar foto':'Pôr a minha foto'}</button>${has?'<button class="btn small" data-photo="rm">Remover</button>':''}</div>`;
}
function bindPhoto(){ document.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>b.dataset.photo==='pick'?pickPhoto():removePhoto()) }
const EMOS=['😂','👏','💸','😱','🔥','🍺'];
const CHATFORM=`<div class="emos">${EMOS.map(e=>`<button type="button" class="emo" data-emo="${e}" aria-label="Reagir ${e}">${e}</button>`).join('')}</div>
  <form class="chatform" id="chatform" autocomplete="off"><input id="chatin" maxlength="300" placeholder="Escreve uma mensagem…" aria-label="Mensagem"><button class="btn primary small" type="submit">Enviar</button></form>`;
function isCol(k){ return ls.get('mv-col-'+k)==='1' }
function panelC(k,title,cls,body,extra=''){
  const c=isCol(k);
  return `<div class="panel ${cls} ${c?'collapsed':''}" data-panel="${k}"><div class="phead"><button class="ctog" data-ctog="${k}" aria-expanded="${!c}"><span class="chev">${c?'▸':'▾'}</span><h2>${title}</h2></button>${extra?`<span class="pextra">${extra}</span>`:''}</div><div class="pbody">${body}</div></div>`;
}
function bindCollapse(){ document.querySelectorAll('[data-ctog]').forEach(b=>b.onclick=()=>{ const k=b.dataset.ctog; ls.set('mv-col-'+k,isCol(k)?'0':'1'); render() }) }
function chatSnap(){ const ci=$('#chatin'), cl=$('#chatlist'); return {val:ci?ci.value:'',focus:!!ci&&document.activeElement===ci,sel:ci?ci.selectionStart:0,atBottom:!cl||cl.scrollHeight-cl.scrollTop-cl.clientHeight<30,scroll:cl?cl.scrollTop:0} }
function renderChat(val,focus,sel,atBottom,scroll){
  const el=$('#chatlist'); if(!el) return; const st=state, msgs=st.chat||[];
  const t=at=>{ const d=new Date(at); return d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}) };
  el.innerHTML=msgs.length?msgs.map(m=>`<div class="msg ${m.u===me.id?'mine':''}"><span class="mdot" style="background:${m.c}"></span><div><div class="mh"><b>${esc(m.n)}</b><span>${t(m.at)}</span></div><div class="mt ${/^(\p{Extended_Pictographic}|\s|\u200d|\ufe0f)+$/u.test(m.t)?'big':''}">${esc(m.t)}</div></div></div>`).join('')
    :'<span class="note">Ainda não há mensagens. Diz olá ao grupo.</span>';
  el.scrollTop=atBottom?el.scrollHeight:scroll;
  const ci=$('#chatin'); ci.value=val||'';
  if(focus){ ci.focus({preventScroll:true}); try{ ci.setSelectionRange(sel,sel) }catch(e){} }
  $('#chatform').onsubmit=e=>{ e.preventDefault(); const v=ci.value.trim(); if(!v) return; ci.value=''; act('chat',{text:v,name:ls.get('mv-nick')}) };
  document.querySelectorAll('[data-emo]').forEach(b=>b.onclick=()=>act('chat',{text:b.dataset.emo,name:ls.get('mv-nick')}));
}
function chatVisible(){ const el=$('#chatlist'); if(!el) return false; const r=el.getBoundingClientRect(); return r.bottom>0&&r.top<innerHeight&&r.height>0 }
function renderMyCards(meIdx){
  const el=$('#mycards'); if(!el) return;
  const st=state, p=st.players[meIdx], mine=st.turn===meIdx&&st.status==='playing';
  const can={jail:mine&&p.inJail&&st.phase==='roll', borla:mine&&!p.shield&&st.phase!=='over', extra:mine&&st.phase==='end'&&!p.inJail};
  const have=SKEYS.filter(k=>inv(p)[k]);
  el.innerHTML=have.length?have.map(k=>`<div class="spcard"><div class="ico">${icon(SPECIAL[k].ic)}</div><div><b>${SPECIAL[k].n} ×${inv(p)[k]}</b><span class="note">${SPECIAL[k].d}</span></div><button class="btn small" data-usec="${k}" ${can[k]?'':'disabled'}>Usar</button></div>`).join('')
    :'<span class="note">Ainda não tens cartas especiais. Saem na Sorte e na Caixa Comum, ou podes negociá-las com outros jogadores.</span>';
  el.querySelectorAll('[data-usec]').forEach(b=>b.onclick=()=>act('useCard',{k:b.dataset.usec}));
}
function renderMyProps(meIdx){
  const el=$('#myprops'); if(!el) return;
  const owned=Object.keys(state.props||{}).map(Number).filter(i=>state.props[i].o===meIdx).sort((a,b)=>a-b);
  el.innerHTML=owned.length?owned.map(i=>{const s=SQ[i],pr=state.props[i];return `<button class="chip ${pr.m?'m':''}" data-sel="${i}"><span class="sw" style="background:${s.t==='prop'?G[s.g].c:'var(--muted)'}"></span>${esc(s.s)}${pr.h?` · ${pr.h===5?'hotel':pr.h+(pr.h>1?' casas':' casa')}`:''}</button>`}).join(''):'<span class="note">Ainda não tens propriedades.</span>';
  el.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{ sel=+b.dataset.sel; render(); $('#detail')?.scrollIntoView({behavior:'smooth',block:'nearest'}) });
}
function renderDetail(meIdx){
  const el=$('#detail'); if(!el) return; if(sel===null){ el.hidden=true; return } el.hidden=false;
  const st=state, s=SQ[sel], pr=st.props?.[sel];
  const col=s.t==='prop'?G[s.g].c:'#33427A';
  let h=`<div class="head" style="background:${col}"><span>${esc(s.n)}</span>${icon(s.ic)}</div>`;
  if(s.t==='prop'){
    h+=`<table><tr><td>Renda</td><td>${fmt(s.r[0])}</td></tr><tr><td>Com a cor completa</td><td>${fmt(s.r[0]*2)}</td></tr>
      ${[1,2,3,4].map(k=>`<tr><td>Com ${k} casa${k>1?'s':''}</td><td>${fmt(s.r[k])}</td></tr>`).join('')}<tr><td>Com hotel</td><td>${fmt(s.r[5])}</td></tr>
      <tr><td>Preço · construção</td><td>${fmt(s.p)} · ${fmt(G[s.g].hc)}</td></tr><tr><td>Hipoteca</td><td>${fmt(s.p/2)}</td></tr></table>`;
  } else if(s.t==='rail'){ h+=`<table><tr><td>1 transporte</td><td>25 €</td></tr><tr><td>2 transportes</td><td>50 €</td></tr><tr><td>3 transportes</td><td>100 €</td></tr><tr><td>4 transportes</td><td>200 €</td></tr><tr><td>Preço</td><td>${fmt(s.p)}</td></tr></table>` }
  else if(s.t==='util'){ h+=`<p class="note" style="margin:0">Renda: 4× o valor dos dados com uma companhia, 10× com as duas. Preço ${fmt(s.p)}.</p>` }
  else if(s.t==='tax'){ h+=`<p style="margin:0">Paga ${fmt(s.p)} ao banco.</p>` }
  else { h+=`<p class="note" style="margin:0">${{go:'Recebes 200 € de mesada sempre que passares aqui.',jail:'Se estás só de visita, não acontece nada.',free:'Descansa. Não acontece nada.',gotojail:'Vais direto para a Prisão.',chance:'Tira uma carta de Sorte.',chest:'Tira uma carta da Caixa Comum.'}[s.t]}</p>` }
  if(pr){
    h+=`<p style="margin:0">Dono: <b>${esc(pname(st,pr.o))}</b>${pr.h?` · ${pr.h===5?'hotel':pr.h+' casa(s)'}`:''}${pr.m?' · <span class="neg">hipotecada</span>':''}</p>`;
    if(pr.o===meIdx && st.turn===meIdx && st.status==='playing'){
      const canBuild=s.t==='prop'&&ownsGroup(st,meIdx,s.g)&&groupOf(s.g).every(j=>!st.props[j].m)&&pr.h<5;
      if(canBuild) h+=`<button class="btn buildbtn" data-p="build">${pr.h===4?HOTEL+' Construir hotel':HOUSE+' Construir casa'} <span>${fmt(G[s.g].hc)}</span></button>`;
      else if(s.t==='prop'&&!ownsGroup(st,meIdx,s.g)) h+=`<p class="note" style="margin:0">Para construir precisas de ter a cor toda.</p>`;
      h+=`<div class="row">${s.t==='prop'&&pr.h?`<button class="btn small" data-p="sell">Vender construção (+${fmt(G[s.g].hc/2)})</button>`:''}
        ${pr.m?`<button class="btn small" data-p="unmortgage">Pagar hipoteca (${fmt(Math.ceil(s.p*.55))})</button>`:(pr.h?'':`<button class="btn mortbtn" id="mortbtn">🏦 Hipotecar · recebes ${fmt(s.p/2)}</button>`)}</div>`;
    }
    if(st.status==='playing'&&meIdx>=0&&!st.players[meIdx].out){
      const ok=tradeable(st,sel), why=ok?'':'<p class="note" style="margin:0">Para negociar, vende primeiro as casas desta cor.</p>';
      if(pr.o!==meIdx&&!st.players[pr.o].out){
        h+=ok?`<button class="btn primary small" data-dealget="${pr.o}">🤝 Propor negócio a ${esc(pname(st,pr.o))} por esta propriedade</button>`:why;
      } else if(pr.o===meIdx){
        const others=st.players.map((q,k)=>k).filter(k=>k!==meIdx&&!st.players[k].out);
        h+=ok?`<div class="dealto"><span class="eyebrow">Oferecer ou vender a</span><div class="row">${others.map(k=>`<button class="btn small" data-dealgive="${k}" style="--pc:${st.players[k].color}"><span class="dot"></span>${esc(st.players[k].name)}</button>`).join('')}</div></div>`:why;
      }
    }
  } else if(BUYABLE(s.t)) h+=`<p class="note" style="margin:0">À venda.</p>`;
  h+=`<button class="btn small" id="closedet">Fechar</button>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>act(b.dataset.p,{i:sel}));
  const mb=$('#mortbtn'); if(mb){ const i=sel; confirmBtn(mb,`Tens a certeza? Hipotecar ${SQ[i].s}`,()=>act('mortgage',{i}),'mort:'+i) }
  el.querySelectorAll('[data-dealget]').forEach(b=>b.onclick=()=>openTrade(meIdx,+b.dataset.dealget,{get:[sel]}));
  el.querySelectorAll('[data-dealgive]').forEach(b=>b.onclick=()=>openTrade(meIdx,+b.dataset.dealgive,{give:[sel]}));
  $('#closedet').onclick=()=>{ sel=null; render() };
}

/* ---------- JOGADOR: NEGOCIAR / DOAR ---------- */
function closeModal(){ $('#modal').hidden=true; update3D() }
function openPlayer(meIdx,i){
  const st=state, p=st.players[i], m=$('#modal');
  const owned=Object.keys(st.props||{}).map(Number).filter(k=>st.props[k].o===i).sort((a,b)=>a-b);
  const canDeal=meIdx>=0&&i!==meIdx&&st.status==='playing'&&!p.out&&!st.players[meIdx].out;
  m.innerHTML=`<div class="modal" role="dialog" aria-label="${esc(p.name)}">
    <div class="row">${pawnP(p,'style="width:40px"')}<div><h2>${esc(p.name)} <span class="money">${fmt(worth(st,i))}</span></h2><span class="note">propriedades: ${fmt(worth(st,i)-p.money)} ; dinheiro: <span class="${p.money<0?'neg':''}">${fmt(p.money)}</span></span></div></div>
    <div class="eyebrow">Propriedades</div>
    <div class="chips">${owned.length?owned.map(k=>`<span class="chip ${st.props[k].m?'m':''}"><span class="sw" style="background:${SQ[k].t==='prop'?G[SQ[k].g].c:'var(--muted)'}"></span>${esc(SQ[k].s)}</span>`).join(''):'<span class="note">Nenhuma.</span>'}</div>
    <div class="eyebrow">Cartas especiais</div>
    <div class="note">${SKEYS.filter(k=>inv(p)[k]).map(k=>`${SPECIAL[k].n} ×${inv(p)[k]}`).join(' · ')||'Nenhuma.'}</div>
    ${canDeal?`<div class="row"><button class="btn primary" id="dealbtn">Negociar com ${esc(p.name)}</button></div>
    <div class="eyebrow">Doar dinheiro</div>
    <div class="row"><input id="donamt" type="number" min="1" step="10" placeholder="Valor em €" style="width:140px"><button class="btn" id="donbtn">Doar a ${esc(p.name)}</button></div>`
    : i===meIdx?`<p class="note" style="margin:0">Este és tu. Toca noutro jogador para negociar ou doar.</p><div class="eyebrow">A tua foto no peão</div>${photoCtl(p)}`:''}
    <div class="row"><button class="btn" id="closem">Fechar</button></div></div>`;
  m.hidden=false; m.onclick=e=>{ if(e.target===m) closeModal() };
  $('#closem').onclick=closeModal; m.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{ closeModal(); b.dataset.photo==='pick'?pickPhoto():removePhoto() });
  $('#dealbtn')&&($('#dealbtn').onclick=()=>openTrade(meIdx,i,{}));
  $('#donbtn')&&($('#donbtn').onclick=()=>{
    const v=Math.floor(+$('#donamt').value||0); if(v<=0) return toast('Escreve um valor.');
    const b=$('#donbtn'); if(!b.dataset.sure){ b.dataset.sure=1; b.textContent=`Confirmar ${fmt(v)}?`; return }
    closeModal(); act('donate',{to:i,amt:v});
  });
}
function openTrade(meIdx,to,pre){
  const st=state, m=$('#modal');
  const propsOf=pi=>Object.keys(st.props).map(Number).filter(i=>st.props[i].o===pi&&tradeable(st,i)).sort((a,b)=>a-b);
  const box=(pi,name,picked)=>propsOf(pi).map(i=>`<label class="pk"><input type="checkbox" name="${name}" value="${i}" ${picked.includes(i)?'checked':''}><span class="sw" style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${SQ[i].t==='prop'?G[SQ[i].g].c:'var(--muted)'}"></span>${esc(SQ[i].s)}${st.props[i].m?' (hipotecada)':''}</label>`).join('')||'<span class="note">Sem propriedades negociáveis.</span>';
  const cards=(pi,name,picked)=>{ const p=st.players[pi]; const ks=SKEYS.filter(k=>inv(p)[k]); return ks.length?ks.map(k=>`<div class="cardin"><label for="${name}-${k}">${SPECIAL[k].n} (tem ${inv(p)[k]})</label><input id="${name}-${k}" type="number" min="0" max="${inv(p)[k]}" value="${(picked||{})[k]||0}"></div>`).join(''):'' };
  const o=st.players[to];
  m.innerHTML=`<div class="modal" role="dialog" aria-label="Negociar"><h2>${pre.counter?'Contraproposta a':'Negociar com'} ${esc(o.name)}</h2>
    <p class="note" style="margin:0">Escolhe o que dás e o que queres receber. ${esc(o.name)} pode aceitar, recusar ou responder com uma contraproposta.</p>
    <div class="tcols">
      <div><div class="eyebrow">Tu dás</div>${box(meIdx,'give',pre.give||[])}${cards(meIdx,'gc',pre.gc)}
        <label for="tgm" class="eyebrow" style="display:block;margin-top:10px">Dinheiro (tens ${fmt(st.players[meIdx].money)})</label>${st.players[meIdx].money<0?'<p class="note" style="margin:4px 0 0">Estás a dever: pede dinheiro do outro lado em troca de propriedades ou cartas.</p>':''}<input id="tgm" type="number" min="0" step="10" value="${pre.gm||0}" style="width:100%"></div>
      <div><div class="eyebrow">Recebes de ${esc(o.name)}</div>${box(to,'get',pre.get||[])}${cards(to,'tc',pre.tc)}
        <label for="ttm" class="eyebrow" style="display:block;margin-top:10px">Dinheiro (tem ${fmt(o.money)})</label><input id="ttm" type="number" min="0" step="10" value="${pre.tm||0}" style="width:100%"></div>
    </div>
    <p class="note" style="margin:0">Propriedades com construções no grupo não podem ser negociadas.</p>
    <div class="row"><button class="btn primary" id="tsend">${pre.counter?'Enviar contraproposta':'Enviar proposta'}</button><button class="btn" id="tclose">Cancelar</button></div></div>`;
  m.hidden=false; m.onclick=e=>{ if(e.target===m) closeModal() };
  $('#tclose').onclick=closeModal;
  $('#tsend').onclick=()=>{
    const v=n=>[...m.querySelectorAll(`input[name=${n}]:checked`)].map(x=>+x.value);
    const rc=n=>{ const r={}; SKEYS.forEach(k=>{ const e=$(`#${n}-${k}`); r[k]=e?Math.max(0,Math.floor(+e.value||0)):0 }); return r };
    const t={to,give:v('give'),get:v('get'),gm:Math.max(0,Math.floor(+$('#tgm').value||0)),tm:Math.max(0,Math.floor(+$('#ttm').value||0)),gc:rc('gc'),tc:rc('tc')};
    if(t.gm>0&&t.gm>st.players[meIdx].money) return toast(st.players[meIdx].money<0?'Estás a dever: não podes dar dinheiro, só pedir.':'Não tens esse dinheiro.');
    if(t.tm>0&&t.tm>o.money) return toast(`${o.name} não tem esse dinheiro.`);
    closeModal(); if(pre.counter) t.id=pre.counter; act(pre.counter?'counter':'propose',t);
  };
}

let trig={}, botBusy=false, botNext=0;
function fire(name){ const now=Date.now(); if(trig[name]&&now-trig[name]<4000) return; trig[name]=now; mutate(A[name],{},code,true) }
// quem dispara os eventos automáticos: o anfitrião logo; os outros só se o anfitrião não o fizer
const lag=st=>st.host===me.id?0:4000+((st.players.findIndex(p=>p.id===me.id)+1)*700);
function clock(ms){ ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor(ms/1000)%60; return `⏱ ${m}:${String(s).padStart(2,'0')}` }
setInterval(()=>{
  const st=state; if(!st||!code||st.status!=='playing') return;
  const now=Date.now(), c=cfg(st);
  const gt=$('#gametimer'); if(gt&&st.endsAt){ gt.textContent=clock(st.endsAt-now); gt.closest('.gtimer')?.classList.toggle('low',st.endsAt-now<5*60000) }
  const tt=$('#turntimer'); if(tt&&c.turnTime){ const left=Math.max(0,Math.ceil(((st.turnAt||0)+turnLimit(st,st.players[st.turn])-now)/1000)); tt.textContent=left+' s'; tt.classList.toggle('low',left<=10) }
  const at=$('#auctimer'); if(at&&st.auction) at.textContent=Math.max(0,Math.ceil((st.auction.endsAt-now)/1000));
  if(document.hidden) return;
  if(st.endsAt&&now>=st.endsAt+lag(st)) fire('timeUp');
  if(st.phase==='auction'&&st.auction&&now>=st.auction.endsAt+300+lag(st)) fire('auctionEnd');
  const cur=st.players[st.turn];
  if(c.turnTime&&cur&&!cur.bot&&['roll','buy','end'].includes(st.phase)&&now>=(st.turnAt||0)+turnLimit(st,cur)+(cur.id===me.id?0:1500+lag(st))) fire('timeout');
  // bots: o anfitrião controla-os; se o anfitrião sair, qualquer jogador assume ao fim de 12 s
  const hasBots=st.players.some(p=>p.bot&&!p.out); if(!hasBots||botBusy||now<botNext) return;
  if(st.host!==me.id&&now-(st.updatedAt||0)<12000) return;
  if(rolling||walking||(inHold()&&st.phase!=='auction')) return;
  const needs=(st.phase==='auction')||(st.trades||[]).some(t=>st.players[t.to]?.bot)||(cur&&cur.bot);
  if(!needs) return;
  botBusy=true;
  mutate(A.botStep,{},code,true).finally(()=>{ botBusy=false; botNext=Date.now()+(st.phase==='auction'?700+Math.random()*1300:900) });
},500);

boot();
</script>
