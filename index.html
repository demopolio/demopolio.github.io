<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DEMopólio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: tabuleiro de azulejo à esquerda, painel de jogo à direita; no telemóvel o tabuleiro desliza na horizontal */
:root{
  --bg:#EEF2FA; --surface:#FFFFFF; --tile:#F8FAFE; --ink:#0F1C44; --muted:#5A6688;
  --line:#C3CDE6; --cobalt:#1F47C2; --cobalt-soft:#DCE4FA; --gold:#B57A0E; --danger:#C2362B; --ok:#167A4A;
  --pattern:rgba(31,71,194,.09); --pawn-edge:#FFFFFF; --shadow:0 6px 24px rgba(15,28,68,.14);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0A1022; --surface:#121A33; --tile:#17213D; --ink:#E7ECFA; --muted:#9AA6C8;
  --line:#2C3963; --cobalt:#7C9BFF; --cobalt-soft:#1E2A55; --gold:#E7B44A; --danger:#FF7B6E; --ok:#4FD08F;
  --pattern:rgba(124,155,255,.09); --pawn-edge:#C9D3F0; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark }}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto}
.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:var(--bg)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;color:var(--ink);background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{color:var(--muted);font-size:13px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:14px}
.banner.warn{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}

/* HOME */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:28px}
.hero h1{font-size:clamp(40px,7vw,76px);font-weight:800;line-height:.95}
.hero h1 span{color:var(--cobalt)}
.hero p{max-width:52ch;color:var(--muted);margin:12px 0 0}
.azulejo{aspect-ratio:1;max-width:100%;border-radius:18px;border:1px solid var(--line);
  background:radial-gradient(circle at 50% 50%,transparent 18%,var(--pattern) 19% 22%,transparent 23%) 0 0/50% 50%,
   conic-gradient(from 45deg at 50% 50%,var(--pattern) 0 25%,transparent 0 50%,var(--pattern) 0 75%,transparent 0) 0 0/25% 25%,var(--surface);
  display:grid;place-items:center}
.azulejo .seal{display:flex;gap:6px;align-items:flex-end;background:var(--surface);padding:14px 22px;border-radius:999px;border:2px solid var(--cobalt)}
.azulejo .seal svg{width:44px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:20px}
.roomlist{display:flex;flex-direction:column;gap:8px}
.roomitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--tile)}
.code{font-family:var(--f-mono);font-weight:700;letter-spacing:.08em}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--cobalt-soft);color:var(--cobalt);text-transform:uppercase;letter-spacing:.06em}
.pill.live{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}

/* JOGO */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.topbar h1{font-size:26px;font-weight:800}
.game{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.boardwrap{overflow-x:auto;overflow-y:hidden;border-radius:18px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.board{container-type:inline-size;position:relative;aspect-ratio:1;width:100%;display:grid;grid-template-columns:1.6fr repeat(9,1fr) 1.6fr;grid-template-rows:1.6fr repeat(9,1fr) 1.6fr;gap:2px;background:var(--line);border:3px solid var(--line);border-radius:18px;overflow:hidden}
.swipe{display:none}
.cell{position:relative;display:flex;background:var(--tile);overflow:hidden;border:0;padding:0;color:var(--ink);min-width:0;min-height:0;text-align:center}
.cell:hover{background:color-mix(in srgb,var(--cobalt-soft) 70%,var(--tile))}
.cell.sel{outline:3px solid var(--cobalt);outline-offset:-3px;z-index:3}
.cell.b{flex-direction:column}.cell.t{flex-direction:column-reverse}.cell.l{flex-direction:row-reverse}.cell.r{flex-direction:row}
.band{flex:none;display:flex;align-items:center;justify-content:center;gap:1px;position:relative;z-index:1}
.cell.b .band,.cell.t .band{height:21%}
.cell.l .band,.cell.r .band{width:21%;flex-direction:column}
.band .bld{display:flex;align-items:flex-end;gap:1px;background:var(--surface);border-radius:4px;padding:1px 2px}
.cell.l .band .bld,.cell.r .band .bld{flex-direction:column;align-items:center}
.band svg.h{width:clamp(7px,1.25cqw,13px);height:auto}
.band svg.hotel{width:clamp(13px,2.4cqw,24px);height:auto}
.cell.l .band svg.hotel,.cell.r .band svg.hotel{width:clamp(11px,1.9cqw,20px)}
.cbody{flex:1;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:4px 3px 3px;min-width:0;min-height:0;position:relative;z-index:1;gap:2px}
.nm{font-size:clamp(7px,1.3cqw,12.5px);font-weight:700;line-height:1.1;text-wrap:balance;overflow-wrap:anywhere;hyphens:auto}
.pr{font-family:var(--f-mono);font-size:clamp(6.5px,1.1cqw,11px);color:var(--muted);font-weight:500}
.bgic{position:absolute;left:50%;top:50%;width:62%;max-width:58px;transform:translate(-50%,-46%);opacity:.16;color:var(--ink);pointer-events:none;z-index:0}
.cell.corner .bgic{opacity:.2;width:52%;max-width:70px}
.cell.corner{flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:6px}
.cell.corner .nm{font-family:var(--f-display);font-weight:800;font-size:clamp(9px,1.7cqw,16px)}
.cell.corner .sub{font-size:clamp(6.5px,1.05cqw,10.5px);color:var(--muted);font-weight:600}
.cell .mort{position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--danger) 20%,transparent) 6px 8px);pointer-events:none;z-index:2}
.cell .ownflag{position:absolute;z-index:2;width:clamp(8px,1.4cqw,14px);height:clamp(8px,1.4cqw,14px);border-radius:50%;border:2px solid var(--surface);right:3px;bottom:3px}
.tokens{position:absolute;inset:auto 0 4% 0;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;pointer-events:none;z-index:4;padding:0 2px}
.cell.corner .tokens{bottom:6%}
.pawn{width:clamp(15px,2.9cqw,30px);height:auto;margin:0 -2px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.pawn.hop{animation:hop .17s ease-out}
@keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-35%)}100%{transform:translateY(0)}}
.center{grid-column:2 / span 9;grid-row:2 / span 9;position:relative;background:
   radial-gradient(circle at 50% 50%,transparent 18%,var(--pattern) 19% 22%,transparent 23%) 0 0/22.2% 22.2%,
   conic-gradient(from 45deg at 50% 50%,var(--pattern) 0 25%,transparent 0 50%,var(--pattern) 0 75%,transparent 0) 0 0/11.1% 11.1%,var(--surface);
   display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.6cqw,16px);padding:6%;min-width:0;min-height:0}
.center .logo{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,6cqw,62px);color:var(--cobalt);line-height:1;background:var(--surface);padding:.08em .35em;border-radius:14px;text-align:center}
.center .logo small{display:block;font-family:var(--f-body);font-size:.24em;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:.3em}
.center .now{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-weight:700;font-size:clamp(11px,1.6cqw,15px)}
.center .now svg{width:clamp(16px,2.6cqw,26px)}
.dice{display:flex;gap:clamp(8px,1.6cqw,16px)}
.die{width:clamp(36px,7cqw,66px);aspect-ratio:1;background:var(--surface);border:2px solid var(--ink);border-radius:22%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14%;box-shadow:0 3px 0 var(--ink)}
.die i{width:70%;aspect-ratio:1;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.dice.rolling .die{animation:tumble .32s linear infinite}
.dice.rolling .die:nth-child(2){animation-direction:reverse}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(-18deg) translateY(-12%)}50%{transform:rotate(12deg) translateY(4%)}75%{transform:rotate(-8deg) translateY(-6%)}100%{transform:rotate(0) translateY(0)}}
.cardnote{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;max-width:min(92%,380px);text-align:center;font-size:clamp(11px,1.5cqw,14.5px)}
.cardnote b{display:block;font-family:var(--f-display);color:var(--gold);font-size:.85em;letter-spacing:.08em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.dice.rolling .die,.pawn.hop{animation:none}}

.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.actions .turn{font-family:var(--f-display);font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.actions .turn svg{width:26px}
.players{display:flex;flex-direction:column;gap:6px}
.pl{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid transparent;background:none;color:var(--ink);text-align:left;width:100%}
.pl:hover{border-color:var(--line)}
.pl.cur{border-color:var(--cobalt);background:var(--cobalt-soft)}
.pl.out{opacity:.45}
.pl svg{width:28px}
.pl .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pl .who small{font-weight:500;color:var(--muted)}
.neg{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--tile);font-size:12.5px;color:var(--ink)}
.chip .sw{width:10px;height:10px;border-radius:2px;flex:none}
.chip.m{opacity:.55;text-decoration:line-through}
.spcard{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--tile)}
.spcard .ico{width:40px;height:52px;border-radius:7px;display:grid;place-items:center;background:var(--cobalt);color:var(--bg);font-family:var(--f-display);font-weight:800;font-size:18px}
.spcard .ico svg{width:24px;stroke:var(--bg)}
.spcard b{display:block}
.detail table{width:100%;border-collapse:collapse;font-size:13px}
.detail td{padding:4px 0;border-bottom:1px solid var(--line)}
.detail td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.detail .head{border-radius:10px;padding:12px;color:#fff;font-family:var(--f-display);font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.detail .head svg{width:34px;flex:none;opacity:.9}
.log{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:13px}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:70;max-width:90vw}
.notes{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;z-index:60;width:min(360px,calc(100vw - 24px));pointer-events:none}
.nt{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);font-size:14px;animation:slidein .25s ease-out;pointer-events:auto}
.nt svg{width:26px;flex:none}
.nt .amt{margin-left:auto;font-family:var(--f-mono);font-weight:700;white-space:nowrap}
.nt.me{border-color:var(--cobalt)}
.nt.gain .amt{color:var(--ok)}.nt.loss .amt{color:var(--danger)}
.nt.go{border-color:var(--gold)}
@keyframes slidein{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.modalbg{position:fixed;inset:0;background:rgba(5,10,25,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(600px,100%);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.tcols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tcols label.pk{display:flex;gap:6px;align-items:center;font-size:13px;padding:3px 0}
.tcols .cardin{display:grid;grid-template-columns:1fr 64px;gap:6px;align-items:center;font-size:13px}
.lobbylist{display:flex;flex-direction:column;gap:8px}
.tok{display:inline-block}
@media (max-width:980px){
  .game{display:flex;flex-direction:column;align-items:stretch;gap:14px}
  .game>*,.side>*{width:100%;min-width:0}
  .side{display:contents}
  #actions{order:-1}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero .azulejo{display:none}
}
@media (max-width:780px){
  .board{width:780px}
  .swipe{display:block;margin-top:6px}
}
@media (max-width:640px){
  .cards{grid-template-columns:minmax(0,1fr)}
  .tcols{grid-template-columns:1fr}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="wrap" id="app"><div class="banner">A carregar…</div></div>
<div id="notes" class="notes" aria-live="polite"></div>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modalbg" hidden></div>

/* ===================== REGRAS ===================== */
const groupOf = g => SQ.map((s,i)=>s.g===g?i:-1).filter(i=>i>=0);
const fmt = n => (n<0?'−':'')+Math.abs(n).toLocaleString('pt-PT')+' €';
const roll6 = () => 1+Math.floor(Math.random()*6);
function log(st,msg){ st.log=[msg,...(st.log||[])].slice(0,60) }
function pname(st,i){ return st.players[i]?.name||'?' }
function inv(p){ if(!p.inv) p.inv={jail:0,borla:0,extra:0}; return p.inv }
function ownsGroup(st,pi,g){ return groupOf(g).every(i=>st.props[i]&&st.props[i].o===pi) }
function countType(st,pi,t){ return SQ.reduce((n,s,i)=>n+(s.t===t&&st.props[i]&&st.props[i].o===pi?1:0),0) }
function rentFor(st,i,dice){
  const s=SQ[i], pr=st.props[i]; if(!pr||pr.m) return 0;
  if(s.t==='prop'){ return pr.h>0 ? s.r[pr.h] : s.r[0]*(ownsGroup(st,pr.o,s.g)?2:1) }
  if(s.t==='rail'){ return 25*Math.pow(2,countType(st,pr.o,'rail')-1) }
  if(s.t==='util'){ return dice*(countType(st,pr.o,'util')===2?10:4) }
  return 0;
}
function event(st,e){ st.evN=(st.evN||0)+1; e.n=st.evN; st.ev=[...(st.ev||[]),e].slice(-20) }
function pay(st,from,to,amt,why){
  if(!amt) return;
  if(from!==null) st.players[from].money-=amt;
  if(to!==null) st.players[to].money+=amt;
  if(why!==null&&why!==undefined) event(st,{a:from,b:to,v:amt,w:why});
}
function passGo(st,pi){
  const p=st.players[pi]; p.money+=GO_MONEY; p.laps=(p.laps||0)+1;
  log(st,`${p.name} passou pela Partida e recebeu a mesada dos pais (${fmt(GO_MONEY)}).`);
  event(st,{a:null,b:pi,v:GO_MONEY,w:'mesada dos pais',go:true});
}
function moveBy(st,pi,steps){
  const p=st.players[pi], np=((p.pos+steps)%40+40)%40;
  if(steps>0 && np<p.pos) passGo(st,pi);
  p.pos=np;
}
function moveTo(st,pi,target){
  const p=st.players[pi];
  if(target<p.pos || target===0) passGo(st,pi);
  p.pos=target;
}
function sendJail(st,pi){
  const p=st.players[pi]; p.pos=10; p.inJail=true; p.jailTurns=0; st.again=false;
  log(st,`${p.name} foi para a Prisão.`);
}
function land(st,pi,dice,depth=0){
  const p=st.players[pi], i=p.pos, s=SQ[i];
  if(BUYABLE(s.t)){
    const pr=st.props[i];
    if(!pr){
      if((p.laps||0)<1){ log(st,`${p.name} ainda está na primeira volta e não pode comprar ${s.n}.`); return }
      st.phase='buy'; st.pendingBuy=i; return
    }
    if(pr.o===pi) return;
    if(pr.m){ log(st,`${s.n} está hipotecada: ${p.name} não paga renda.`); return }
    if(p.shield){ log(st,`${p.name} usou a Borla e não pagou renda em ${s.s}.`); return }
    const r=rentFor(st,i,dice); pay(st,pi,pr.o,r,`renda de ${s.s}`);
    log(st,`${p.name} pagou ${fmt(r)} de renda a ${pname(st,pr.o)} (${s.s}).`);
  } else if(s.t==='tax'){ pay(st,pi,null,s.p,s.n); log(st,`${p.name} pagou ${fmt(s.p)} de ${s.n}.`) }
  else if(s.t==='gotojail'){ sendJail(st,pi) }
  else if((s.t==='chance'||s.t==='chest') && depth<3){
    const deck=s.t==='chance'?CHANCE:CHEST, c=deck[Math.floor(Math.random()*deck.length)];
    st.card={deck:s.n,x:c.x,by:pi}; log(st,`${p.name} tirou ${s.n}: ${c.x}`);
    applyCard(st,pi,c,dice,depth);
  }
}
function applyCard(st,pi,c,dice,depth){
  const p=st.players[pi], others=st.players.map((q,j)=>j).filter(j=>j!==pi&&!st.players[j].out);
  switch(c.a){
    case 'money': c.v>0 ? pay(st,null,pi,c.v,c.w) : pay(st,pi,null,-c.v,c.w); break;
    case 'moveTo': moveTo(st,pi,c.v); land(st,pi,dice,depth+1); break;
    case 'back': moveBy(st,pi,-c.v); land(st,pi,dice,depth+1); break;
    case 'rail': { let t=p.pos; do{t=(t+1)%40}while(SQ[t].t!=='rail'); moveTo(st,pi,t); land(st,pi,dice,depth+1); break }
    case 'jail': sendJail(st,pi); break;
    case 'card': inv(p)[c.k]=(inv(p)[c.k]||0)+1; break;
    case 'repairs': { let tot=0; Object.values(st.props).forEach(pr=>{ if(pr.o===pi&&pr.h) tot+= pr.h===5?c.v[1]:pr.h*c.v[0] }); pay(st,pi,null,tot,'obras'); if(tot) log(st,`${p.name} pagou ${fmt(tot)} em obras.`); break }
    case 'payEach': others.forEach(j=>pay(st,pi,j,c.v,c.w)); break;
    case 'collectEach': others.forEach(j=>pay(st,j,pi,c.v,c.w)); break;
  }
}
function nextPhase(st,pi){ st.phase = (st.again && !st.players[pi].inJail) ? 'roll' : 'end' }
function alive(st){ return st.players.map((p,i)=>i).filter(i=>!st.players[i].out) }
function advanceTurn(st){
  const cur=st.players[st.turn]; if(cur) cur.shield=false;
  const n=st.players.length; let t=st.turn;
  for(let k=0;k<n;k++){ t=(t+1)%n; if(!st.players[t].out) break }
  st.turn=t; st.phase='roll'; st.dbl=0; st.again=false; st.pendingBuy=null;
  log(st,`Vez de ${pname(st,t)}.`);
}
function bankrupt(st,pi,why){
  const p=st.players[pi]; p.out=true; p.money=0; p.inv={jail:0,borla:0,extra:0}; p.shield=false;
  Object.keys(st.props).forEach(k=>{ if(st.props[k].o===pi) delete st.props[k] });
  log(st,why||`${p.name} declarou falência. As propriedades voltaram ao banco.`);
  if(st.trade && (st.trade.from===pi||st.trade.to===pi)) st.trade=null;
  const a=alive(st);
  if(a.length<=1){ st.status='ended'; st.winner=a[0]??null; st.phase='over'; log(st,`${pname(st,a[0])} ganhou o jogo!`); return }
  if(st.turn===pi) advanceTurn(st);
}
function tradeable(st,i){ const s=SQ[i]; if(s.t!=='prop') return true; return groupOf(s.g).every(j=>!st.props[j]||!st.props[j].h) }
function myIdx(st){ return st.players.findIndex(p=>p.id===me.id) }
function myTurn(st){ const i=st.turn; return st.status==='playing'&&st.players[i]&&st.players[i].id===me.id ? i : -1 }
function cleanCards(o){ const r={}; SKEYS.forEach(k=>r[k]=Math.max(0,Math.floor(+((o||{})[k])||0))); return r }
function validTrade(st,t){
  const f=st.players[t.from], o=st.players[t.to];
  if(!f||!o||f.out||o.out) return 'Um dos jogadores já não está em jogo.';
  if(!t.give.every(i=>st.props[i]&&st.props[i].o===t.from&&tradeable(st,i))) return `As propriedades de ${f.name} mudaram.`;
  if(!t.get.every(i=>st.props[i]&&st.props[i].o===t.to&&tradeable(st,i))) return `As propriedades de ${o.name} mudaram.`;
  if(f.money<t.gm) return `${f.name} já não tem esse dinheiro.`;
  if(o.money<t.tm) return `${o.name} já não tem esse dinheiro.`;
  if(SKEYS.some(k=>(inv(f)[k]||0)<t.gc[k])) return `${f.name} já não tem essas cartas.`;
  if(SKEYS.some(k=>(inv(o)[k]||0)<t.tc[k])) return `${o.name} já não tem essas cartas.`;
  return null;
}
function emptyTrade(t){ return !t.give.length&&!t.get.length&&!t.gm&&!t.tm&&SKEYS.every(k=>!t.gc[k]&&!t.tc[k]) }

/* ===================== AÇÕES (correm dentro de uma transação) ===================== */
const A = {
  join(st,{name}){
    if(st.players.some(p=>p.id===me.id)) return true;
    if(st.status!=='lobby') return 'O jogo desta sala já começou.';
    if(st.players.length>=MAXP) return `A sala está cheia (máx. ${MAXP}).`;
    const used=st.players.map(p=>p.color);
    st.players.push({id:me.id,name:name.slice(0,18),color:COLORS.find(c=>!used.includes(c))});
    log(st,`${name} entrou na sala.`);
  },
  leave(st){
    if(st.status!=='lobby') return 'Não podes sair a meio do jogo; declara falência.';
    const i=myIdx(st); if(i<0) return false;
    log(st,`${st.players[i].name} saiu da sala.`); st.players.splice(i,1);
    if(st.host===me.id && st.players[0]) st.host=st.players[0].id;
  },
  kick(st,{idx}){
    if(st.host!==me.id) return 'Só o anfitrião pode retirar jogadores.';
    if(st.status==='lobby'){ log(st,`${st.players[idx].name} foi retirado.`); st.players.splice(idx,1); return }
    if(st.status==='playing') bankrupt(st,idx,`${st.players[idx].name} foi retirado pelo anfitrião.`);
  },
  start(st){
    if(st.host!==me.id) return 'Só o anfitrião pode começar.';
    if(st.players.length<2) return 'São precisos pelo menos 2 jogadores.';
    st.players.sort(()=>Math.random()-.5);
    st.players.forEach(p=>Object.assign(p,{pos:0,money:START_MONEY,inJail:false,jailTurns:0,laps:0,inv:{jail:0,borla:0,extra:0},shield:false,out:false}));
    Object.assign(st,{status:'playing',turn:0,phase:'roll',dice:[1,1],rollId:0,dbl:0,again:false,props:{},card:null,trade:null,pendingBuy:null,winner:null,ev:[],evN:0,startedAt:Date.now()});
    log(st,`O jogo começou! ${st.players[0].name} joga primeiro. Na primeira volta ninguém compra: só depois de passarem pela Partida.`);
  },
  roll(st){
    const pi=myTurn(st); if(pi<0||st.phase!=='roll') return false;
    const p=st.players[pi]; if(p.money<0) return 'Tens saldo negativo: vende ou hipoteca antes de lançar.';
    const d=[roll6(),roll6()], sum=d[0]+d[1], doubles=d[0]===d[1];
    st.dice=d; st.rollId=(st.rollId||0)+1; st.card=null;
    log(st,`${p.name} lançou ${d[0]} + ${d[1]}${doubles?' (duplos)':''}.`);
    if(p.inJail){
      if(doubles){ p.inJail=false; p.jailTurns=0; log(st,`${p.name} saiu da Prisão com duplos.`); st.again=false; moveBy(st,pi,sum); land(st,pi,sum) }
      else { p.jailTurns++;
        if(p.jailTurns>=3){ pay(st,pi,null,JAIL_FEE,'fiança'); p.inJail=false; p.jailTurns=0; log(st,`${p.name} pagou ${fmt(JAIL_FEE)} e saiu da Prisão.`); st.again=false; moveBy(st,pi,sum); land(st,pi,sum) }
        else { st.phase='end'; return } }
    } else {
      if(doubles){ st.dbl=(st.dbl||0)+1; if(st.dbl>=3){ log(st,`Três duplos seguidos!`); sendJail(st,pi); st.phase='end'; return } }
      st.again=doubles; moveBy(st,pi,sum); land(st,pi,sum);
    }
    if(st.phase!=='buy') nextPhase(st,pi);
  },
  payJail(st){
    const pi=myTurn(st), p=st.players[pi]; if(pi<0||!p.inJail||st.phase!=='roll') return false;
    if(p.money<JAIL_FEE) return 'Não tens dinheiro para a fiança.';
    pay(st,pi,null,JAIL_FEE,'fiança'); p.inJail=false; p.jailTurns=0; log(st,`${p.name} pagou a fiança de ${fmt(JAIL_FEE)}.`);
  },
  useCard(st,{k}){
    const pi=myTurn(st); if(pi<0) return 'Só podes usar cartas na tua vez.';
    const p=st.players[pi], v=inv(p);
    if(!v[k]) return 'Não tens essa carta.';
    if(k==='jail'){ if(!p.inJail||st.phase!=='roll') return 'Só serve quando estás na Prisão, antes de lançares.'; p.inJail=false; p.jailTurns=0 }
    else if(k==='borla'){ if(p.shield) return 'A Borla já está ativa.'; p.shield=true }
    else if(k==='extra'){ if(st.phase!=='end'||p.inJail) return 'Usa depois de jogares, antes de passares a vez.'; st.phase='roll'; st.again=false; st.dbl=0 }
    v[k]--; log(st,`${p.name} usou a carta "${SPECIAL[k].n}".`);
  },
  buy(st){
    const pi=myTurn(st); if(pi<0||st.phase!=='buy') return false;
    const i=st.pendingBuy, s=SQ[i], p=st.players[pi];
    if(p.money<s.p) return 'Não tens dinheiro suficiente.';
    pay(st,pi,null,s.p,`compra de ${s.s}`); st.props[i]={o:pi,h:0,m:false}; st.pendingBuy=null;
    log(st,`${p.name} comprou ${s.n} por ${fmt(s.p)}.`); nextPhase(st,pi);
  },
  pass(st){
    const pi=myTurn(st); if(pi<0||st.phase!=='buy') return false;
    log(st,`${st.players[pi].name} não comprou ${SQ[st.pendingBuy].n}.`); st.pendingBuy=null; nextPhase(st,pi);
  },
  end(st){
    const pi=myTurn(st); if(pi<0||st.phase!=='end') return false;
    if(st.players[pi].money<0) return 'Resolve o saldo negativo antes de passar a vez.';
    advanceTurn(st);
  },
  build(st,{i}){
    const pi=myTurn(st); if(pi<0) return 'Só podes construir na tua vez.';
    const s=SQ[i], pr=st.props[i], p=st.players[pi];
    if(!pr||pr.o!==pi||s.t!=='prop') return false;
    const hc=G[s.g].hc, grp=groupOf(s.g);
    if(!ownsGroup(st,pi,s.g)) return 'Precisas de ter todas as propriedades desta cor.';
    if(grp.some(j=>st.props[j].m)) return 'Há propriedades hipotecadas neste grupo.';
    if(pr.h>=5) return 'Já tem hotel.';
    if(pr.h>Math.min(...grp.map(j=>st.props[j].h))) return 'Constrói de forma equilibrada no grupo.';
    if(p.money<hc) return 'Não tens dinheiro suficiente.';
    pay(st,pi,null,hc,null); pr.h++; log(st,`${p.name} construiu ${pr.h===5?'um hotel':'uma casa'} em ${s.s} (${fmt(hc)}).`);
  },
  sell(st,{i}){
    const pi=myTurn(st); if(pi<0) return 'Só podes vender na tua vez.';
    const s=SQ[i], pr=st.props[i], grp=groupOf(s.g);
    if(!pr||pr.o!==pi||!pr.h) return false;
    if(pr.h<Math.max(...grp.map(j=>st.props[j].h))) return 'Vende de forma equilibrada no grupo.';
    const v=G[s.g].hc/2; pr.h--; pay(st,null,pi,v,null); log(st,`${st.players[pi].name} vendeu uma construção em ${s.s} (+${fmt(v)}).`);
  },
  mortgage(st,{i}){
    const pi=myTurn(st); if(pi<0) return 'Só podes hipotecar na tua vez.';
    const s=SQ[i], pr=st.props[i]; if(!pr||pr.o!==pi||pr.m) return false;
    if(s.t==='prop' && groupOf(s.g).some(j=>st.props[j]&&st.props[j].h)) return 'Vende primeiro as construções deste grupo.';
    pr.m=true; pay(st,null,pi,s.p/2,null); log(st,`${st.players[pi].name} hipotecou ${s.s} (+${fmt(s.p/2)}).`);
  },
  unmortgage(st,{i}){
    const pi=myTurn(st); if(pi<0) return 'Só podes pagar a hipoteca na tua vez.';
    const s=SQ[i], pr=st.props[i]; if(!pr||pr.o!==pi||!pr.m) return false;
    const c=Math.ceil(s.p*0.55); if(st.players[pi].money<c) return 'Não tens dinheiro suficiente.';
    pr.m=false; pay(st,pi,null,c,null); log(st,`${st.players[pi].name} recuperou ${s.s} (${fmt(c)}).`);
  },
  bankrupt(st){
    const pi=myIdx(st); if(pi<0||st.status!=='playing') return false;
    bankrupt(st,pi);
  },
  donate(st,{to,amt}){
    const pi=myIdx(st); if(pi<0||st.status!=='playing'||st.players[pi].out) return false;
    amt=Math.floor(+amt||0); if(amt<=0) return 'Escolhe um valor maior que zero.';
    if(st.players[pi].money<amt) return 'Não tens esse dinheiro.';
    if(!st.players[to]||st.players[to].out||to===pi) return false;
    pay(st,pi,to,amt,'doação'); log(st,`${st.players[pi].name} doou ${fmt(amt)} a ${st.players[to].name}.`);
  },
  propose(st,t){
    const pi=myIdx(st); if(pi<0||st.status!=='playing'||st.players[pi].out) return false;
    if(st.trade) return 'Já há uma proposta em curso. Espera que seja respondida.';
    const tr={from:pi,to:t.to,give:t.give,get:t.get,gm:t.gm,tm:t.tm,gc:cleanCards(t.gc),tc:cleanCards(t.tc)};
    if(emptyTrade(tr)) return 'A proposta está vazia.';
    const bad=validTrade(st,tr); if(bad) return bad;
    st.trade=tr; log(st,`${pname(st,pi)} fez uma proposta a ${pname(st,t.to)}.`);
  },
  counter(st,t){
    const pi=myIdx(st), old=st.trade; if(!old||old.to!==pi) return 'Esta proposta já não está ativa.';
    const tr={from:pi,to:old.from,give:t.give,get:t.get,gm:t.gm,tm:t.tm,gc:cleanCards(t.gc),tc:cleanCards(t.tc)};
    if(emptyTrade(tr)) return 'A contraproposta está vazia.';
    const bad=validTrade(st,tr); if(bad) return bad;
    st.trade=tr; log(st,`${pname(st,pi)} fez uma contraproposta a ${pname(st,old.from)}.`);
  },
  accept(st){
    const t=st.trade, pi=myIdx(st); if(!t||t.to!==pi) return false;
    const bad=validTrade(st,t); if(bad){ st.trade=null; log(st,'A proposta foi anulada: '+bad); return }
    const f=st.players[t.from], o=st.players[t.to];
    t.give.forEach(i=>st.props[i].o=t.to); t.get.forEach(i=>st.props[i].o=t.from);
    if(t.gm) pay(st,t.from,t.to,t.gm,'negócio'); if(t.tm) pay(st,t.to,t.from,t.tm,'negócio');
    SKEYS.forEach(k=>{ inv(f)[k]+=t.tc[k]-t.gc[k]; inv(o)[k]+=t.gc[k]-t.tc[k] });
    st.trade=null; log(st,`${o.name} aceitou o negócio com ${f.name}.`);
  },
  reject(st){
    const t=st.trade, pi=myIdx(st); if(!t||(t.to!==pi&&t.from!==pi)) return false;
    log(st,t.from===pi?`${pname(st,pi)} cancelou a proposta.`:`${pname(st,pi)} recusou a proposta.`); st.trade=null;
  },
};

async function mutate(fn,arg){
  if(!code||!db) return;
  const ref=db.doc('rooms/'+code); let msg=null, out=null;
  try{
    await db.runTransaction(async tx=>{
      msg=null; out=null;
      const snap=await tx.get(ref);
      if(!snap.exists){ msg='Esta sala já não existe.'; return }
      const st=structuredClone(snap.data());
      const res=fn(st,arg||{});
      if(typeof res==='string'){ msg=res; return }
      if(res===false||res===true) return;
      st.rev=(st.rev||0)+1; st.updatedAt=Date.now();
      tx.set(ref,st); out=st;
    });
    if(msg) toast(msg);
    if(out) applyState(out);
  }catch(e){
    toast(e&&e.code==='permission-denied'?'Sem permissão para guardar. Confirma as regras do Firestore.':'Não consegui guardar a jogada. Tenta de novo.');
  }
}

/* ===================== ANIMAÇÕES E NOTIFICAÇÕES ===================== */
let disp={}, dispDice=[1,1], rolling=false, walking=false, lastRoll=null, lastEv=null, noteQ=[], diceTimer=null, walkTimer=null, hopped=new Set();
function resetAnim(){ disp={}; lastRoll=null; lastEv=null; noteQ=[]; rolling=false; walking=false; clearInterval(diceTimer); clearInterval(walkTimer) }
function applyState(ns){
  if(state&&state.code===ns.code&&(ns.rev||0)<(state.rev||0)) return;
  const fresh=!state||state.code!==ns.code||lastRoll===null;
  state=ns;
  if(fresh){
    lastRoll=ns.rollId||0; lastEv=ns.evN||0; dispDice=ns.dice||[1,1];
    disp={}; (ns.players||[]).forEach(p=>{ if(p.pos!==undefined) disp[p.id]=p.pos });
    render(); setTimeout(followActive,60); return;
  }
  (ns.ev||[]).forEach(e=>{ if(e.n>lastEv) noteQ.push(e) }); lastEv=Math.max(lastEv,ns.evN||0);
  const rolled=(ns.rollId||0)!==lastRoll; lastRoll=ns.rollId||0;
  render();
  if(rolled) rollDice(ns.dice,startWalk); else if(!rolling) startWalk();
}
function rollDice(final,cb){
  clearInterval(diceTimer); rolling=true; drawDice();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t=0;
  diceTimer=setInterval(()=>{ dispDice=[roll6(),roll6()]; drawDice(); if((t+=70)>=(reduce?140:840)){ clearInterval(diceTimer); dispDice=final; rolling=false; drawDice(); cb() } },70);
}
function drawDice(){ const el=$('#dice'); if(!el) return; el.className='dice'+(rolling?' rolling':''); el.innerHTML=dieHTML(dispDice[0])+dieHTML(dispDice[1]) }
function startWalk(){
  if(!state||!state.players) return;
  clearInterval(walkTimer);
  const paths={};
  state.players.forEach(p=>{
    if(p.pos===undefined) return;
    const cur=disp[p.id];
    if(cur===undefined||cur===p.pos||p.out){ disp[p.id]=p.pos; return }
    if(p.inJail&&p.pos===10){ paths[p.id]=[10]; return }
    const d=(p.pos-cur+40)%40, path=[];
    if(d>=36){ for(let k=1;k<=40-d;k++) path.push((cur-k+40)%40) } else { for(let k=1;k<=d;k++) path.push((cur+k)%40) }
    paths[p.id]=path;
  });
  const ids=Object.keys(paths);
  if(!ids.length){ walking=false; placeTokens(); flushNotes(); return }
  walking=true;
  const max=Math.max(...ids.map(i=>paths[i].length)), step=Math.max(70,Math.min(190,2600/max));
  let k=0;
  walkTimer=setInterval(()=>{
    hopped=new Set();
    ids.forEach(id=>{ if(k<paths[id].length){ disp[id]=paths[id][k]; hopped.add(id) } });
    placeTokens(); k++;
    if(k>=max){ clearInterval(walkTimer); walking=false; hopped=new Set(); placeTokens(); flushNotes(); followActive() }
  },step);
}
function placeTokens(){
  if(!state) return;
  document.querySelectorAll('.tokens').forEach(t=>t.innerHTML='');
  state.players.forEach(p=>{
    if(p.out||disp[p.id]===undefined) return;
    const el=document.getElementById('tk'+disp[p.id]); if(!el) return;
    el.insertAdjacentHTML('beforeend',pawnSVG(p.color,p.name,hopped.has(p.id)?'data-hop="1"':''));
  });
  document.querySelectorAll('.pawn[data-hop]').forEach(s=>s.classList.add('hop'));
}
function followActive(){
  const wrap=$('#boardwrap'); if(!wrap||wrap.scrollWidth<=wrap.clientWidth+4||!state) return;
  const p=state.players[state.turn]; if(!p) return;
  const cell=document.querySelector(`.cell[data-i="${disp[p.id]??p.pos}"]`); if(!cell) return;
  wrap.scrollTo({left:Math.max(0,cell.offsetLeft-wrap.clientWidth/2+cell.offsetWidth/2),behavior:'smooth'});
}
function flushNotes(){
  if(rolling||walking||!state) return;
  const mi=myIdx(state);
  noteQ.splice(0).forEach(e=>{
    const who=i=>i===null?'banco':(i===mi?'tu':pname(state,i));
    let txt, cls='', col=null;
    if(e.go){ txt= e.b===mi ? 'Recebeste a mesada dos pais!' : `${pname(state,e.b)} recebeu a mesada dos pais`; cls='go'; col=state.players[e.b]?.color }
    else if(e.a===null){ txt=`${who(e.b)==='tu'?'Recebeste':pname(state,e.b)+' recebeu'} do banco · ${e.w}`; col=state.players[e.b]?.color }
    else if(e.b===null){ txt=`${e.a===mi?'Pagaste':pname(state,e.a)+' pagou'} ao banco · ${e.w}`; col=state.players[e.a]?.color }
    else { txt=`${e.a===mi?'Pagaste':pname(state,e.a)+' pagou'} a ${who(e.b)} · ${e.w}`; col=state.players[e.a]?.color }
    if(e.a===mi) cls+=' me loss'; else if(e.b===mi) cls+=' me gain';
    const pl=e.a!==null?state.players[e.a]:state.players[e.b];
    const el=document.createElement('div'); el.className='nt '+cls;
    el.innerHTML=(pl?pawnSVG(pl.color,pl.name):'')+`<span></span><span class="amt">${e.a===mi?'−':e.b===mi?'+':''}${fmt(e.v)}</span>`;
    el.children[1].textContent=txt;
    const box=$('#notes'); box.appendChild(el); while(box.children.length>4) box.firstChild.remove();
    setTimeout(()=>el.remove(),5500);
  });
}

function openRoom(){
  state=null;
  app.innerHTML=`<div class="banner">A abrir a sala ${esc(code)}…</div>`;

  const timer=setTimeout(()=>{ if(!state) app.innerHTML=`<div class="banner warn">Ainda não consegui ligar à sala ${esc(code)}. Verifica a ligação.</div>` },10000);
  unsub=ref.onSnapshot(s=>{
    clearTimeout(timer);

function cellPos(i){
  if(i<=10) return [11,11-i,'b'];
  if(i<=20) return [11-(i-10),1,'l'];
  if(i<=30) return [1,1+(i-20),'t'];
  return [1+(i-30),11,'r'];
}
const CORNER_SUB={0:`mesada ${GO_MONEY} €`,10:'só de visita',20:'descanso',30:'sem passar na Partida'};
function boardHTML(st){
  let h='<div class="board">';
  SQ.forEach((s,i)=>{
    const [r,c,side]=cellPos(i), pr=st.props?.[i], corner=i%10===0, own=pr?st.players[pr.o]:null;
    let inner=`<div class="bgic">${icon(s.ic)}</div>`;
    if(corner){
      inner+=`<div class="nm">${esc(s.s)}</div><div class="sub">${CORNER_SUB[i]}</div>`;
    } else {
      let band='';
      if(s.t==='prop'){ band=`<div class="band" style="background:${G[s.g].c}">${pr&&pr.h?`<span class="bld">${pr.h===5?HOTEL:HOUSE.repeat(pr.h)}</span>`:''}</div>` }
      inner+=band+`<div class="cbody"><div class="nm">${esc(s.s)}</div><div class="pr">${s.p?s.p+' €':''}</div></div>`;
    }
    if(own) inner+=`<span class="ownflag" style="background:${own.color}" title="${esc(own.name)}"></span>`;
    if(pr&&pr.m) inner+=`<div class="mort"></div>`;
    inner+=`<div class="tokens" id="tk${i}"></div>`;
    const ownStyle=own?`box-shadow:inset 0 0 0 3px ${own.color};`:'';
    h+=`<button class="cell ${corner?'corner':side} ${sel===i?'sel':''}" style="grid-row:${r};grid-column:${c};${ownStyle}" data-i="${i}" aria-label="${esc(s.n)}">${inner}</button>`;
  });
  const cur=st.players[st.turn];
  h+=`<div class="center"><div class="logo">DEMopólio<small>edição Coimbra</small></div>
    <div class="dice${rolling?' rolling':''}" id="dice">${dieHTML(dispDice[0])}${dieHTML(dispDice[1])}</div>
    ${st.status==='playing'&&cur?`<div class="now">${pawnSVG(cur.color,cur.name)}Vez de ${esc(cur.name)}</div>`:''}
    ${st.card?`<div class="cardnote"><b>${esc(st.card.deck)}</b>${esc(st.card.x)}</div>`:''}
    ${st.status==='ended'?`<div class="cardnote"><b>Fim de jogo</b>${esc(pname(st,st.winner))} ganhou!</div>`:''}</div>`;
  return h+'</div>';
}
function dieHTML(n){
  const on={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n]||[];
  return `<div class="die" aria-label="${n}">${[...Array(9)].map((_,k)=>`<i class="${on.includes(k)?'on':''}"></i>`).join('')}</div>`;
}
function tradeSummary(st,t){
  const part=(props,money,cards)=>{
    const bits=[...props.map(i=>esc(SQ[i].s))];
    if(money) bits.push(fmt(money));
    SKEYS.forEach(k=>{ if(cards[k]) bits.push(`${cards[k]}× carta ${esc(SPECIAL[k].n)}`) });
    return bits.length?bits.join(', '):'nada';
  };
  return `<b>${esc(pname(st,t.from))}</b> dá: ${part(t.give,t.gm,t.gc)}<br><b>${esc(pname(st,t.to))}</b> dá: ${part(t.get,t.tm,t.tc)}`;

    <div class="chips">${owned.length?owned.map(k=>`<span class="chip ${st.props[k].m?'m':''}"><span class="sw" style="background:${SQ[k].t==='prop'?G[SQ[k].g].c:'var(--muted)'}"></span>${esc(SQ[k].s)}</span>`).join(''):'<span class="note">Nenhuma.</span>'}</div>
    <div class="eyebrow">Cartas especiais</div>
    <div class="note">${SKEYS.filter(k=>inv(p)[k]).map(k=>`${SPECIAL[k].n} ×${inv(p)[k]}`).join(' · ')||'Nenhuma.'}</div>
    ${canDeal?`<div class="row"><button class="btn primary" id="dealbtn">Negociar com ${esc(p.name)}</button></div>
    <div class="eyebrow">Doar dinheiro</div>
    <div class="row"><input id="donamt" type="number" min="1" step="10" placeholder="Valor em €" style="width:140px"><button class="btn" id="donbtn">Doar a ${esc(p.name)}</button></div>`
    : i===meIdx?'<p class="note" style="margin:0">Este és tu. Toca noutro jogador para negociar ou doar.</p>':''}
    <div class="row"><button class="btn" id="closem">Fechar</button></div></div>`;
  m.hidden=false; m.onclick=e=>{ if(e.target===m) closeModal() };
  $('#closem').onclick=closeModal;
  $('#dealbtn')&&($('#dealbtn').onclick=()=>openTrade(meIdx,i,{}));
  $('#donbtn')&&($('#donbtn').onclick=()=>{
    const v=Math.floor(+$('#donamt').value||0); if(v<=0) return toast('Escreve um valor.');
    const b=$('#donbtn'); if(!b.dataset.sure){ b.dataset.sure=1; b.textContent=`Confirmar ${fmt(v)}?`; return }
    closeModal(); act('donate',{to:i,amt:v});
  });
}
function openTrade(meIdx,to,pre){
  const st=state, m=$('#modal');
  if(st.trade&&!pre.counter) return toast('Já há uma proposta em curso. Espera que seja respondida.');
  const propsOf=pi=>Object.keys(st.props).map(Number).filter(i=>st.props[i].o===pi&&tradeable(st,i)).sort((a,b)=>a-b);
  const box=(pi,name,picked)=>propsOf(pi).map(i=>`<label class="pk"><input type="checkbox" name="${name}" value="${i}" ${picked.includes(i)?'checked':''}><span class="sw" style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${SQ[i].t==='prop'?G[SQ[i].g].c:'var(--muted)'}"></span>${esc(SQ[i].s)}${st.props[i].m?' (hipotecada)':''}</label>`).join('')||'<span class="note">Sem propriedades negociáveis.</span>';
  const cards=(pi,name,picked)=>{ const p=st.players[pi]; const ks=SKEYS.filter(k=>inv(p)[k]); return ks.length?ks.map(k=>`<div class="cardin"><label for="${name}-${k}">${SPECIAL[k].n} (tem ${inv(p)[k]})</label><input id="${name}-${k}" type="number" min="0" max="${inv(p)[k]}" value="${(picked||{})[k]||0}"></div>`).join(''):'' };
  const o=st.players[to];
  m.innerHTML=`<div class="modal" role="dialog" aria-label="Negociar"><h2>${pre.counter?'Contraproposta a':'Negociar com'} ${esc(o.name)}</h2>
    <p class="note" style="margin:0">Escolhe o que dás e o que queres receber. ${esc(o.name)} pode aceitar, recusar ou responder com uma contraproposta.</p>
    <div class="tcols">
      <div><div class="eyebrow">Tu dás</div>${box(meIdx,'give',pre.give||[])}${cards(meIdx,'gc',pre.gc)}
        <label for="tgm" class="eyebrow" style="display:block;margin-top:10px">Dinheiro (tens ${fmt(st.players[meIdx].money)})</label><input id="tgm" type="number" min="0" step="10" value="${pre.gm||0}" style="width:100%"></div>
      <div><div class="eyebrow">Recebes de ${esc(o.name)}</div>${box(to,'get',pre.get||[])}${cards(to,'tc',pre.tc)}
        <label for="ttm" class="eyebrow" style="display:block;margin-top:10px">Dinheiro (tem ${fmt(o.money)})</label><input id="ttm" type="number" min="0" step="10" value="${pre.tm||0}" style="width:100%"></div>
    </div>
    <p class="note" style="margin:0">Propriedades com construções no grupo não podem ser negociadas.</p>
    <div class="row"><button class="btn primary" id="tsend">${pre.counter?'Enviar contraproposta':'Enviar proposta'}</button><button class="btn" id="tclose">Cancelar</button></div></div>`;
  m.hidden=false; m.onclick=e=>{ if(e.target===m) closeModal() };
  $('#tclose').onclick=closeModal;
  $('#tsend').onclick=()=>{
    const v=n=>[...m.querySelectorAll(`input[name=${n}]:checked`)].map(x=>+x.value);
    const rc=n=>{ const r={}; SKEYS.forEach(k=>{ const e=$(`#${n}-${k}`); r[k]=e?Math.max(0,Math.floor(+e.value||0)):0 }); return r };
    const t={to,give:v('give'),get:v('get'),gm:Math.max(0,Math.floor(+$('#tgm').value||0)),tm:Math.max(0,Math.floor(+$('#ttm').value||0)),gc:rc('gc'),tc:rc('tc')};
    if(t.gm>st.players[meIdx].money) return toast('Não tens esse dinheiro.');
    if(t.tm>o.money) return toast(`${o.name} não tem esse dinheiro.`);
    closeModal(); act(pre.counter?'counter':'propose',t);
  };
}

boot();
</script>
</body>
</html>
