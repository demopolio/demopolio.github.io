  const el=$('#mycards'); if(!el) return;
  const st=state, p=st.players[meIdx], mine=st.turn===meIdx&&st.status==='playing';
  const can={jail:mine&&p.inJail&&st.phase==='roll', borla:mine&&!p.shield&&st.phase!=='over', extra:mine&&st.phase==='end'&&!p.inJail};
  const have=SKEYS.filter(k=>inv(p)[k]);
  el.innerHTML=have.length?have.map(k=>`<div class="spcard"><div class="ico">${icon(SPECIAL[k].ic)}</div><div><b>${SPECIAL[k].n} ×${inv(p)[k]}</b><span class="note">${SPECIAL[k].d}</span></div><button class="btn small" data-usec="${k}" ${can[k]?'':'disabled'}>Usar</button></div>`).join('')
    :'<span class="note">Ainda não tens cartas especiais. Saem na Sorte e na Caixa Comum, ou podes negociá-las com outros jogadores.</span>';
  el.querySelectorAll('[data-usec]').forEach(b=>b.onclick=()=>act('useCard',{k:b.dataset.usec}));
}
function renderMyProps(meIdx){
  const el=$('#myprops'); if(!el) return;
  const owned=Object.keys(state.props||{}).map(Number).filter(i=>state.props[i].o===meIdx).sort((a,b)=>a-b);
  el.innerHTML=owned.length?owned.map(i=>{const s=SQ[i],pr=state.props[i];return `<button class="chip ${pr.m?'m':''}" data-sel="${i}"><span class="sw" style="background:${s.t==='prop'?G[s.g].c:'var(--muted)'}"></span>${esc(s.s)}${pr.h?` · ${pr.h===5?'hotel':pr.h+(pr.h>1?' casas':' casa')}`:''}</button>`}).join(''):'<span class="note">Ainda não tens propriedades.</span>';
  el.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{ sel=+b.dataset.sel; render(); $('#detail')?.scrollIntoView({behavior:'smooth',block:'nearest'}) });
}
function renderDetail(meIdx){
  const el=$('#detail'); if(!el) return; if(sel===null){ el.hidden=true; return } el.hidden=false;
  const st=state, s=SQ[sel], pr=st.props?.[sel];
  const col=s.t==='prop'?G[s.g].c:'#33427A';
  let h=`<div class="head" style="background:${col}"><span>${esc(s.n)}</span>${icon(s.ic)}</div>`;
  if(s.t==='prop'){
    h+=`<table><tr><td>Renda</td><td>${fmt(s.r[0])}</td></tr><tr><td>Com a cor completa</td><td>${fmt(s.r[0]*2)}</td></tr>
      ${[1,2,3,4].map(k=>`<tr><td>Com ${k} casa${k>1?'s':''}</td><td>${fmt(s.r[k])}</td></tr>`).join('')}<tr><td>Com hotel</td><td>${fmt(s.r[5])}</td></tr>
      <tr><td>Preço · construção</td><td>${fmt(s.p)} · ${fmt(G[s.g].hc)}</td></tr><tr><td>Hipoteca</td><td>${fmt(s.p/2)}</td></tr></table>`;
  } else if(s.t==='rail'){ h+=`<table><tr><td>Com 1 destas ruas</td><td>25 €</td></tr><tr><td>Com 2</td><td>50 €</td></tr><tr><td>Com 3</td><td>100 €</td></tr><tr><td>Com as 4</td><td>200 €</td></tr><tr><td>Preço</td><td>${fmt(s.p)}</td></tr></table>` }
  else if(s.t==='util'){ h+=`<p class="note" style="margin:0">Renda: 4× o valor dos dados com uma companhia, 10× com as duas. Preço ${fmt(s.p)}.</p>` }
  else if(s.t==='tax'){ h+=`<p style="margin:0">Paga ${fmt(s.p)} ao banco.</p>` }
  else { h+=`<p class="note" style="margin:0">${{go:'Recebes 200 € de mesada sempre que passares aqui.',jail:'Se estás só de visita, não acontece nada.',free:'Descansa. Não acontece nada.',gotojail:'Vais direto para a Prisão.',chance:'Tira uma carta de Sorte.',chest:'Tira uma carta da Caixa Comum.'}[s.t]}</p>` }
  if(pr){
    h+=`<p style="margin:0">Dono: <b>${esc(pname(st,pr.o))}</b>${pr.h?` · ${pr.h===5?'hotel':pr.h+' casa(s)'}`:''}${pr.m?' · <span class="neg">hipotecada</span>':''}</p>`;
    if(pr.o===meIdx && st.turn===meIdx && st.status==='playing'){
      h+=`<div class="row">${s.t==='prop'?`<button class="btn small" data-p="build">${pr.h===4?'Construir hotel':'Construir casa'} (${fmt(G[s.g].hc)})</button>${pr.h?`<button class="btn small" data-p="sell">Vender construção</button>`:''}`:''}
        ${pr.m?`<button class="btn small" data-p="unmortgage">Pagar hipoteca (${fmt(Math.ceil(s.p*.55))})</button>`:`<button class="btn small" data-p="mortgage">Hipotecar (+${fmt(s.p/2)})</button>`}</div>`;
    }
  } else if(BUYABLE(s.t)) h+=`<p class="note" style="margin:0">À venda.</p>`;
  h+=`<button class="btn small" id="closedet">Fechar</button>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>act(b.dataset.p,{i:sel}));
  $('#closedet').onclick=()=>{ sel=null; render() };
}

/* ---------- JOGADOR: NEGOCIAR / DOAR ---------- */
function closeModal(){ $('#modal').hidden=true }
function openPlayer(meIdx,i){
  const st=state, p=st.players[i], m=$('#modal');
  const owned=Object.keys(st.props||{}).map(Number).filter(k=>st.props[k].o===i).sort((a,b)=>a-b);
  const canDeal=meIdx>=0&&i!==meIdx&&st.status==='playing'&&!p.out&&!st.players[meIdx].out;
  m.innerHTML=`<div class="modal" role="dialog" aria-label="${esc(p.name)}">
    <div class="row">${pawnP(p,'style="width:40px"')}<div><h2>${esc(p.name)}</h2><span class="money">${fmt(p.money)}</span> <span class="note">· património ${fmt(worth(st,i))}</span></div></div>
    <div class="eyebrow">Propriedades</div>
    <div class="chips">${owned.length?owned.map(k=>`<span class="chip ${st.props[k].m?'m':''}"><span class="sw" style="background:${SQ[k].t==='prop'?G[SQ[k].g].c:'var(--muted)'}"></span>${esc(SQ[k].s)}</span>`).join(''):'<span class="note">Nenhuma.</span>'}</div>
    <div class="eyebrow">Cartas especiais</div>
    <div class="note">${SKEYS.filter(k=>inv(p)[k]).map(k=>`${SPECIAL[k].n} ×${inv(p)[k]}`).join(' · ')||'Nenhuma.'}</div>
    ${canDeal?`<div class="row"><button class="btn primary" id="dealbtn">Negociar com ${esc(p.name)}</button></div>
    <div class="eyebrow">Doar dinheiro</div>
    <div class="row"><input id="donamt" type="number" min="1" step="10" placeholder="Valor em €" style="width:140px"><button class="btn" id="donbtn">Doar a ${esc(p.name)}</button></div>`
    : i===meIdx?`<p class="note" style="margin:0">Este és tu. Toca noutro jogador para negociar ou doar.</p><div class="eyebrow">A tua foto no peão</div>${photoCtl(p)}`:''}
    <div class="row"><button class="btn" id="closem">Fechar</button></div></div>`;
  m.hidden=false; m.onclick=e=>{ if(e.target===m) closeModal() };
  $('#closem').onclick=closeModal; m.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{ closeModal(); b.dataset.photo==='pick'?pickPhoto():removePhoto() });
  $('#dealbtn')&&($('#dealbtn').onclick=()=>openTrade(meIdx,i,{}));
  $('#donbtn')&&($('#donbtn').onclick=()=>{
    const v=Math.floor(+$('#donamt').value||0); if(v<=0) return toast('Escreve um valor.');
    const b=$('#donbtn'); if(!b.dataset.sure){ b.dataset.sure=1; b.textContent=`Confirmar ${fmt(v)}?`; return }
    closeModal(); act('donate',{to:i,amt:v});
  });
}
function openTrade(meIdx,to,pre){
  const st=state, m=$('#modal');
  const propsOf=pi=>Object.keys(st.props).map(Number).filter(i=>st.props[i].o===pi&&tradeable(st,i)).sort((a,b)=>a-b);
  const box=(pi,name,picked)=>propsOf(pi).map(i=>`<label class="pk"><input type="checkbox" name="${name}" value="${i}" ${picked.includes(i)?'checked':''}><span class="sw" style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${SQ[i].t==='prop'?G[SQ[i].g].c:'var(--muted)'}"></span>${esc(SQ[i].s)}${st.props[i].m?' (hipotecada)':''}</label>`).join('')||'<span class="note">Sem propriedades negociáveis.</span>';
  const cards=(pi,name,picked)=>{ const p=st.players[pi]; const ks=SKEYS.filter(k=>inv(p)[k]); return ks.length?ks.map(k=>`<div class="cardin"><label for="${name}-${k}">${SPECIAL[k].n} (tem ${inv(p)[k]})</label><input id="${name}-${k}" type="number" min="0" max="${inv(p)[k]}" value="${(picked||{})[k]||0}"></div>`).join(''):'' };
  const o=st.players[to];
  m.innerHTML=`<div class="modal" role="dialog" aria-label="Negociar"><h2>${pre.counter?'Contraproposta a':'Negociar com'} ${esc(o.name)}</h2>
    <p class="note" style="margin:0">Escolhe o que dás e o que queres receber. ${esc(o.name)} pode aceitar, recusar ou responder com uma contraproposta.</p>
    <div class="tcols">
      <div><div class="eyebrow">Tu dás</div>${box(meIdx,'give',pre.give||[])}${cards(meIdx,'gc',pre.gc)}
        <label for="tgm" class="eyebrow" style="display:block;margin-top:10px">Dinheiro (tens ${fmt(st.players[meIdx].money)})</label>${st.players[meIdx].money<0?'<p class="note" style="margin:4px 0 0">Estás a dever: pede dinheiro do outro lado em troca de propriedades ou cartas.</p>':''}<input id="tgm" type="number" min="0" step="10" value="${pre.gm||0}" style="width:100%"></div>
      <div><div class="eyebrow">Recebes de ${esc(o.name)}</div>${box(to,'get',pre.get||[])}${cards(to,'tc',pre.tc)}
        <label for="ttm" class="eyebrow" style="display:block;margin-top:10px">Dinheiro (tem ${fmt(o.money)})</label><input id="ttm" type="number" min="0" step="10" value="${pre.tm||0}" style="width:100%"></div>
    </div>
    <p class="note" style="margin:0">Propriedades com construções no grupo não podem ser negociadas.</p>
    <div class="row"><button class="btn primary" id="tsend">${pre.counter?'Enviar contraproposta':'Enviar proposta'}</button><button class="btn" id="tclose">Cancelar</button></div></div>`;
  m.hidden=false; m.onclick=e=>{ if(e.target===m) closeModal() };
  $('#tclose').onclick=closeModal;
  $('#tsend').onclick=()=>{
    const v=n=>[...m.querySelectorAll(`input[name=${n}]:checked`)].map(x=>+x.value);
    const rc=n=>{ const r={}; SKEYS.forEach(k=>{ const e=$(`#${n}-${k}`); r[k]=e?Math.max(0,Math.floor(+e.value||0)):0 }); return r };
    const t={to,give:v('give'),get:v('get'),gm:Math.max(0,Math.floor(+$('#tgm').value||0)),tm:Math.max(0,Math.floor(+$('#ttm').value||0)),gc:rc('gc'),tc:rc('tc')};
    if(t.gm>st.players[meIdx].money) return toast('Não tens esse dinheiro.');
    if(t.tm>o.money) return toast(`${o.name} não tem esse dinheiro.`);
    closeModal(); if(pre.counter) t.id=pre.counter; act(pre.counter?'counter':'propose',t);
  };
}

let trig={}, botBusy=false, botNext=0;
function fire(name){ const now=Date.now(); if(trig[name]&&now-trig[name]<2500) return; trig[name]=now; act(name) }
function clock(ms){ ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor(ms/1000)%60; return `⏱ ${m}:${String(s).padStart(2,'0')}` }
setInterval(()=>{
  const st=state; if(!st||!code||st.status!=='playing') return;
  const now=Date.now(), c=cfg(st);
  const gt=$('#gametimer'); if(gt&&st.endsAt){ gt.textContent=clock(st.endsAt-now); gt.classList.toggle('low',st.endsAt-now<5*60000) }
  const tt=$('#turntimer'); if(tt&&c.turnTime){ const left=Math.max(0,Math.ceil(((st.turnAt||0)+turnLimit(st,st.players[st.turn])-now)/1000)); tt.textContent=left+' s'; tt.classList.toggle('low',left<=10) }
  const at=$('#auctimer'); if(at&&st.auction) at.textContent=Math.max(0,Math.ceil((st.auction.endsAt-now)/1000));
  if(st.endsAt&&now>=st.endsAt) fire('timeUp');
  if(st.phase==='auction'&&st.auction&&now>=st.auction.endsAt+300) fire('auctionEnd');
  const cur=st.players[st.turn];
  if(c.turnTime&&cur&&!cur.bot&&['roll','buy','end'].includes(st.phase)&&now>=(st.turnAt||0)+turnLimit(st,cur)+(cur.id===me.id?0:1500)) fire('timeout');
  // bots: o anfitrião controla-os; se o anfitrião sair, qualquer jogador assume ao fim de 12 s
  const hasBots=st.players.some(p=>p.bot&&!p.out); if(!hasBots||botBusy||now<botNext) return;
  if(st.host!==me.id&&now-(st.updatedAt||0)<12000) return;
  if(rolling||walking||(inHold()&&st.phase!=='auction')) return;
  const needs=(st.phase==='auction')||(st.trades||[]).some(t=>st.players[t.to]?.bot)||(cur&&cur.bot);
  if(!needs) return;
  botBusy=true;
  mutate(A.botStep).finally(()=>{ botBusy=false; botNext=Date.now()+(st.phase==='auction'?700+Math.random()*1300:900) });
},500);

boot();
</script>
</body>
