<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DEMopólio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: tabuleiro de azulejo à esquerda, painel de jogo à direita; no telemóvel o tabuleiro desliza na horizontal */
:root{
  --bg:#EEF2FA; --surface:#FFFFFF; --tile:#F8FAFE; --ink:#0F1C44; --muted:#5A6688;
  --line:#C3CDE6; --cobalt:#1F47C2; --cobalt-soft:#DCE4FA; --gold:#B57A0E; --danger:#C2362B; --ok:#167A4A;
  --pattern:rgba(31,71,194,.09); --pawn-edge:#FFFFFF;
  --sky1:#CFE0FA; --sky2:#F4F7FD; --sun:#FCE7B0; --star:transparent; --hill2:#DCE4F4; --hill:#E7ECF7; --bld:#C2CDE8; --win:#E9EEF9; --river1:#B9D0F3; --river2:#D6E4F8; --wave:#FFFFFF; --bridge:#AFBEDF; --tile1:#F3F6FD; --tile2:#9DB2E6; --shadow:0 6px 24px rgba(15,28,68,.14);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0A1022; --surface:#121A33; --tile:#17213D; --ink:#E7ECFA; --muted:#9AA6C8;
  --line:#2C3963; --cobalt:#7C9BFF; --cobalt-soft:#1E2A55; --gold:#E7B44A; --danger:#FF7B6E; --ok:#4FD08F;
  --pattern:rgba(124,155,255,.09); --pawn-edge:#C9D3F0;
  --sky1:#070C1C; --sky2:#141F40; --sun:#E9E3C6; --star:#C9D3F0; --hill2:#18234A; --hill:#1C2852; --bld:#26335F; --win:#E7B44A; --river1:#1A2B58; --river2:#122045; --wave:#3E5598; --bridge:#2E3D70; --tile1:#141E3D; --tile2:#34488A; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark }}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto}
.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:var(--bg)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;color:var(--ink);background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{color:var(--muted);font-size:13px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:14px}
.banner.warn{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}

/* HOME */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:28px}
.hero h1{font-size:clamp(40px,7vw,76px);font-weight:800;line-height:.95}
.hero h1 span{color:var(--cobalt)}
.hero p{max-width:52ch;color:var(--muted);margin:12px 0 0}
.azulejo{aspect-ratio:1;max-width:100%;border-radius:18px;border:1px solid var(--line);
  background:radial-gradient(circle at 50% 50%,transparent 18%,var(--pattern) 19% 22%,transparent 23%) 0 0/50% 50%,
   conic-gradient(from 45deg at 50% 50%,var(--pattern) 0 25%,transparent 0 50%,var(--pattern) 0 75%,transparent 0) 0 0/25% 25%,var(--surface);
  display:grid;place-items:center}
.azulejo .seal{display:flex;gap:6px;align-items:flex-end;background:var(--surface);padding:14px 22px;border-radius:999px;border:2px solid var(--cobalt)}
.azulejo .seal svg{width:44px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:20px}
.roomlist{display:flex;flex-direction:column;gap:8px}
.roomitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--tile)}
.code{font-family:var(--f-mono);font-weight:700;letter-spacing:.08em}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--cobalt-soft);color:var(--cobalt);text-transform:uppercase;letter-spacing:.06em}
.pill.end{background:var(--tile);color:var(--muted)}
.pill.live{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}

/* JOGO */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.topbar h1{font-size:26px;font-weight:800}
.game{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.boardwrap{overflow-x:auto;overflow-y:hidden;border-radius:18px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.board{container-type:inline-size;position:relative;aspect-ratio:1;width:100%;display:grid;grid-template-columns:1.6fr repeat(9,1fr) 1.6fr;grid-template-rows:1.6fr repeat(9,1fr) 1.6fr;gap:2px;background:var(--line);border:3px solid var(--line);border-radius:18px;overflow:hidden}
.swipe{display:none}
.cell{position:relative;display:flex;background:var(--tile);overflow:hidden;border:0;padding:0;color:var(--ink);min-width:0;min-height:0;text-align:center}
.cell:hover{background:color-mix(in srgb,var(--cobalt-soft) 70%,var(--tile))}
.cell.sel{outline:3px solid var(--cobalt);outline-offset:-3px;z-index:3}
.cell.b{flex-direction:column}.cell.t{flex-direction:column-reverse}.cell.l{flex-direction:row-reverse}.cell.r{flex-direction:row}
.band{flex:none;display:flex;align-items:center;justify-content:center;gap:1px;position:relative;z-index:1}
.cell.b .band,.cell.t .band{height:21%}
.cell.l .band,.cell.r .band{width:21%;flex-direction:column}
.band .bld{display:flex;align-items:flex-end;gap:1px;background:var(--surface);border-radius:4px;padding:1px 2px}
.cell.l .band .bld,.cell.r .band .bld{flex-direction:column;align-items:center}
.band svg.h{width:clamp(7px,1.25cqw,13px);height:auto}
.band svg.hotel{width:clamp(13px,2.4cqw,24px);height:auto}
.cell.l .band svg.hotel,.cell.r .band svg.hotel{width:clamp(11px,1.9cqw,20px)}
.cbody{flex:1;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:4px 3px 3px;min-width:0;min-height:0;position:relative;z-index:1;gap:2px}
.nm{font-size:clamp(7px,1.3cqw,12.5px);font-weight:700;line-height:1.1;text-wrap:balance;overflow-wrap:anywhere;hyphens:auto}
.pr{font-family:var(--f-mono);font-size:clamp(6.5px,1.1cqw,11px);color:var(--muted);font-weight:500}
.bgic{position:absolute;left:50%;top:50%;width:62%;max-width:58px;transform:translate(-50%,-46%);opacity:.16;color:var(--ink);pointer-events:none;z-index:0}
.cell.corner .bgic{opacity:.2;width:52%;max-width:70px}
.cell.corner{flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:6px}
.cell.corner .nm{font-family:var(--f-display);font-weight:800;font-size:clamp(9px,1.7cqw,16px)}
.cell.corner .sub{font-size:clamp(6.5px,1.05cqw,10.5px);color:var(--muted);font-weight:600}
.cell .mort{position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--danger) 20%,transparent) 6px 8px);pointer-events:none;z-index:2}
.cell .ownflag{position:absolute;z-index:2;width:clamp(8px,1.4cqw,14px);height:clamp(8px,1.4cqw,14px);border-radius:50%;border:2px solid var(--surface);right:3px;bottom:3px}
.chatlist{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto;min-height:60px}
.msg{display:grid;grid-template-columns:10px minmax(0,1fr);gap:8px;align-items:start;font-size:13.5px}
.msg .mdot,.chatnt .mdot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.msg .mh{display:flex;gap:8px;align-items:baseline}
.msg .mh span{color:var(--muted);font-size:11px}
.msg .mt{overflow-wrap:anywhere}
.msg.mine .mh b{color:var(--cobalt)}
.chatform{display:flex;gap:8px}
.chatform input{flex:1;min-width:0;padding:8px 10px}
.chatnt{cursor:pointer}
.ticker{position:absolute;top:10%;left:50%;transform:translateX(-50%);width:84%;display:flex;flex-direction:column;align-items:center;gap:.5cqw;z-index:4;pointer-events:none}
.tk{display:flex;align-items:center;gap:.7cqw;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.35cqw 1.2cqw .35cqw .5cqw;font-size:max(11px,1.3cqw);box-shadow:0 2px 8px rgba(15,28,68,.12);animation:slidein .25s ease-out}
.tk span:not(.amt){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tk svg{width:max(13px,1.7cqw);flex:none}
.tk .amt{font-family:var(--f-mono);font-weight:700;white-space:nowrap;margin-left:.4cqw}
.tk.gain .amt{color:var(--ok)}.tk.loss .amt{color:var(--danger)}
.tk.land{border-color:var(--cobalt)}
.cfg{display:flex;flex-direction:column;gap:8px}
.cfgrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.cfgrow select{padding:6px 8px;max-width:58%}
.emos{display:flex;gap:4px;flex-wrap:wrap}
.emo{border:1px solid var(--line);background:var(--tile);border-radius:8px;padding:2px 7px;font-size:16px;line-height:1.3}
.emo:hover{border-color:var(--cobalt)}
.msg .mt.big{font-size:26px;line-height:1.2}
.gtimer,.ttimer{font-family:var(--f-mono);font-weight:700;font-size:13px;background:var(--tile);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.ttimer{margin-left:auto;font-size:14px}
.gtimer.low,.ttimer.low{color:var(--danger);border-color:var(--danger)}
.potnote{background:var(--surface);border:1px solid var(--gold);border-radius:999px;padding:.3cqw 1.2cqw;font-size:max(11px,1.35cqw)}
.landing.auction .abid{font-size:max(14px,1.9cqw)}
.landing.auction .atime{font-size:max(13px,1.6cqw);color:var(--muted)}
.landing.auction .atime b{font-family:var(--f-mono);color:var(--danger);font-size:1.2em}
.landing.auction small{opacity:.75;font-weight:500}
.landing.endscreen{inset:6%;gap:1cqw}
.endscreen .winner{display:flex;align-items:center;gap:1cqw;font-family:var(--f-display);font-size:max(20px,3.6cqw);color:var(--cobalt)}
.endscreen .winner svg{width:max(28px,4.5cqw)}
.endscreen .rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4cqw;width:min(100%,46cqw);font-size:max(12px,1.6cqw)}
.endscreen .rank li{display:grid;grid-template-columns:2.2em max(16px,2.2cqw) minmax(0,1fr) auto;align-items:center;gap:.8cqw;background:var(--tile);border-radius:1cqw;padding:.3cqw 1cqw;text-align:left}
.endscreen .rank li:first-child{border:2px solid var(--gold)}
.endscreen .rank svg{width:100%}
.endscreen .hls{display:grid;grid-template-columns:1fr 1fr;gap:.8cqw;width:min(100%,52cqw);text-align:left;font-size:max(11px,1.4cqw)}
.endscreen .hls>div{background:var(--tile);border-radius:1cqw;padding:.6cqw 1cqw}
.skyline{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.center .now,.center .dice,.center .logo{position:relative}
.photoctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.banner.debt{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 7%,var(--surface))}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ctog{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink);padding:0}
.ctog .chev{width:16px;color:var(--muted);font-size:13px}
.panel.collapsed .pbody,.panel.collapsed .pextra{display:none}
.pbody{display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
.players.compact .pl{grid-template-columns:22px minmax(0,1fr) auto;gap:8px;padding:5px 8px}
.players.compact .pl svg{width:22px}
.players.compact .who{font-size:14px;line-height:1.2}
.players.compact .who .sub{display:block;font-size:11.5px;color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.players.compact .pm{text-align:right;line-height:1.15}
.players.compact .money{font-size:13.5px}
.players.compact .pm .note{font-size:11px}
.btn.arming{background:var(--danger);border-color:var(--danger);color:#fff}
.pawnlayer{position:absolute;inset:0;pointer-events:none;z-index:5}
.pwn{position:absolute;width:3.1cqw;min-width:15px;transform:translate(-50%,-100%);transition:left .3s ease-in-out,top .3s ease-in-out}
.pwn .pawn{width:100%;margin:0}
.pwn.active .pawn{filter:drop-shadow(0 0 .5cqw var(--pc)) drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.pwarrow{position:absolute;transform:translate(-50%,-100%);transition:left .3s ease-in-out,top .3s ease-in-out;display:flex;flex-direction:column;align-items:center;animation:bob 1s ease-in-out infinite}
.pwarrow span{background:var(--pc);color:#fff;font-family:var(--f-body);font-weight:800;font-size:max(9px,1.25cqw);letter-spacing:.06em;padding:.2em .55em;border-radius:6px;border:1.5px solid var(--pawn-edge);white-space:nowrap}
.pwarrow i{width:0;height:0;border-left:max(5px,.7cqw) solid transparent;border-right:max(5px,.7cqw) solid transparent;border-top:max(7px,1cqw) solid var(--pc);margin-top:-1px}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-.8cqw}}
.landing{position:absolute;inset:9%;z-index:6;background:color-mix(in srgb,var(--surface) 97%,transparent);border:2px solid var(--line);border-radius:2.4cqw;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.3cqw;padding:3cqw 3.4cqw;text-align:center;animation:pop .25s ease-out;overflow:auto}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.landing .lx{position:absolute;top:1.2cqw;right:1.2cqw;border:0;background:var(--tile);color:var(--ink);width:max(28px,3.4cqw);height:max(28px,3.4cqw);border-radius:50%;font-size:max(16px,2cqw);line-height:1}
.landing .lwho{font-size:max(11px,1.6cqw);font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.landing .lsq{display:flex;flex-direction:column;align-items:center;gap:.8cqw;min-width:min(60%,32cqw);border:2px solid var(--line);border-radius:1.6cqw;overflow:hidden;background:var(--tile)}
.landing .lsq .lband{align-self:stretch;height:2.2cqw}
.landing .lsq svg{width:6cqw;max-width:56px;color:var(--ink);opacity:.8}
.landing .lsq b{font-family:var(--f-display);font-size:max(20px,4cqw);line-height:1.05;padding:0 1.6cqw 1.4cqw;text-wrap:balance}
.landing ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6cqw;font-size:max(13px,1.75cqw);max-width:44cqw}
.landing ul li{background:var(--tile);border-radius:1cqw;padding:.5cqw 1.2cqw}
.landing .lact{display:flex;gap:1cqw;flex-wrap:wrap;justify-content:center}
.landing .lact .btn{font-size:max(13px,1.7cqw)}
.landing .lhint{font-size:max(12px,1.5cqw);color:var(--muted)}
.pawn{width:clamp(15px,2.9cqw,30px);height:auto;margin:0 -2px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.pawn.hop{animation:hop .17s ease-out}
@keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-35%)}100%{transform:translateY(0)}}
.center{grid-column:2 / span 9;grid-row:2 / span 9;position:relative;isolation:isolate;overflow:hidden;background:var(--surface);
   display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.6cqw,16px);padding:6%;min-width:0;min-height:0}
.center .logo{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,6cqw,62px);color:var(--cobalt);line-height:1;background:var(--surface);padding:.08em .35em;border-radius:14px;text-align:center}
.center .logo small{display:block;font-family:var(--f-body);font-size:.24em;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:.3em}
.center .now{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-weight:700;font-size:clamp(11px,1.6cqw,15px)}
.center .now svg{width:clamp(16px,2.6cqw,26px)}
.dice{display:flex;gap:clamp(8px,1.6cqw,16px)}
.die{width:clamp(36px,7cqw,66px);aspect-ratio:1;background:var(--surface);border:2px solid var(--ink);border-radius:22%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14%;box-shadow:0 3px 0 var(--ink)}
.die i{width:70%;aspect-ratio:1;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.dice.rolling .die{animation:tumble .32s linear infinite}
.dice.rolling .die:nth-child(2){animation-direction:reverse}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(-18deg) translateY(-12%)}50%{transform:rotate(12deg) translateY(4%)}75%{transform:rotate(-8deg) translateY(-6%)}100%{transform:rotate(0) translateY(0)}}
.rollbtn{font-size:clamp(14px,2.2cqw,20px);padding:.6em 1.4em;border-radius:12px;box-shadow:0 4px 0 color-mix(in srgb,var(--cobalt) 55%,#000)}
.rollbtn:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--cobalt) 55%,#000)}
.cardnote{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;max-width:min(92%,380px);text-align:center;font-size:clamp(11px,1.5cqw,14.5px)}
.cardnote b{display:block;font-family:var(--f-display);color:var(--gold);font-size:.85em;letter-spacing:.08em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.dice.rolling .die,.pawn.hop{animation:none}}

.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.actions .turn{font-family:var(--f-display);font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.actions .turn svg{width:26px}
.players{display:flex;flex-direction:column;gap:6px}
.pl{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid transparent;background:none;color:var(--ink);text-align:left;width:100%}
.pl:hover{border-color:var(--line)}
.pl.cur{border-color:var(--cobalt);background:var(--cobalt-soft)}
.pl.out{opacity:.45}
.pl svg{width:28px}
.pl .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pl .who small{font-weight:500;color:var(--muted)}
.neg{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--tile);font-size:12.5px;color:var(--ink)}
.chip .sw{width:10px;height:10px;border-radius:2px;flex:none}
.chip.m{opacity:.55;text-decoration:line-through}
.spcard{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--tile)}
.spcard .ico{width:40px;height:52px;border-radius:7px;display:grid;place-items:center;background:var(--cobalt);color:var(--bg);font-family:var(--f-display);font-weight:800;font-size:18px}
.spcard .ico svg{width:24px;stroke:var(--bg)}
.spcard b{display:block}
.detail table{width:100%;border-collapse:collapse;font-size:13px}
.detail td{padding:4px 0;border-bottom:1px solid var(--line)}
.detail td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.detail .head{border-radius:10px;padding:12px;color:#fff;font-family:var(--f-display);font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.detail .head svg{width:34px;flex:none;opacity:.9}
.log{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:13px}
.log .pe{display:flex;gap:10px;justify-content:space-between;align-items:baseline}
.log .pe .amt{font-family:var(--f-mono);font-weight:700;white-space:nowrap}
.log .gain{color:var(--ok)}.log .loss{color:var(--danger)}
.log .cd b{color:var(--gold);font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.tabs{display:flex;gap:4px;background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;padding:5px 10px;border-radius:7px}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:70;max-width:90vw}
.notes{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;z-index:60;width:min(360px,calc(100vw - 24px));pointer-events:none}
.nt{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);font-size:14px;animation:slidein .25s ease-out;pointer-events:auto}
.nt svg{width:26px;flex:none}
.nt .amt{margin-left:auto;font-family:var(--f-mono);font-weight:700;white-space:nowrap}
.nt.me{border-color:var(--cobalt)}
.nt.gain .amt{color:var(--ok)}.nt.loss .amt{color:var(--danger)}
.nt.go{border-color:var(--gold)}
@keyframes slidein{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.modalbg{position:fixed;inset:0;background:rgba(5,10,25,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(600px,100%);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.tcols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tcols label.pk{display:flex;gap:6px;align-items:center;font-size:13px;padding:3px 0}
.tcols .cardin{display:grid;grid-template-columns:1fr 64px;gap:6px;align-items:center;font-size:13px}
.lobbylist{display:flex;flex-direction:column;gap:8px}
.tok{display:inline-block}
@media (max-width:1099px){
  .game{display:flex;flex-direction:column;align-items:stretch;gap:14px}
  .game>*,.side>*,.col>*{width:100%;min-width:0}
  .side,.col{display:contents}
  #actions{order:-2}
  .boardcol{order:-1}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero .azulejo{display:none}
}
/* Computador: tudo cabe no ecrã, sem deslizar a página */
@media (min-width:1100px){
  body{padding-block:12px}
  .wrap.gv{max-width:none;height:calc(100dvh - 24px);display:flex;flex-direction:column}
  .gv .topbar{margin-bottom:10px;flex:none}
  .gv .topbar h1{font-size:22px}
  .gv .game{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:14px;align-items:stretch}
  .gv .boardcol{height:100%;aspect-ratio:1;max-width:calc(100vw - 32px - 620px);min-width:0;align-self:start}
  .gv .boardwrap{overflow:hidden}
  .gv .side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;min-height:0;height:100%}
  .gv .col{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
  .gv .col>.panel{flex:0 1 auto;min-height:0;padding:14px;gap:10px;overflow:auto}
  .gv .panel h2{font-size:17px}
  .gv #actions{flex:0 1 auto;max-height:52%;min-height:120px;overflow:auto}
  .gv .col>.grow{flex:1 1 0;min-height:130px;overflow:hidden}
  .gv .col>.panel.collapsed{flex:none;min-height:0}
  .gv .pplayers{flex:0 1 auto;max-height:34%;min-height:150px;display:flex;flex-direction:column}
  .gv .pchat{min-height:210px}
  .gv .plog{min-height:140px}
  .gv .pcards{flex:0 1 auto;max-height:34%}
  .gv .chatlist{max-height:none}
  .gv .scroll{flex:1;min-height:0;overflow:auto}
  .gv .log{max-height:none}
  .gv .pl{padding:6px 8px}
  .gv .spcard{padding:8px}
}
@media (max-width:780px){
  .board{width:780px}
  .swipe{display:block;margin-top:6px}
}
@media (max-width:640px){
  .cards{grid-template-columns:minmax(0,1fr)}
  .tcols{grid-template-columns:1fr}
}

const groupOf = g => SQ.map((s,i)=>s.g===g?i:-1).filter(i=>i>=0);
const fmt = n => (n<0?'−':'')+Math.abs(n).toLocaleString('pt-PT')+' €';
const roll6 = () => 1+Math.floor(Math.random()*6);
function log(st,msg){ st.log=[msg,...(st.log||[])].slice(0,60) }
function pname(st,i){ return st.players[i]?.name||'?' }
function inv(p){ if(!p.inv) p.inv={jail:0,borla:0,extra:0}; return p.inv }
function ownsGroup(st,pi,g){ return groupOf(g).every(i=>st.props[i]&&st.props[i].o===pi) }
function countType(st,pi,t){ return SQ.reduce((n,s,i)=>n+(s.t===t&&st.props[i]&&st.props[i].o===pi?1:0),0) }
function rentFor(st,i,dice){
  const s=SQ[i], pr=st.props[i]; if(!pr||pr.m) return 0;
  if(s.t==='prop'){ return pr.h>0 ? s.r[pr.h] : s.r[0]*(ownsGroup(st,pr.o,s.g)?2:1) }
  if(s.t==='rail'){ return 25*Math.pow(2,countType(st,pr.o,'rail')-1) }
  if(s.t==='util'){ return dice*(countType(st,pr.o,'util')===2?10:4) }
  return 0;
}
function event(st,e){ st.evN=(st.evN||0)+1; e.n=st.evN; st.ev=[...(st.ev||[]),e].slice(-20) }
const DEFCFG={start:1000,firstLap:true,pot:false,timeLimit:0,turnTime:0,fillTo:0,botDiff:'medio',botTrade:'normal',solo:false};
function turnLimit(st,p){ const c=cfg(st); return (p&&p.money<0?Math.max(c.turnTime*3,180):c.turnTime)*1000 }
function cfg(st){ return Object.assign({},DEFCFG,st.cfg||{}) }
function stat(st,k,key,v){ st.stats=st.stats||{}; const m=st.stats[k]=st.stats[k]||{}; m[String(key)]=(m[String(key)]||0)+v }
function toBank(st,pi,amt,why){

}
function withActor(st,pi,fn){ const save=me.id; me.id=st.players[pi].id; try{ return fn() } finally{ me.id=save } }
const BOTNAMES=['Bot Caloiro','Bot Doutora','Bot Veterano','Bot Tuno','Bot Repúblico','Bot Finalista','Bot Erasmus','Bot Bolseira'];
function rcode(){ const L='ABCDEFGHJKLMNPQRSTUVWXYZ'; let c=''; for(let i=0;i<4;i++) c+=L[Math.floor(Math.random()*L.length)]; return c }
function addBot(st){
  if(st.players.length>=MAXP) return false;
  const used=st.players.map(p=>p.color), names=st.players.map(p=>p.name);
  const name=BOTNAMES.find(n=>!names.includes(n))||('Bot '+(st.players.length+1));
  st.players.push({id:'bot-'+Math.random().toString(36).slice(2,9),name,color:COLORS.find(c=>!used.includes(c)),bot:true});

}
function rankPlayers(st){

    if(!!pa.out!==!!pb.out) return pa.out?1:-1; return worth(st,b)-worth(st,a) });
}
function endGame(st,why){
  st.ranking=rankPlayers(st); st.status='ended'; st.phase='over'; st.winner=st.ranking[0]; st.auction=null;
  st.finalWorth=st.players.map((p,i)=>p.out?0:worth(st,i));
  log(st,why); log(st,`${pname(st,st.winner)} ganhou o jogo com ${fmt(st.finalWorth[st.winner])} de património!`);
}
function liquidate(st,pi){
  const p=st.players[pi]; let guard=0;
  while(p.money<0&&guard++<80){
    const built=Object.keys(st.props).map(Number).filter(i=>st.props[i].o===pi&&st.props[i].h>0);
    if(built.length){ built.sort((a,b)=>st.props[b].h-st.props[a].h||SQ[b].p-SQ[a].p); const i=built[0]; st.props[i].h--; pay(st,null,pi,G[SQ[i].g].hc/2,`venda de construção em ${SQ[i].s}`,true); continue }
    const mort=Object.keys(st.props).map(Number).filter(i=>st.props[i].o===pi&&!st.props[i].m).sort((a,b)=>SQ[a].p-SQ[b].p);
    if(mort.length){ const i=mort[0]; st.props[i].m=true; pay(st,null,pi,SQ[i].p/2,`hipoteca de ${SQ[i].s}`,true); continue }
    break;
  }
  return p.money>=0;
}
function note(st,t){ if(st.landing&&st.landing.notes) st.landing.notes.push(t) }
function plog(st,pi,t,v=null){

  st.plog[k]=[{t,v},...(st.plog[k]||[])].slice(0,60);
}
function pay(st,from,to,amt,why,quiet){
  if(!amt) return;
  if(from!==null) st.players[from].money-=amt;
  if(to!==null) st.players[to].money+=amt;
  if(why!==null&&why!==undefined&&!quiet) event(st,{a:from,b:to,v:amt,w:why});
  const lbl=why?` · ${why}`:'';
  if(from!==null) plog(st,from,`Pagaste ${to===null?'ao banco':'a '+pname(st,to)}${lbl}`,-amt);
  if(to!==null) plog(st,to,`Recebeste ${from===null?'do banco':'de '+pname(st,from)}${lbl}`,amt);
}
function passGo(st,pi){
  const p=st.players[pi]; p.money+=GO_MONEY; p.laps=(p.laps||0)+1;
  log(st,`${p.name} passou pela Partida e recebeu a mesada dos pais (${fmt(GO_MONEY)}).`);
  event(st,{a:null,b:pi,v:GO_MONEY,w:'mesada dos pais',go:true});
  plog(st,pi,'Passaste pela Partida · mesada dos pais',GO_MONEY); note(st,`Passagem pela Partida: +${fmt(GO_MONEY)} de mesada dos pais`);
}
function moveBy(st,pi,steps){
  const p=st.players[pi], np=((p.pos+steps)%40+40)%40;
  if(steps>0 && np<p.pos) passGo(st,pi);
  p.pos=np;
}
function moveTo(st,pi,target){
  const p=st.players[pi];
  if(target<p.pos || target===0) passGo(st,pi);
  p.pos=target;
}
function sendJail(st,pi){

  log(st,`${p.name} foi para a Prisão.`); plog(st,pi,'Foste para a Prisão'); note(st,'Vai direto para a Prisão');
}
function land(st,pi,dice,depth=0){
  const p=st.players[pi], i=p.pos, s=SQ[i];
  if(BUYABLE(s.t)){
    const pr=st.props[i];
    if(!pr){
      if(cfg(st).firstLap&&(p.laps||0)<1){ log(st,`${p.name} ainda está na primeira volta e não pode comprar ${s.n}.`); note(st,`À venda por ${fmt(s.p)}, mas na primeira volta ainda não dá para comprar`); return }
      st.phase='buy'; st.pendingBuy=i; note(st,`À venda por ${fmt(s.p)}`); return
    }
    if(pr.o===pi){ note(st,'Esta propriedade já é tua'); return }
    if(pr.m){ log(st,`${s.n} está hipotecada: ${p.name} não paga renda.`); plog(st,pr.o,`${p.name} caiu em ${s.s}, mas está hipotecada: não recebeste renda`); note(st,`De ${pname(st,pr.o)}, mas está hipotecada: não há renda a pagar`); return }
    if(p.shield){ log(st,`${p.name} usou a Borla e não pagou renda em ${s.s}.`); plog(st,pr.o,`${p.name} caiu em ${s.s} com a carta Borla: não recebeste renda`); note(st,`De ${pname(st,pr.o)}: a carta Borla evitou a renda`); return }
    const r=rentFor(st,i,dice); pay(st,pi,pr.o,r,`renda de ${s.s}`); stat(st,'rp',pi,r); stat(st,'rr',pr.o,r); stat(st,'prop',i,r);
    log(st,`${p.name} pagou ${fmt(r)} de renda a ${pname(st,pr.o)} (${s.s}).`); note(st,`Renda de ${fmt(r)} paga a ${pname(st,pr.o)}`);
  } else if(s.t==='tax'){ toBank(st,pi,s.p,s.n); log(st,`${p.name} pagou ${fmt(s.p)} de ${s.n}.`); note(st,`Paga ${fmt(s.p)} de ${s.n} ao banco`) }
  else if(s.t==='jail'){ note(st,'Só de visita à Prisão') }
  else if(s.t==='free'){
    if(cfg(st).pot&&(st.pot||0)>0){ const v=st.pot; st.pot=0; pay(st,null,pi,v,'prémio do Parque Verde'); log(st,`${p.name} ganhou o prémio do Parque Verde: ${fmt(v)}!`); note(st,`Prémio do Parque Verde: +${fmt(v)}`) }
    else note(st,cfg(st).pot?'Parque Verde: o prémio está vazio':'Descanso no Parque Verde: não acontece nada');
  }
  else if(s.t==='gotojail'){ sendJail(st,pi) }
  else if((s.t==='chance'||s.t==='chest') && depth<3){
    const deck=s.t==='chance'?CHANCE:CHEST, c=deck[Math.floor(Math.random()*deck.length)];
    st.card={deck:s.n,x:c.x,by:pi}; log(st,`${p.name} tirou ${s.n}: ${c.x}`);
    st.cardlog=[{by:pi,deck:s.n,x:c.x},...(st.cardlog||[])].slice(0,50); plog(st,pi,`Tiraste ${s.n}: ${c.x}`); note(st,`Carta de ${s.n}: ${c.x}`);
    applyCard(st,pi,c,dice,depth);
  }
}
function applyCard(st,pi,c,dice,depth){
  const p=st.players[pi], others=st.players.map((q,j)=>j).filter(j=>j!==pi&&!st.players[j].out);
  switch(c.a){
    case 'money': c.v>0 ? pay(st,null,pi,c.v,c.w) : toBank(st,pi,-c.v,c.w); break;
    case 'moveTo': moveTo(st,pi,c.v); land(st,pi,dice,depth+1); break;
    case 'back': moveBy(st,pi,-c.v); land(st,pi,dice,depth+1); break;
    case 'rail': { let t=p.pos; do{t=(t+1)%40}while(SQ[t].t!=='rail'); moveTo(st,pi,t); land(st,pi,dice,depth+1); break }
    case 'jail': sendJail(st,pi); break;
    case 'card': inv(p)[c.k]=(inv(p)[c.k]||0)+1; break;
    case 'repairs': { let tot=0; Object.values(st.props).forEach(pr=>{ if(pr.o===pi&&pr.h) tot+= pr.h===5?c.v[1]:pr.h*c.v[0] }); toBank(st,pi,tot,'obras'); if(tot) log(st,`${p.name} pagou ${fmt(tot)} em obras.`); break }
    case 'payEach': others.forEach(j=>pay(st,pi,j,c.v,c.w)); break;
    case 'collectEach': others.forEach(j=>pay(st,j,pi,c.v,c.w)); break;
  }
}
function nextPhase(st,pi){ st.phase = (st.again && !st.players[pi].inJail) ? 'roll' : 'end' }
function alive(st){ return st.players.map((p,i)=>i).filter(i=>!st.players[i].out) }
function advanceTurn(st){
  const cur=st.players[st.turn]; if(cur) cur.shield=false;
  const n=st.players.length; let t=st.turn;
  for(let k=0;k<n;k++){ t=(t+1)%n; if(!st.players[t].out) break }
  st.turn=t; st.phase='roll'; st.dbl=0; st.again=false; st.pendingBuy=null;
  log(st,`Vez de ${pname(st,t)}.`);
}
function bankrupt(st,pi,why){
  const p=st.players[pi]; p.out=true; p.money=0; p.inv={jail:0,borla:0,extra:0}; p.shield=false;
  Object.keys(st.props).forEach(k=>{ if(st.props[k].o===pi) delete st.props[k] });
  log(st,why||`${p.name} declarou falência. As propriedades voltaram ao banco.`); plog(st,pi,'Saíste do jogo. As tuas propriedades voltaram ao banco.');

  const a=alive(st);

function canStillAct(st,pi){
  const p=st.players[pi];
  if(p.money<0) return true;
  if(inv(p).extra&&!p.inJail) return true;
  for(const [k,pr] of Object.entries(st.props)){
    if(pr.o!==pi) continue; const s=SQ[k];
    if(pr.m && p.money>=Math.ceil(s.p*0.55)) return true;
    if(s.t==='prop'&&!pr.m&&pr.h<5&&ownsGroup(st,pi,s.g)){
      const grp=groupOf(s.g);
      if(grp.every(j=>!st.props[j].m) && pr.h<=Math.min(...grp.map(j=>st.props[j].h)) && p.money>=G[s.g].hc) return true;
    }
  }
  return false;
}
function autoEnd(st,pi){
  if(st.status!=='playing'||st.phase!=='end'||st.turn!==pi||canStillAct(st,pi)) return;
  log(st,`${st.players[pi].name} não tinha mais nada para fazer: a vez passou automaticamente.`);
  advanceTurn(st);
}
function tradeable(st,i){ const s=SQ[i]; if(s.t!=='prop') return true; return groupOf(s.g).every(j=>!st.props[j]||!st.props[j].h) }
function myIdx(st){ return st.players.findIndex(p=>p.id===me.id) }
function myTurn(st){ const i=st.turn; return st.status==='playing'&&st.players[i]&&st.players[i].id===me.id ? i : -1 }
function cleanCards(o){ const r={}; SKEYS.forEach(k=>r[k]=Math.max(0,Math.floor(+((o||{})[k])||0))); return r }
function validTrade(st,t){
  const f=st.players[t.from], o=st.players[t.to];
  if(!f||!o||f.out||o.out) return 'Um dos jogadores já não está em jogo.';
  if(!t.give.every(i=>st.props[i]&&st.props[i].o===t.from&&tradeable(st,i))) return `As propriedades de ${f.name} mudaram.`;
  if(!t.get.every(i=>st.props[i]&&st.props[i].o===t.to&&tradeable(st,i))) return `As propriedades de ${o.name} mudaram.`;
  if(f.money<t.gm) return `${f.name} já não tem esse dinheiro.`;
  if(o.money<t.tm) return `${o.name} já não tem esse dinheiro.`;
  if(SKEYS.some(k=>(inv(f)[k]||0)<t.gc[k])) return `${f.name} já não tem essas cartas.`;
  if(SKEYS.some(k=>(inv(o)[k]||0)<t.tc[k])) return `${o.name} já não tem essas cartas.`;
  return null;
}
function emptyTrade(t){ return !t.give.length&&!t.get.length&&!t.gm&&!t.tm&&SKEYS.every(k=>!t.gc[k]&&!t.tc[k]) }

/* ===================== BOTS ===================== */
const BOTRES={facil:40,medio:120,dificil:200};
function botValue(st,bi,i){
  const c=cfg(st), d=c.botDiff, s=SQ[i]; if(!s.p) return 0;
  let v=s.p*({facil:.8,medio:1,dificil:1.1}[d]||1);
  if(s.t==='prop'){
    const grp=groupOf(s.g), mine=grp.filter(j=>j!==i&&st.props[j]&&st.props[j].o===bi).length;
    if(mine===grp.length-1) v*=d==='dificil'?2:1.6; else if(mine>0) v*=1.15;
    if(d==='dificil'){
      const others=grp.filter(j=>j!==i&&st.props[j]&&st.props[j].o!==bi).map(j=>st.props[j].o);
      if(others.length===grp.length-1&&new Set(others).size===1) v*=1.4;
      if(['laranja','vermelho','verde'].includes(s.g)) v*=1.1;
    }
  } else if(s.t==='rail'){ v*=1+.15*countType(st,bi,'rail') } else v*=.9;
  if(d==='facil') v*=.8+Math.random()*.4;
  return Math.round(v);
}
function botBuild(st,bi){
  const c=cfg(st), d=c.botDiff, p=st.players[bi], res=BOTRES[d]*({facil:3,medio:1.5,dificil:1}[d]);
  if(d==='facil'&&Math.random()<.5) return;
  for(let n=0;n<8;n++){
    const opts=Object.keys(st.props).map(Number).filter(i=>{ const s=SQ[i], pr=st.props[i]; if(pr.o!==bi||s.t!=='prop'||pr.m||pr.h>=5||!ownsGroup(st,bi,s.g)) return false;
      const grp=groupOf(s.g); return grp.every(j=>!st.props[j].m)&&pr.h<=Math.min(...grp.map(j=>st.props[j].h)) });
    if(!opts.length) return;
    opts.sort((a,b)=>st.props[a].h-st.props[b].h||SQ[b].p-SQ[a].p);
    const i=opts[0], hc=G[SQ[i].g].hc; if(p.money-hc<res) return;
    A.build(st,{i});
  }
}
function botUnmortgage(st,bi){
  const p=st.players[bi], res=BOTRES[cfg(st).botDiff]*3;
  Object.keys(st.props).map(Number).filter(i=>st.props[i].o===bi&&st.props[i].m).forEach(i=>{ const c=Math.ceil(SQ[i].p*.55); if(p.money-c>res) A.unmortgage(st,{i}) });
}
function botTradeOk(st,t){
  const c=cfg(st), bi=t.to, th={facil:.8,normal:1.05,dificil:1.35}[c.botTrade]||1.05;
  const CV={jail:50,borla:60,extra:40};
  const loseVal=i=>{ const s=SQ[i]; let v=s.p; if(s.t==='prop'){ const grp=groupOf(s.g); const theirs=grp.filter(j=>j!==i&&st.props[j]&&st.props[j].o===t.from).length;
      if(theirs===grp.length-1) v*=c.botTrade==='facil'?1.2:c.botTrade==='dificil'?2.5:1.8;
      if(grp.filter(j=>j!==i&&st.props[j]&&st.props[j].o===bi).length) v*=1.3 } return v };
  let give=t.tm+t.get.reduce((a,i)=>a+loseVal(i),0)+SKEYS.reduce((a,k)=>a+t.tc[k]*CV[k],0);
  let recv=t.gm+t.give.reduce((a,i)=>a+botValue(st,bi,i),0)+SKEYS.reduce((a,k)=>a+t.gc[k]*CV[k],0);
  if(st.players[bi].money-t.tm<BOTRES[c.botDiff]/2&&t.tm>0) return false;
  return recv>=give*th*(.95+Math.random()*.1);
}
function botPropose(st,bi){
  const c=cfg(st), p=st.players[bi];
  if((st.trades||[]).some(t=>t.from===bi)) return false;
  st.botAsk=st.botAsk||{}; const last=st.botAsk[p.id]; if(last!==undefined&&(st.rollId||0)-last<6*alive(st).length) return false;
  for(const g of Object.keys(G)){
    const grp=groupOf(g), mine=grp.filter(j=>st.props[j]&&st.props[j].o===bi);
    if(mine.length!==grp.length-1) continue;
    const i=grp.find(j=>!mine.includes(j)), pr=st.props[i];
    if(!pr||pr.o===bi||st.players[pr.o].out||!tradeable(st,i)) continue;
    const mult={facil:1.6,medio:2,dificil:2.2}[c.botDiff]||2, gm=Math.round(Math.min(p.money-BOTRES[c.botDiff],SQ[i].p*mult)/10)*10;
    if(gm<SQ[i].p) continue;
    st.botAsk[p.id]=st.rollId||0;
    return A.propose(st,{to:pr.o,give:[],get:[i],gm,tm:0,gc:{},tc:{}})===undefined;
  }
  return false;
}
function botStep(st){
  if(st.status!=='playing') return false;
  const c=cfg(st), now=Date.now();
  if(st.phase==='auction'&&st.auction){
    const a=st.auction;
    if(now>=a.endsAt) return A.auctionEnd(st);
    const bots=st.players.map((p,i)=>i).filter(i=>st.players[i].bot&&!st.players[i].out&&i!==a.by).sort(()=>Math.random()-.5);
    for(const bi of bots){
      const p=st.players[bi], step=SQ[a.i].p>=200?20:10, amt=a.bid+step, v=botValue(st,bi,a.i);
      if(v>=amt&&p.money-BOTRES[c.botDiff]>=amt) return withActor(st,bi,()=>A.bid(st,{amt}));
    }
    return false;
  }
  for(const t of (st.trades||[])){
    const b=st.players[t.to]; if(!b||!b.bot||now-(t.at||0)<2500) continue;
    return withActor(st,t.to,()=> validTrade(st,t)===null&&botTradeOk(st,t) ? A.accept(st,{id:t.id}) : A.reject(st,{id:t.id}));
  }
  const bi=st.turn, p=st.players[bi]; if(!p||!p.bot||p.out) return false;
  return withActor(st,bi,()=>{
    if(st.phase==='roll'){
      if(p.money<0&&!liquidate(st,bi)){ bankrupt(st,bi); return }
      if(p.inJail){ if(inv(p).jail) A.useCard(st,{k:'jail'}); else if(c.botDiff==='dificil'&&p.jailTurns===0&&p.money>BOTRES.dificil+JAIL_FEE&&countType(st,bi,'prop')<4) A.payJail(st) }
      return A.roll(st);
    }
    if(st.phase==='buy'){
      const i=st.pendingBuy, s=SQ[i], v=botValue(st,bi,i);
      const completes=s.t==='prop'&&groupOf(s.g).every(j=>j===i||(st.props[j]&&st.props[j].o===bi));
      const ok=p.money>=s.p&&(p.money-s.p>=BOTRES[c.botDiff]||completes)&&v>=s.p*.85&&!(c.botDiff==='facil'&&Math.random()<.2);
      return ok?A.buy(st):A.pass(st);
    }
    if(st.phase==='end'){
      if(p.money<0&&!liquidate(st,bi)){ bankrupt(st,bi); return }
      botPropose(st,bi); botBuild(st,bi); botUnmortgage(st,bi);
      if(inv(p).extra&&!p.inJail&&c.botDiff!=='facil'){ A.useCard(st,{k:'extra'}); return }
      return A.end(st);
    }
    return false;
  });
}

/* ===================== AÇÕES (correm dentro de uma transação) ===================== */
const A = {
  join(st,{name}){
    if(st.players.some(p=>p.id===me.id)) return true;
    if(st.status!=='lobby') return 'O jogo desta sala já começou.';
    if(st.players.length>=MAXP) return `A sala está cheia (máx. ${MAXP}).`;
    const used=st.players.map(p=>p.color);
    st.players.push({id:me.id,name:name.slice(0,18),color:COLORS.find(c=>!used.includes(c)),rc:rcode(),...(okPhoto(myPhoto())?{photo:myPhoto()}:{})});
    st.pids=[...new Set([...(st.pids||[]),me.id])];
    log(st,`${name} entrou na sala.`);
  },
  leave(st){
    if(st.status!=='lobby') return 'Não podes sair a meio do jogo; declara falência.';
    const i=myIdx(st); if(i<0) return false;
    log(st,`${st.players[i].name} saiu da sala.`); st.players.splice(i,1); st.pids=(st.pids||[]).filter(x=>x!==me.id);
    if(st.host===me.id && st.players[0]) st.host=st.players[0].id;
  },
  kick(st,{idx}){
    if(st.host!==me.id) return 'Só o anfitrião pode retirar jogadores.';
    if(st.status==='lobby'){ const kid=st.players[idx].id; log(st,`${st.players[idx].name} foi retirado.`); st.players.splice(idx,1); st.pids=(st.pids||[]).filter(x=>x!==kid); return }
    if(st.status==='playing') bankrupt(st,idx,`${st.players[idx].name} foi retirado pelo anfitrião.`);
  },
  start(st){
    if(st.host!==me.id) return 'Só o anfitrião pode começar.';
    const c=cfg(st);
    while(c.fillTo&&st.players.length<c.fillTo&&addBot(st));
    if(st.players.length<2) return 'São precisos pelo menos 2 jogadores (podes adicionar bots).';
    st.players.sort(()=>Math.random()-.5);
    st.players.forEach(p=>Object.assign(p,{pos:0,money:c.start,inJail:false,jailTurns:0,laps:0,inv:{jail:0,borla:0,extra:0},shield:false,out:false}));
    Object.assign(st,{status:'playing',turn:0,phase:'roll',dice:[1,1],rollId:0,dbl:0,again:false,props:{},card:null,trades:[],landing:null,pendingBuy:null,winner:null,ev:[],evN:0,startedAt:Date.now(),stats:{},pot:0,auction:null,ranking:null,endsAt:c.timeLimit?Date.now()+c.timeLimit*60000:0,turnAt:Date.now()});
    log(st,`O jogo começou! ${st.players[0].name} joga primeiro.${c.firstLap?' Na primeira volta ninguém compra: só depois de passarem pela Partida.':''}`);
  },
  roll(st){
    const pi=myTurn(st); if(pi<0||st.phase!=='roll') return false;
    const p=st.players[pi]; if(p.money<0) return 'Tens saldo negativo: vende ou hipoteca antes de lançar.';
    const d=[roll6(),roll6()], sum=d[0]+d[1], doubles=d[0]===d[1];
    st.dice=d; st.rollId=(st.rollId||0)+1; st.card=null;
    st.landing={by:pi,n:st.rollId,d,notes:[],from:p.pos};
    log(st,`${p.name} lançou ${d[0]} + ${d[1]}${doubles?' (duplos)':''}.`);
    const fin=()=>{ st.landing.i=p.pos };
    if(p.inJail){
      if(doubles){ p.inJail=false; p.jailTurns=0; log(st,`${p.name} saiu da Prisão com duplos.`); note(st,'Duplos: sai da Prisão'); st.again=false; moveBy(st,pi,sum); land(st,pi,sum) }
      else { p.jailTurns++;
        if(p.jailTurns>=3){ toBank(st,pi,JAIL_FEE,'fiança'); p.inJail=false; p.jailTurns=0; log(st,`${p.name} pagou ${fmt(JAIL_FEE)} e saiu da Prisão.`); note(st,`Terceira tentativa falhada: paga ${fmt(JAIL_FEE)} de fiança e sai`); st.again=false; moveBy(st,pi,sum); land(st,pi,sum) }
        else { note(st,`Sem duplos: continua na Prisão (tentativa ${p.jailTurns} de 3)`); st.phase='end'; fin(); return } }
    } else {
      if(doubles){ st.dbl=(st.dbl||0)+1; if(st.dbl>=3){ log(st,`Três duplos seguidos!`); note(st,'Três duplos seguidos!'); sendJail(st,pi); st.phase='end'; fin(); return } }
      st.again=doubles; moveBy(st,pi,sum); land(st,pi,sum);
    }
    if(st.again&&!p.inJail) note(st,'Saíram duplos: volta a lançar');
    if(st.phase!=='buy') nextPhase(st,pi);
    fin();
  },
  payJail(st){
    const pi=myTurn(st), p=st.players[pi]; if(pi<0||!p.inJail||st.phase!=='roll') return false;
    if(p.money<JAIL_FEE) return 'Não tens dinheiro para a fiança.';
    toBank(st,pi,JAIL_FEE,'fiança'); p.inJail=false; p.jailTurns=0; log(st,`${p.name} pagou a fiança de ${fmt(JAIL_FEE)}.`);
  },
  useCard(st,{k}){
    const pi=myTurn(st); if(pi<0) return 'Só podes usar cartas na tua vez.';
    const p=st.players[pi], v=inv(p);
    if(!v[k]) return 'Não tens essa carta.';
    if(k==='jail'){ if(!p.inJail||st.phase!=='roll') return 'Só serve quando estás na Prisão, antes de lançares.'; p.inJail=false; p.jailTurns=0 }
    else if(k==='borla'){ if(p.shield) return 'A Borla já está ativa.'; p.shield=true }
    else if(k==='extra'){ if(st.phase!=='end'||p.inJail) return 'Usa depois de jogares, antes de passares a vez.'; st.phase='roll'; st.again=false; st.dbl=0 }
    v[k]--; log(st,`${p.name} usou a carta "${SPECIAL[k].n}".`); plog(st,pi,`Usaste a carta "${SPECIAL[k].n}"`);
  },
  buy(st){
    const pi=myTurn(st); if(pi<0||st.phase!=='buy') return false;
    const i=st.pendingBuy, s=SQ[i], p=st.players[pi];
    if(p.money<s.p) return 'Não tens dinheiro suficiente.';
    pay(st,pi,null,s.p,`compra de ${s.s}`); st.props[i]={o:pi,h:0,m:false}; st.pendingBuy=null;
    log(st,`${p.name} comprou ${s.n} por ${fmt(s.p)}.`); nextPhase(st,pi);
  },
  pass(st){
    const pi=myTurn(st); if(pi<0||st.phase!=='buy') return false;
    const i=st.pendingBuy, p=st.players[pi];
    log(st,`${p.name} não comprou ${SQ[i].n}: vai a leilão.`); note(st,'Não comprada: vai a leilão');
    st.auction={i,bid:0,by:null,endsAt:Date.now()+15000,ret:(st.again&&!p.inJail)?'roll':'end',roller:pi};
    st.pendingBuy=null; st.phase='auction';
  },
  bid(st,{amt}){
    const a=st.auction, pi=myIdx(st); if(st.phase!=='auction'||!a||pi<0) return false;
    const p=st.players[pi]; if(p.out) return false;
    amt=Math.floor(+amt||0);
    if(amt<=a.bid) return `A licitação tem de ser maior que ${fmt(a.bid)}.`;
    if(amt>p.money) return 'Não tens esse dinheiro.';
    if(Date.now()>a.endsAt+1500) return 'O leilão já terminou.';
    a.bid=amt; a.by=pi; a.endsAt=Math.max(a.endsAt,Date.now()+7000);
    log(st,`${p.name} licitou ${fmt(amt)} por ${SQ[a.i].s}.`);
  },
  auctionEnd(st){
    const a=st.auction; if(st.phase!=='auction'||!a||Date.now()<a.endsAt) return false;
    const s=SQ[a.i];
    if(a.by!==null&&st.players[a.by]&&!st.players[a.by].out&&st.players[a.by].money>=a.bid&&!st.props[a.i]){
      pay(st,a.by,null,a.bid,`leilão de ${s.s}`); st.props[a.i]={o:a.by,h:0,m:false};
      log(st,`${pname(st,a.by)} ganhou o leilão de ${s.n} por ${fmt(a.bid)}.`); plog(st,a.by,`Ganhaste o leilão de ${s.s}`);
    } else log(st,`Ninguém licitou ${s.n}: continua à venda.`);
    st.phase=a.ret; st.auction=null;
  },
  finish(st){
    if(st.host!==me.id) return 'Só o anfitrião pode terminar o jogo.';
    if(st.status!=='playing') return false;
    endGame(st,'O anfitrião terminou o jogo. Ganha quem tem mais património.');
  },
  timeUp(st){
    if(st.status!=='playing'||!st.endsAt||Date.now()<st.endsAt) return false;
    endGame(st,'Acabou o tempo de jogo. Ganha quem tem mais património.');
  },
  timeout(st){
    const c=cfg(st), t=st.turn, p=st.players[t];
    if(!c.turnTime||st.status!=='playing'||!p||p.bot||!['roll','buy','end'].includes(st.phase)) return false;
    if(Date.now()<(st.turnAt||0)+turnLimit(st,p)) return false;
    log(st,`O tempo de ${p.name} esgotou-se: o jogo avançou por ele.`);
    return withActor(st,t,()=>{
      if(st.phase==='roll'){ if(p.money<0&&!liquidate(st,t)){ bankrupt(st,t); return } return A.roll(st) }
      if(st.phase==='buy') return A.pass(st);
      if(p.money<0&&!liquidate(st,t)){ bankrupt(st,t); return }
      return A.end(st);
    });
  },
  addBot(st){
    if(st.host!==me.id||st.status!=='lobby') return false;
    if(!addBot(st)) return `A sala está cheia (máx. ${MAXP}).`;
    log(st,`${st.players[st.players.length-1].name} entrou na sala.`);
  },
  removeBot(st,{idx}){
    if(st.host!==me.id||st.status!=='lobby'||!st.players[idx]?.bot) return false;
    log(st,`${st.players[idx].name} saiu da sala.`); st.players.splice(idx,1);
  },
  setPhoto(st,{photo}){
    const p=st.players[myIdx(st)]; if(!p) return false;
    if(photo===null){ delete p.photo; return }
    if(!okPhoto(photo)) return 'Não consegui usar essa imagem. Experimenta outra.';
    p.photo=photo;
  },
  setCfg(st,patch){
    if(st.host!==me.id||st.status!=='lobby') return false;
    st.cfg=Object.assign(cfg(st),patch);
  },
  reclaim(st,{rc}){
    rc=String(rc||'').trim().toUpperCase(); if(!rc) return 'Escreve o teu código.';
    if(st.players.some(p=>p.id===me.id)) return 'Já estás neste jogo.';
    const p=st.players.find(q=>q.rc===rc&&!q.bot); if(!p) return 'Código errado. Confirma o código que aparece no teu painel de jogador.';
    const old=p.id; p.id=me.id; if(st.host===old) st.host=me.id;
    st.pids=[...new Set([...(st.pids||[]).filter(x=>x!==old),me.id])];
    log(st,`${p.name} voltou ao jogo noutro dispositivo.`);
  },
  botStep(st){ return botStep(st) },
  end(st){
    const pi=myTurn(st); if(pi<0||st.phase!=='end') return false;
    if(st.players[pi].money<0) return 'Resolve o saldo negativo antes de passar a vez.';
    advanceTurn(st);
  },
  build(st,{i}){
    const pi=myTurn(st); if(pi<0) return 'Só podes construir na tua vez.';
    const s=SQ[i], pr=st.props[i], p=st.players[pi];
    if(!pr||pr.o!==pi||s.t!=='prop') return false;
    const hc=G[s.g].hc, grp=groupOf(s.g);
    if(!ownsGroup(st,pi,s.g)) return 'Precisas de ter todas as propriedades desta cor.';
    if(grp.some(j=>st.props[j].m)) return 'Há propriedades hipotecadas neste grupo.';
    if(pr.h>=5) return 'Já tem hotel.';
    if(pr.h>Math.min(...grp.map(j=>st.props[j].h))) return 'Constrói de forma equilibrada no grupo.';
    if(p.money<hc) return 'Não tens dinheiro suficiente.';
    pr.h++; pay(st,pi,null,hc,`${pr.h===5?'hotel':'casa'} em ${s.s}`,true); log(st,`${p.name} construiu ${pr.h===5?'um hotel':'uma casa'} em ${s.s} (${fmt(hc)}).`);
  },
  sell(st,{i}){
    const pi=myTurn(st); if(pi<0) return 'Só podes vender na tua vez.';
    const s=SQ[i], pr=st.props[i], grp=groupOf(s.g);
    if(!pr||pr.o!==pi||!pr.h) return false;
    if(pr.h<Math.max(...grp.map(j=>st.props[j].h))) return 'Vende de forma equilibrada no grupo.';
    const v=G[s.g].hc/2; pr.h--; pay(st,null,pi,v,`venda de construção em ${s.s}`,true); log(st,`${st.players[pi].name} vendeu uma construção em ${s.s} (+${fmt(v)}).`);
  },
  mortgage(st,{i}){
    const pi=myTurn(st); if(pi<0) return 'Só podes hipotecar na tua vez.';
    const s=SQ[i], pr=st.props[i]; if(!pr||pr.o!==pi||pr.m) return false;
    if(s.t==='prop' && groupOf(s.g).some(j=>st.props[j]&&st.props[j].h)) return 'Vende primeiro as construções deste grupo.';
    pr.m=true; pay(st,null,pi,s.p/2,`hipoteca de ${s.s}`,true); log(st,`${st.players[pi].name} hipotecou ${s.s} (+${fmt(s.p/2)}).`);
  },
  unmortgage(st,{i}){
    const pi=myTurn(st); if(pi<0) return 'Só podes pagar a hipoteca na tua vez.';
    const s=SQ[i], pr=st.props[i]; if(!pr||pr.o!==pi||!pr.m) return false;
    const c=Math.ceil(s.p*0.55); if(st.players[pi].money<c) return 'Não tens dinheiro suficiente.';
    pr.m=false; pay(st,pi,null,c,`fim da hipoteca de ${s.s}`,true); log(st,`${st.players[pi].name} recuperou ${s.s} (${fmt(c)}).`);
  },
  bankrupt(st){
    const pi=myIdx(st); if(pi<0||st.status!=='playing') return false;
    bankrupt(st,pi);
  },
  abandon(st){
    if(st.status==='lobby') return A.leave(st);
    const pi=myIdx(st);
    if(pi>=0&&st.status==='playing'&&!st.players[pi].out) bankrupt(st,pi,`${st.players[pi].name} abandonou o jogo. As propriedades voltaram ao banco.`);
    st.pids=(st.pids||[]).filter(x=>x!==me.id);
  },
  autoEnd(st){
    const t=st.turn, p=st.players[t]; if(st.status!=='playing'||st.phase!=='end'||!p||canStillAct(st,t)) return false;
    if(p.id!==me.id && Date.now()-(st.updatedAt||0)<20000) return false;
    autoEnd(st,t);
  },
  forget(st){ st.pids=(st.pids||[]).filter(x=>x!==me.id) },
  chat(st,{text,name}){
    text=String(text||'').trim().slice(0,300); if(!text) return false;
    const pi=myIdx(st), p=st.players[pi];
    st.chat=[...(st.chat||[]),{u:me.id,n:(p?p.name:(name||'Espectador')).slice(0,18),c:p?p.color:'#8892B0',t:text,at:Date.now()}].slice(-80);
  },
  donate(st,{to,amt}){
    const pi=myIdx(st); if(pi<0||st.status!=='playing'||st.players[pi].out) return false;
    amt=Math.floor(+amt||0); if(amt<=0) return 'Escolhe um valor maior que zero.';
    if(st.players[pi].money<amt) return 'Não tens esse dinheiro.';
    if(!st.players[to]||st.players[to].out||to===pi) return false;
    pay(st,pi,to,amt,'doação'); log(st,`${st.players[pi].name} doou ${fmt(amt)} a ${st.players[to].name}.`);
  },
  propose(st,t){
    const pi=myIdx(st); if(pi<0||st.status!=='playing'||st.players[pi].out) return false;
    st.trades=st.trades||[];
    if(st.trades.filter(x=>x.from===pi).length>=5) return 'Já tens 5 propostas à espera. Cancela alguma primeiro.';
    const tr={at:Date.now(),id:Math.random().toString(36).slice(2,9),from:pi,to:t.to,give:t.give,get:t.get,gm:t.gm,tm:t.tm,gc:cleanCards(t.gc),tc:cleanCards(t.tc)};
    if(emptyTrade(tr)) return 'A proposta está vazia.';
    const bad=validTrade(st,tr); if(bad) return bad;
    st.trades.push(tr); log(st,`${pname(st,pi)} fez uma proposta a ${pname(st,t.to)}.`);
  },
  counter(st,t){
    const pi=myIdx(st), list=st.trades||[], k=list.findIndex(x=>x.id===t.id);
    const old=list[k]; if(!old||old.to!==pi) return 'Esta proposta já não está ativa.';
    const tr={at:Date.now(),id:Math.random().toString(36).slice(2,9),from:pi,to:old.from,give:t.give,get:t.get,gm:t.gm,tm:t.tm,gc:cleanCards(t.gc),tc:cleanCards(t.tc)};
    if(emptyTrade(tr)) return 'A contraproposta está vazia.';
    const bad=validTrade(st,tr); if(bad) return bad;
    list.splice(k,1,tr); st.trades=list; log(st,`${pname(st,pi)} fez uma contraproposta a ${pname(st,old.from)}.`);
  },
  accept(st,{id}){
    const pi=myIdx(st), list=st.trades||[], t=list.find(x=>x.id===id); if(!t||t.to!==pi) return 'Esta proposta já não está ativa.';
    const bad=validTrade(st,t); if(bad){ st.trades=list.filter(x=>x!==t); log(st,'A proposta foi anulada: '+bad); return }
    const f=st.players[t.from], o=st.players[t.to];
    t.give.forEach(i=>st.props[i].o=t.to); t.get.forEach(i=>st.props[i].o=t.from);
    if(t.gm) pay(st,t.from,t.to,t.gm,'negócio'); if(t.tm) pay(st,t.to,t.from,t.tm,'negócio');
    SKEYS.forEach(k=>{ inv(f)[k]+=t.tc[k]-t.gc[k]; inv(o)[k]+=t.gc[k]-t.tc[k] });
    const lst=(props,cards)=>[...props.map(i=>SQ[i].s),...SKEYS.filter(k=>cards[k]).map(k=>`${cards[k]}× ${SPECIAL[k].n}`)].join(', ')||'nada';
    plog(st,t.from,`Negócio com ${o.name}: deste ${lst(t.give,t.gc)}, recebeste ${lst(t.get,t.tc)}`);
    plog(st,t.to,`Negócio com ${f.name}: deste ${lst(t.get,t.tc)}, recebeste ${lst(t.give,t.gc)}`);
    log(st,`${o.name} aceitou o negócio com ${f.name}.`);
    st.trades=list.filter(x=>x!==t).filter(x=>{ const b=validTrade(st,x); if(b) log(st,`Uma proposta de ${pname(st,x.from)} a ${pname(st,x.to)} foi anulada: ${b}`); return !b });
  },
  reject(st,{id}){
    const pi=myIdx(st), list=st.trades||[], t=list.find(x=>x.id===id); if(!t||(t.to!==pi&&t.from!==pi)) return false;
    log(st,t.from===pi?`${pname(st,pi)} cancelou uma proposta a ${pname(st,t.to)}.`:`${pname(st,pi)} recusou a proposta de ${pname(st,t.from)}.`);
    st.trades=list.filter(x=>x!==t);
  },
};

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,3400) }

async function boot(){
  renderHome();
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.firestore(); db.settings({ignoreUndefinedProperties:true});
    const c=await firebase.auth().signInAnonymously(); me.id=c.user.uid;
  }catch(e){
    db=null; app.innerHTML=`<div class="banner warn">Não consegui ligar ao servidor do jogo. Confirma que o login anónimo está ativo no Firebase e que este domínio está nos domínios autorizados, e recarrega.<br><small class="note">Código: ${esc((e&&e.code)||'')} ${esc((e&&e.message)||String(e))}</small></div>`; return
  }
  window.addEventListener('hashchange',route);
  route();
}
function route(){
  const h=location.hash.replace('#','').toUpperCase();
  if(unsub){unsub();unsub=null}
  resetAnim();
  if(/^[A-Z]{5}$/.test(h)){ code=h; openRoom() } else { code=null; state=null; listRooms(); renderHome() }
}
async function mutate(fn,arg,room=code){
  if(!room||!db) return;
  const ref=db.doc('rooms/'+room); let msg=null, out=null;
  try{
    await db.runTransaction(async tx=>{
      msg=null; out=null;
      const snap=await tx.get(ref);
      if(!snap.exists){ msg='Esta sala já não existe.'; return }
      const st=structuredClone(snap.data());
      const res=fn(st,arg||{});
      if(typeof res==='string'){ msg=res; return }
      if(res===false||res===true) return;
      const pre=snap.data(); if(st.turn!==pre.turn||st.phase!==pre.phase) st.turnAt=Date.now();
      st.rev=(st.rev||0)+1; st.updatedAt=Date.now();
      tx.set(ref,st); out=st;
    });
    if(msg) toast(msg);
    if(out&&room===code) applyState(out);
  }catch(e){
    toast(e&&e.code==='permission-denied'?'Sem permissão para guardar. Confirma as regras do Firestore.':'Não consegui guardar a jogada. Tenta de novo.');
  }
}
const act=(name,arg)=>mutate(A[name],arg);

let lastChat=0, disp={}, dispDice=[1,1], rolling=false, walking=false, lastRoll=null, lastEv=null, noteQ=[], diceTimer=null, walkTimer=null, hopped=new Set();
function resetAnim(){ showLanding=null; holdUntil=0; disp={}; lastRoll=null; lastEv=null; noteQ=[]; rolling=false; walking=false; clearInterval(diceTimer); clearInterval(walkTimer) }
function applyState(ns){
  if(state&&state.code===ns.code&&(ns.rev||0)<(state.rev||0)) return;
  const fresh=!state||state.code!==ns.code||lastRoll===null;
  const prev=state; state=ns;
  if(fresh){
    lastRoll=ns.rollId||0; lastEv=ns.evN||0; dispDice=ns.dice||[1,1]; lastChat=Math.max(0,...(ns.chat||[]).map(m=>m.at));
    disp={}; (ns.players||[]).forEach(p=>{ if(p.pos!==undefined) disp[p.id]=p.pos });
    showLanding=null; holdUntil=0; render(); setTimeout(followActive,60); return;
  }
  (ns.ev||[]).forEach(e=>{ if(e.n>lastEv) noteQ.push(e) }); lastEv=Math.max(lastEv,ns.evN||0);
  const newMsgs=(ns.chat||[]).filter(m=>m.at>lastChat&&m.u!==me.id); lastChat=Math.max(lastChat,...(ns.chat||[]).map(m=>m.at),0);
  if(newMsgs.length&&!chatVisible()) newMsgs.slice(-3).forEach(m=>chatNote(m));
  const rolled=(ns.rollId||0)!==lastRoll; lastRoll=ns.rollId||0;
  const turnChanged=prev&&prev.turn!==ns.turn;
  if(turnChanged&&myTurn(ns)>=0) setTimeout(()=>sfx('turn'),rolled?3500:200);
  if(prev&&prev.auction&&ns.auction&&ns.auction.bid!==prev.auction.bid&&ns.auction.by!==myIdx(ns)) sfx('bid');
  if(prev&&prev.status==='playing'&&ns.status==='ended') sfx('win');
  if(ns.phase==='auction'&&prev&&prev.phase!=='auction') setTimeout(()=>{ centerBoard(); if(innerWidth<1100) $('.landing.auction')?.scrollIntoView({behavior:'smooth',block:'center',inline:'center'}) },150);
  if(ns.status==='ended'&&prev&&prev.status!=='ended') setTimeout(()=>{ centerBoard(); if(innerWidth<1100) $('.endscreen')?.scrollIntoView({behavior:'smooth',block:'center',inline:'center'}) },150);
  if(ns.landing&&prev&&ns.landing.n!==prev.landing?.n&&ns.landing.by===myIdx(ns)&&ns.players[ns.landing.by]?.inJail) setTimeout(()=>sfx('jail'),3200);
  render();
  if(turnChanged&&!rolled) setTimeout(followActive,80);
  if(rolled){ showLanding=null; clearTimeout(landTimer); landTimer=null; rollDice(ns.dice,()=>startWalk(true)) } else if(!rolling&&!walking) startWalk(false);
}
function rollDice(final,cb){
  clearInterval(diceTimer); rolling=true; drawDice(); sfx('dice');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t=0;
  diceTimer=setInterval(()=>{ dispDice=[roll6(),roll6()]; drawDice(); if((t+=70)>=(reduce?140:840)){ clearInterval(diceTimer); dispDice=final; rolling=false; drawDice(); render(); cb() } },70);
}
function drawDice(){ const el=$('#dice'); if(!el) return; el.className='dice'+(rolling?' rolling':''); el.innerHTML=dieHTML(dispDice[0])+dieHTML(dispDice[1]) }
function startWalk(fromRoll){
  if(!state||!state.players) return;
  clearInterval(walkTimer);
  const paths={};
  state.players.forEach(p=>{
    if(p.pos===undefined) return;
    const cur=disp[p.id];
    if(cur===undefined||cur===p.pos||p.out){ disp[p.id]=p.pos; return }
    if(p.inJail&&p.pos===10){ paths[p.id]=[10]; return }
    const d=(p.pos-cur+40)%40, path=[];
    if(d>=36){ for(let k=1;k<=40-d;k++) path.push((cur-k+40)%40) } else { for(let k=1;k<=d;k++) path.push((cur+k)%40) }
    paths[p.id]=path;
  });
  const ids=Object.keys(paths);
  if(!ids.length){ walking=false; placeTokens(); afterMove(fromRoll); return }
  walking=true;
  const max=Math.max(...ids.map(i=>paths[i].length)), step=Math.max(240,Math.min(420,6500/max));
  let k=0;
  walkTimer=setInterval(()=>{
    hopped=new Set();
    ids.forEach(id=>{ if(k<paths[id].length){ disp[id]=paths[id][k]; hopped.add(id) } });
    placeTokens(); k++;
    if(k>=max){ clearInterval(walkTimer); walking=false; hopped=new Set(); placeTokens(); afterMove(fromRoll) }
  },step);
}
let showLanding=null, holdUntil=0, landTimer=null;
const inHold=()=>Date.now()<holdUntil;
function afterMove(fromRoll){
  flushNotes();
  if(fromRoll&&state&&state.landing&&state.landing.n===state.rollId&&state.landing.by!==myIdx(state)){
    const L=state.landing, p=state.players[L.by];
    holdUntil=Date.now()+3000; setTimeout(()=>{ if(state) render() },3050);
    if(p&&L.i!==undefined) pushTick(`${pawnP(p)}<span><b>${esc(p.name)}</b> calhou em <b>${esc(SQ[L.i].s)}</b>${L.notes.length?' · '+esc(L.notes.join(' · ')):''}</span>`,'land');
    followActive(); return;
  }
  if(fromRoll&&state&&state.landing&&state.landing.n===state.rollId){
    showLanding=state.landing.n; clearTimeout(landTimer); landTimer=null;
    holdUntil=Date.now()+3000; setTimeout(()=>{ if(state) render() },3050);
    render(); centerBoard(); if(innerWidth<1100) setTimeout(()=>$('.landing')?.scrollIntoView({behavior:'smooth',block:'center',inline:'center'}),120); return;
  }
  followActive();
}
function centerBoard(){ const w=$('#boardwrap'); if(w&&w.scrollWidth>w.clientWidth+4) w.scrollTo({left:(w.scrollWidth-w.clientWidth)/2,behavior:'smooth'}) }
const BC=1.6/12.2, BR=1/12.2, PW=.031, PH=PW*34/26, PE=.008;
const lineC=k=>(k===1?0:BC+(k-2)*BR)+((k===1||k===11)?BC:BR)/2;
function sqPoint(i,k,n){
  const [r,c,side]=cellPos(i), sp=(k-(n-1)/2)*.024, inw=k*.027;
  if(i===0) return [1-BC-PE-PW/2-inw,1-BC-PE];
  if(i===10) return [BC+PE+PW/2+inw,1-BC-PE];
  if(i===20) return [BC+PE+PW/2+inw,BC+PE+PH];
  if(i===30) return [1-BC-PE-PW/2-inw,BC+PE+PH];
  if(side==='b') return [lineC(c)+sp,1-BC-PE];
  if(side==='t') return [lineC(c)+sp,BC+PE+PH];
  if(side==='l') return [BC+PE+PW/2+inw,lineC(r)+PH/2];
  return [1-BC-PE-PW/2-inw,lineC(r)+PH/2];
}
function placeTokens(){
  if(!state) return;
  const layer=$('#pawnlayer'); if(!layer) return;
  const mi=myIdx(state), cur=state.players[state.turn];
  const target=mi>=0&&!state.players[mi].out?state.players[mi]:cur;
  const groups={};
  state.players.forEach(p=>{ if(!p.out&&disp[p.id]!==undefined) (groups[disp[p.id]]=groups[disp[p.id]]||[]).push(p) });
  const seen=new Set();
  Object.entries(groups).forEach(([sq,list])=>list.forEach((p,k)=>{
    const [x,y]=sqPoint(+sq,k,list.length); seen.add(p.id);
    let el=layer.querySelector(`.pwn[data-id="${p.id}"]`);
    const sig=(p.photo||'').length+'|'+p.color+'|'+p.name;
    if(!el){ el=document.createElement('div'); el.className='pwn'; el.dataset.id=p.id; layer.appendChild(el) }
    if(el.dataset.sig!==sig){ el.dataset.sig=sig; el.innerHTML=pawnP(p); el.style.setProperty('--pc',p.color) }
    el.style.left=(x*100)+'%'; el.style.top=(y*100)+'%';
    el.classList.toggle('active',state.status==='playing'&&cur&&cur.id===p.id);
    if(hopped.has(p.id)){ const sv=el.querySelector('svg'); sv.classList.remove('hop'); void sv.offsetWidth; sv.classList.add('hop') }
    if(target&&target.id===p.id){
      let a=layer.querySelector('.pwarrow');
      if(!a){ a=document.createElement('div'); a.className='pwarrow'; layer.appendChild(a) }
      a.style.setProperty('--pc',p.color); a.innerHTML=`<span>${mi>=0&&target===state.players[mi]?'TU':esc(p.name)}</span><i></i>`;
      a.style.left=(x*100)+'%'; a.style.top=((y-PH-.006)*100)+'%';
    }
  }));
  layer.querySelectorAll('.pwn').forEach(el=>{ if(!seen.has(el.dataset.id)) el.remove() });
}

function endHTML(st){
  if(st.status!=='ended') return '';
  const rk=st.ranking||rankPlayers(st), fw=st.finalWorth||st.players.map((p,i)=>worth(st,i)), S=st.stats||{};
  const best=k=>{ const m=S[k]||{}; let bk=null,bv=0; Object.entries(m).forEach(([kk,v])=>{ if(v>bv){bv=v;bk=kk} }); return bk===null?null:[+bk,bv] };
  const hl=[];
  const rr=best('rr'); if(rr) hl.push(['Maior senhorio',`${pname(st,rr[0])} · recebeu ${fmt(rr[1])} em rendas`]);
  const rp=best('rp'); if(rp) hl.push(['Mais rendas pagas',`${pname(st,rp[0])} · ${fmt(rp[1])}`]);
  const jl=best('jail'); if(jl) hl.push(['Cliente da Prisão',`${pname(st,jl[0])} · ${jl[1]} ${jl[1]===1?'vez':'vezes'}`]);
  const pr=best('prop'); if(pr) hl.push(['Casa mais lucrativa',`${SQ[pr[0]].n} · ${fmt(pr[1])}`]);

    <ol class="rank">${rk.map((i,n)=>`<li><span>${n+1}.</span>${pawnP(st.players[i])}<b>${esc(st.players[i].name)}</b><span class="money">${st.players[i].out?'falido':fmt(fw[i]||0)}</span></li>`).join('')}</ol>
    ${hl.length?`<div class="hls">${hl.map(([t,v])=>`<div><span class="eyebrow">${t}</span><div>${esc(v)}</div></div>`).join('')}</div>`:''}
  </div>`;
}

    ${L.notes.length?`<ul>${L.notes.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}

function followActive(){
  const wrap=$('#boardwrap'); if(!wrap||wrap.scrollWidth<=wrap.clientWidth+4||!state) return;
  const p=state.players[state.turn]; if(!p) return;
  if(myTurn(state)>=0&&state.phase==='roll'){ wrap.scrollTo({left:(wrap.scrollWidth-wrap.clientWidth)/2,behavior:'smooth'}); return }
  const cell=document.querySelector(`.cell[data-i="${disp[p.id]??p.pos}"]`); if(!cell) return;
  wrap.scrollTo({left:Math.max(0,cell.offsetLeft-wrap.clientWidth/2+cell.offsetWidth/2),behavior:'smooth'});
}
function chatNote(m){

  el.children[1].textContent=`${m.n}: ${m.t.length>90?m.t.slice(0,90)+'…':m.t}`;
  el.onclick=()=>{ $('#chatlist')?.scrollIntoView({behavior:'smooth',block:'center'}); el.remove() };
  const box=$('#notes'); box.appendChild(el); while(box.children.length>4) box.firstChild.remove();

let autoEndTimer=null, autoEndKey=null;
function scheduleAutoEnd(){
  const st=state; if(!st||st.status!=='playing'||st.phase!=='end'||!st.players[st.turn]){ clearTimeout(autoEndTimer); autoEndKey=null; return }
  if(canStillAct(st,st.turn)){ clearTimeout(autoEndTimer); autoEndKey=null; return }
  const mine=st.players[st.turn].id===me.id;
  if(mine&&(rolling||walking)) return;
  const key=`${st.turn}-${st.rollId}-${mine}`; if(key===autoEndKey) return;
  clearTimeout(autoEndTimer); autoEndKey=key;
  const wait=mine?Math.max(2500,holdUntil-Date.now()+400):21000;
  autoEndTimer=setTimeout(()=>{ autoEndKey=null; if(state&&state.phase==='end') act('autoEnd') },wait);
}
const SFX={on:ls.get('mv-sound')!=='0',ctx:null};
function audio(){ if(!SFX.ctx){ try{ SFX.ctx=new (window.AudioContext||window.webkitAudioContext)() }catch(e){} } if(SFX.ctx&&SFX.ctx.state==='suspended') SFX.ctx.resume(); return SFX.ctx }
addEventListener('pointerdown',()=>{ if(SFX.on) audio() },{passive:true});
function tone(f1,f2,dur,type='sine',vol=.12,delay=0){ const c=SFX.ctx; if(!c) return; const t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.02) }
function sfx(k){
  if(!SFX.on||!SFX.ctx||SFX.ctx.state!=='running') return;
  if(k==='dice') for(let i=0;i<6;i++) tone(180+Math.random()*260,90,.05,'triangle',.08,i*.11);
  if(k==='coin'){ tone(988,null,.08,'square',.05); tone(1319,null,.18,'square',.05,.08) }
  if(k==='loss'){ tone(440,220,.25,'sawtooth',.05) }
  if(k==='jail'){ tone(130,90,.45,'square',.06) }
  if(k==='turn'){ tone(660,null,.12,'sine',.1); tone(990,null,.22,'sine',.1,.12) }
  if(k==='bid'){ tone(1200,null,.05,'square',.04) }
  if(k==='win'){ [523,659,784,1047].forEach((f,i)=>tone(f,null,.25,'triangle',.1,i*.14)) }
}
function soundBtn(){ return `<button class="btn small" id="sndbtn" aria-label="${SFX.on?'Desligar som':'Ligar som'}" title="${SFX.on?'Desligar som':'Ligar som'}">${SFX.on?'🔊':'🔇'}</button>` }
function bindSound(){ const b=$('#sndbtn'); if(b) b.onclick=()=>{ SFX.on=!SFX.on; ls.set('mv-sound',SFX.on?'1':'0'); if(SFX.on){ audio(); setTimeout(()=>sfx('coin'),50) } b.textContent=SFX.on?'🔊':'🔇' } }
let tick=[];
function pushTick(html,cls=''){ tick=[...tick,{html,cls,until:Date.now()+7000}].slice(-3); drawTicker(); setTimeout(drawTicker,7100) }
function tickerHTML(){ tick=tick.filter(t=>t.until>Date.now()); return tick.map(t=>`<div class="tk ${t.cls}">${t.html}</div>`).join('') }
function drawTicker(){ const el=$('#ticker'); if(el) el.innerHTML=tickerHTML() }
function flushNotes(){
  if(rolling||walking||!state) return;
  const mi=myIdx(state);
  noteQ.splice(0).forEach(e=>{
    const who=i=>i===null?'banco':(i===mi?'ti':pname(state,i));
    let txt, cls='';
    if(e.go){ txt= e.b===mi ? 'Recebeste a mesada dos pais' : `${pname(state,e.b)} recebeu a mesada dos pais` }
    else if(e.a===null){ txt=`${e.b===mi?'Recebeste':pname(state,e.b)+' recebeu'} do banco · ${e.w}` }
    else if(e.b===null){ txt=`${e.a===mi?'Pagaste':pname(state,e.a)+' pagou'} ao banco · ${e.w}` }
    else { txt= e.b===mi ? `${pname(state,e.a)} pagou-te · ${e.w}` : `${e.a===mi?'Pagaste':pname(state,e.a)+' pagou'} a ${who(e.b)} · ${e.w}` }
    if(e.a===mi){ cls='loss'; sfx('loss') } else if(e.b===mi){ cls='gain'; sfx('coin') }
    const pl=e.a!==null?state.players[e.a]:state.players[e.b];
    pushTick(`${pl?pawnP(pl):''}<span>${esc(txt)}</span><span class="amt">${e.a===mi?'−':e.b===mi?'+':''}${fmt(e.v)}</span>`,cls);
  });
}

function listRooms(){

// a confirmação sobrevive a atualizações do ecrã (a lista de salas atualiza-se sozinha a toda a hora)
const pending={};
function confirmBtn(b,ask,fn,key){
  key=key||b.id||b.textContent;
  const arm=()=>{ b.dataset.sure=1; b.textContent=ask; b.classList.add('arming') };
  if(pending[key]>Date.now()) arm();
  b.onclick=()=>{
    if(b.dataset.sure){ delete pending[key]; b.disabled=true; fn(); return }
    pending[key]=Date.now()+6000; arm();
    setTimeout(()=>{ if(pending[key]&&pending[key]<=Date.now()){ delete pending[key]; code?render():renderHome() } },6100);
  };
}
async function closeRoom(c){
  try{ await db.doc('rooms/'+c).delete(); myRooms=myRooms.filter(r=>r.code!==c); rooms=rooms.filter(r=>r.code!==c); toast('Sala '+c+' encerrada.'); if(code===c) location.hash=''; else renderHome() }
  catch(e){
    // sem permissão para apagar (por exemplo, a sala foi criada noutro browser): pelo menos tira-a da tua lista
    await mutate(A.forget,{},c); myRooms=myRooms.filter(r=>r.code!==c);
    toast('Não foi possível apagar a sala para todos, mas foi removida da tua lista.'); if(code===c) location.hash=''; else renderHome();
  }
}
function saveNick(){ const n=$('#nick')?.value.trim(); if(n) ls.set('mv-nick',n) }
async function createRoom(solo){
  const name=$('#nick').value.trim(); if(!name) return toast('Escreve o teu nome primeiro.');
  ls.set('mv-nick',name);
  if(!db) return;
  const L='ABCDEFGHJKLMNPQRSTUVWXYZ'; let c=''; for(let i=0;i<5;i++) c+=L[Math.floor(Math.random()*L.length)];
  const st={code:c,host:me.id,status:'lobby',createdAt:Date.now(),updatedAt:Date.now(),rev:1,
    players:[{id:me.id,name:name.slice(0,18),color:COLORS[0],rc:rcode(),...(okPhoto(myPhoto())?{photo:myPhoto()}:{})}],pids:[me.id],props:{},log:[`${name} criou a sala.`],
    cfg:Object.assign({},DEFCFG,solo?{solo:true,fillTo:4}:{})};
  try{ await db.doc('rooms/'+c).set(st); location.hash=c }
  catch(e){ toast(e&&e.code==='permission-denied'?'Sem permissão para criar salas. Confirma as regras do Firestore.':'Não consegui criar a sala.') }
}

function boardHTML(st){
  let h='<div class="board">';
  SQ.forEach((s,i)=>{
    const [r,c,side]=cellPos(i), pr=st.props?.[i], corner=i%10===0, own=pr?st.players[pr.o]:null;
    let inner=`<div class="bgic">${icon(s.ic)}</div>`;
    if(corner){
      inner+=`<div class="nm">${esc(s.s)}</div><div class="sub">${CORNER_SUB[i]}</div>`;
    } else {
      let band='';
      if(s.t==='prop'){ band=`<div class="band" style="background:${G[s.g].c}">${pr&&pr.h?`<span class="bld">${pr.h===5?HOTEL:HOUSE.repeat(pr.h)}</span>`:''}</div>` }
      inner+=band+`<div class="cbody"><div class="nm">${esc(s.s)}</div><div class="pr">${s.p?s.p+' €':''}</div></div>`;
    }
    if(own) inner+=`<span class="ownflag" style="background:${own.color}" title="${esc(own.name)}"></span>`;
    if(pr&&pr.m) inner+=`<div class="mort"></div>`;
    const ownStyle=own?`box-shadow:inset 0 0 0 3px ${own.color};`:'';
    h+=`<button class="cell ${corner?'corner':side} ${sel===i?'sel':''}" style="grid-row:${r};grid-column:${c};${ownStyle}" data-i="${i}" aria-label="${esc(s.n)}">${inner}</button>`;
  });
  const cur=st.players[st.turn];
  h+=`<div class="center">${SKYLINE}<div class="ticker" id="ticker" aria-live="polite">${tickerHTML()}</div><div class="logo">DEMopólio<small>edição Coimbra</small></div>
    <div class="dice${rolling?' rolling':''}" id="dice">${dieHTML(dispDice[0])}${dieHTML(dispDice[1])}</div>
    ${centerRollBtn(st)}
    ${st.status==='playing'&&cur?`<div class="now">${pawnP(cur)}Vez de ${esc(cur.name)}</div>`:''}
    ${st.card?`<div class="cardnote"><b>${esc(st.card.deck)}</b>${esc(st.card.x)}</div>`:''}
    ${cfg(st).pot&&st.status==='playing'?`<div class="potnote">Prémio do Parque Verde: <b>${fmt(st.pot||0)}</b></div>`:''}
    ${landingHTML(st)}${auctionHTML(st)}${endHTML(st)}</div>
    <div class="pawnlayer" id="pawnlayer"></div>`;
  return h+'</div>';

function centerRollBtn(st){

function tradeSummary(st,t){
  const part=(props,money,cards)=>{
    const bits=[...props.map(i=>esc(SQ[i].s))];
    if(money) bits.push(fmt(money));
    SKEYS.forEach(k=>{ if(cards[k]) bits.push(`${cards[k]}× carta ${esc(SPECIAL[k].n)}`) });
    return bits.length?bits.join(', '):'nada';
  };
  return `<b>${esc(pname(st,t.from))}</b> dá: ${part(t.give,t.gm,t.gc)}<br><b>${esc(pname(st,t.to))}</b> dá: ${part(t.get,t.tm,t.tc)}`;
}

function pickPhoto(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
    const url=URL.createObjectURL(f), img=new Image();
    img.onload=()=>{ const S=96, c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d');
      const m=Math.min(img.width,img.height); x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
      let q=.8, d=c.toDataURL('image/jpeg',q); while(d.length>20000&&q>.3){ q-=.1; d=c.toDataURL('image/jpeg',q) }
      URL.revokeObjectURL(url); ls.set('mv-photo',d); if(code&&state) act('setPhoto',{photo:d}); else renderHome?.(); toast('Foto atualizada.') };
    img.onerror=()=>toast('Não consegui abrir essa imagem.'); img.src=url };
  inp.click();
}
