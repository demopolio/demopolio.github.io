<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mais-Valias Coimbra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: tabuleiro de azulejo à esquerda, painel de jogo à direita; empilha em telemóvel */
:root{
  --bg:#EEF2FA; --surface:#FFFFFF; --tile:#F7F9FD; --ink:#0F1C44; --muted:#5A6688;
  --line:#CBD4EA; --cobalt:#1F47C2; --cobalt-soft:#DCE4FA; --gold:#B57A0E; --danger:#C2362B; --ok:#167A4A;
  --pattern:rgba(31,71,194,.10);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1022; --surface:#121A33; --tile:#18223F; --ink:#E7ECFA; --muted:#9AA6C8;
  --line:#2A3660; --cobalt:#7C9BFF; --cobalt-soft:#1E2A55; --gold:#E7B44A; --danger:#FF7B6E; --ok:#4FD08F;
  --pattern:rgba(124,155,255,.10); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A1022; --surface:#121A33; --tile:#18223F; --ink:#E7ECFA; --muted:#9AA6C8;
  --line:#2A3660; --cobalt:#7C9BFF; --cobalt-soft:#1E2A55; --gold:#E7B44A; --danger:#FF7B6E; --ok:#4FD08F;
  --pattern:rgba(124,155,255,.10); color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:var(--bg)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;color:var(--ink);background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{color:var(--muted);font-size:13px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:14px}
.banner.warn{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}

/* HOME */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:28px}
.hero h1{font-size:clamp(40px,7vw,76px);font-weight:800;line-height:.95}
.hero h1 span{color:var(--cobalt)}
.hero p{max-width:52ch;color:var(--muted);margin:12px 0 0}
.azulejo{aspect-ratio:1;max-width:100%;border-radius:18px;border:1px solid var(--line);
  background:
   radial-gradient(circle at 50% 50%,transparent 18%,var(--pattern) 19% 22%,transparent 23%) 0 0/50% 50%,
   conic-gradient(from 45deg at 50% 50%,var(--pattern) 0 25%,transparent 0 50%,var(--pattern) 0 75%,transparent 0) 0 0/25% 25%,
   var(--surface);
  display:grid;place-items:center}
.azulejo .seal{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,48px);color:var(--cobalt);background:var(--surface);padding:10px 22px;border-radius:999px;border:2px solid var(--cobalt)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:20px}
.roomlist{display:flex;flex-direction:column;gap:8px}
.roomitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--tile)}
.code{font-family:var(--f-mono);font-weight:700;letter-spacing:.08em}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--cobalt-soft);color:var(--cobalt);text-transform:uppercase;letter-spacing:.06em}
.pill.live{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.end{background:var(--tile);color:var(--muted)}

/* GAME */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.topbar h1{font-size:28px;font-weight:800}
.game{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.board{aspect-ratio:1;width:100%;max-width:100%;display:grid;grid-template-columns:1.55fr repeat(9,1fr) 1.55fr;grid-template-rows:1.55fr repeat(9,1fr) 1.55fr;gap:2px;background:var(--line);border:2px solid var(--line);border-radius:14px;overflow:hidden}
.cell{background:var(--tile);position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;border:0;padding:0;color:var(--ink);text-align:center}
.cell:hover{background:var(--cobalt-soft)}
.cell.sel{outline:2px solid var(--cobalt);outline-offset:-2px;z-index:2}
.band{height:22%;flex:none}
.cell .nm{font-size:clamp(6px,.82vw,10px);line-height:1.1;font-weight:600;padding:2px 2px 0;overflow:hidden}
.cell .pr{font-size:clamp(6px,.75vw,9px);font-family:var(--f-mono);color:var(--muted);margin-top:auto;padding-bottom:2px}
.cell.corner{justify-content:center;align-items:center;font-family:var(--f-display);font-weight:800;font-size:clamp(8px,1.1vw,13px);padding:4px;line-height:1.05}
.cell.corner small{display:block;font-family:var(--f-body);font-weight:500;font-size:clamp(6px,.75vw,9px);color:var(--muted);margin-top:2px}
.cell .icon{font-family:var(--f-display);font-weight:800;font-size:clamp(9px,1.3vw,16px);color:var(--cobalt);margin-top:auto}
.cell .own{position:absolute;inset:auto 0 0 0;height:4px}
.cell .mort{position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--danger) 18%,transparent) 5px 7px);pointer-events:none}
.cell .houses{position:absolute;top:2px;left:0;right:0;display:flex;justify-content:center;gap:1px}
.cell .houses i{width:clamp(3px,.6vw,7px);height:clamp(3px,.6vw,7px);background:var(--ok);border:1px solid var(--surface);border-radius:1px}
.cell .houses i.hotel{width:clamp(7px,1.3vw,14px);background:var(--danger)}
.tokens{position:absolute;inset:auto 2px 6px 2px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;pointer-events:none}
.tok{width:clamp(8px,1.4vw,15px);height:clamp(8px,1.4vw,15px);border-radius:50%;border:2px solid var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.35)}
.center{grid-column:2 / span 9;grid-row:2 / span 9;background:
   radial-gradient(circle at 50% 50%,transparent 18%,var(--pattern) 19% 22%,transparent 23%) 0 0/22.2% 22.2%,
   conic-gradient(from 45deg at 50% 50%,var(--pattern) 0 25%,transparent 0 50%,var(--pattern) 0 75%,transparent 0) 0 0/11.1% 11.1%,
   var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:6%;min-width:0;min-height:0}
.center .logo{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,4.4vw,52px);color:var(--cobalt);line-height:1;background:var(--surface);padding:.1em .4em;border-radius:12px}
.dice{display:flex;gap:10px}
.die{width:clamp(34px,5vw,54px);aspect-ratio:1;background:var(--surface);border:2px solid var(--ink);border-radius:22%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14%}
.die i{width:70%;aspect-ratio:1;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.die.roll{animation:shake .45s ease}
@keyframes shake{0%{transform:rotate(0)}25%{transform:rotate(-14deg)}50%{transform:rotate(10deg)}75%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.die.roll{animation:none}}
.cardnote{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;max-width:min(92%,340px);text-align:center;font-size:clamp(11px,1.2vw,14px)}
.cardnote b{display:block;font-family:var(--f-display);color:var(--gold);font-size:.85em;letter-spacing:.08em;text-transform:uppercase}

.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.actions .turn{font-family:var(--f-display);font-size:20px;font-weight:700}
.players{display:flex;flex-direction:column;gap:6px}
.pl{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid transparent}
.pl.cur{border-color:var(--cobalt);background:var(--cobalt-soft)}
.pl.out{opacity:.45;text-decoration:line-through}
.pl .dot{width:14px;height:14px;border-radius:50%}
.pl .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pl .who small{font-weight:500;color:var(--muted)}
.neg{color:var(--danger)}
.online{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--tile);font-size:12.5px;color:var(--ink)}
.chip .sw{width:10px;height:10px;border-radius:2px;flex:none}
.chip.m{opacity:.55;text-decoration:line-through}
.detail table{width:100%;border-collapse:collapse;font-size:13px}
.detail td{padding:4px 0;border-bottom:1px solid var(--line)}
.detail td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.detail .head{border-radius:10px;padding:12px;color:#fff;font-family:var(--f-display);font-weight:700;font-size:18px}
.log{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:13px}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;max-width:90vw}
.modalbg{position:fixed;inset:0;background:rgba(5,10,25,.55);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(560px,100%);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.tcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcols label{display:flex;gap:6px;align-items:center;font-size:13px;padding:3px 0}
.lobbylist{display:flex;flex-direction:column;gap:8px}
@media (max-width:900px){
  .game{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero .azulejo{display:none}
}
@media (max-width:640px){
  .cards{grid-template-columns:minmax(0,1fr)}
  .cell .nm{display:none}
  .cell .pr{display:none}
  .cell.corner small{display:none}
  .tcols{grid-template-columns:1fr}
}
[hidden]{display:none!important}
body{margin:0}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="wrap" id="app">
  <div class="banner">A carregar…</div>
</div>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modalbg" hidden></div>

<script>
/* ===================== DADOS DO TABULEIRO ===================== */
const G = {
  castanho:{c:'#7A4A2A',hc:50,n:'Início'}, celeste:{c:'#5FB4E0',hc:50,n:'Bares'},
  rosa:{c:'#D2468F',hc:100,n:'Noite'}, laranja:{c:'#E57A20',hc:100,n:'Festa'},
  vermelho:{c:'#D0332B',hc:150,n:'Catedrais'}, amarelo:{c:'#E2B91F',hc:150,n:'Repúblicas'},
  verde:{c:'#1E9A5A',hc:200,n:'DEM'}, azul:{c:'#22379A',hc:200,n:'Universidade'}
};
const P=(n,s,g,p,r)=>({t:'prop',n,s,g,p,r});
const SQ = [
 {t:'go',n:'Partida',s:'Partida'},
 P('Arco de Almedina','Almedina','castanho',60,[2,10,30,90,160,250]),
 {t:'chest',n:'Caixa Comum',s:'Caixa'},
 P('Departamento de Bioquímica (BIOQ)','BIOQ','castanho',60,[4,20,60,180,320,450]),
 {t:'tax',n:'Propinas',s:'Propinas',p:200},
 {t:'rail',n:'Estação Coimbra-B',s:'Coimbra-B',p:200},
 P('Moelas','Moelas','celeste',100,[6,30,90,270,400,550]),
 {t:'chance',n:'Sorte',s:'Sorte'},
 P('Pintos','Pintos','celeste',100,[6,30,90,270,400,550]),
 P('Cabido','Cabido','celeste',120,[8,40,100,300,450,600]),
 {t:'jail',n:'Prisão',s:'Prisão'},
 P('24bar','24bar','rosa',140,[10,50,150,450,625,750]),
 {t:'util',n:'Cantinas da Universidade',s:'Cantinas',p:150},
 P('NB','NB','rosa',140,[10,50,150,450,625,750]),
 P('RS','RS','rosa',160,[12,60,180,500,700,900]),
 {t:'rail',n:'Estação Coimbra (Estação Nova)',s:'Estação Nova',p:200},
 P('In Club','In Club','laranja',180,[14,70,200,550,750,950]),
 {t:'chest',n:'Caixa Comum',s:'Caixa'},
 P('Praça da Canção','Pr. Canção','laranja',180,[14,70,200,550,750,950]),
 P('Bar da AAC','Bar da AAC','laranja',200,[16,80,220,600,800,1000]),
 {t:'free',n:'Parque Verde do Mondego',s:'Parque Verde'},
 P('Museu Nacional Machado de Castro','Machado de Castro','vermelho',220,[18,90,250,700,875,1050]),
 {t:'chance',n:'Sorte',s:'Sorte'},
 P('Sé Nova','Sé Nova','vermelho',220,[18,90,250,700,875,1050]),
 P('Sé Velha','Sé Velha','vermelho',240,[20,100,300,750,925,1100]),
 {t:'rail',n:'Elevador do Mercado',s:'Elevador',p:200},
 P('República dos Fantasmas','Fantasmas','amarelo',260,[22,110,330,800,975,1150]),
 P('República Ay-o-Linda','Ay-o-Linda','amarelo',260,[22,110,330,800,975,1150]),
 {t:'util',n:'Águas de Coimbra',s:'Água',p:150},
 P('República Rapo-Taxo','Rapo-Taxo','amarelo',280,[24,120,360,850,1025,1200]),
 {t:'gotojail',n:'Vai para a Prisão',s:'Vai preso'},
 P('Jardins do DEM','Jardins DEM','verde',300,[26,130,390,900,1100,1275]),
 P('Sala Multibanco do DEM','Multibanco DEM','verde',300,[26,130,390,900,1100,1275]),
 P('Biblioteca do DEM','Biblioteca DEM','verde',320,[28,150,450,1000,1200,1400]),
 P('NEEMAAC','NEEMAAC','verde',320,[28,150,450,1000,1200,1400]),
 {t:'rail',n:'Metro Mondego',s:'Metro',p:200},
 {t:'chance',n:'Sorte',s:'Sorte'},
 P('Paço das Escolas e Torre','Torre da UC','azul',350,[35,175,500,1100,1300,1500]),
 {t:'tax',n:'Traje Académico',s:'Traje',p:100},
 P('Biblioteca Joanina','Joanina','azul',400,[50,200,600,1400,1700,2000]),
];
const BUYABLE = t => t==='prop'||t==='rail'||t==='util';
const COLORS = ['#E4572E','#2E86DE','#17A589','#E0B000','#8E44AD','#EC6FA2','#00B8D9','#A0632B'];
const MAXP = 8, START_MONEY = 1500, GO_MONEY = 200, JAIL_FEE = 50;

const CHANCE = [
 {x:'Avança até à Partida e recebe 200 €.',a:'moveTo',v:0},
 {x:'Visita guiada: avança até à Biblioteca Joanina.',a:'moveTo',v:39},
 {x:'Serenata Monumental: avança até à Sé Velha. Se passares pela Partida, recebe 200 €.',a:'moveTo',v:24},
 {x:'Saída à noite: avança até ao RS. Se passares pela Partida, recebe 200 €.',a:'moveTo',v:14},
 {x:'Perdeste o autocarro: avança até ao transporte mais próximo.',a:'rail'},
 {x:'Esqueceste a capa na esplanada: recua três casas.',a:'back',v:3},
 {x:'Exageraste na Queima das Fitas: vai diretamente para a Prisão.',a:'jail'},
 {x:'Multa por estacionar na Rua Larga: paga 15 €.',a:'money',v:-15},
 {x:'Ganhaste o prémio da tuna: recebe 50 €.',a:'money',v:50},
 {x:'Venceste um concurso de ideias da universidade: recebe 150 €.',a:'money',v:150},
 {x:'Obras de manutenção: paga 25 € por casa e 100 € por hotel.',a:'repairs',v:[25,100]},
 {x:'Foste eleito tesoureiro do núcleo: paga 50 € a cada jogador.',a:'payEach',v:50},
 {x:'Cartão "Sai da Prisão". Guarda-o até precisares.',a:'card'},
];
const CHEST = [
 {x:'Avança até à Partida e recebe 200 €.',a:'moveTo',v:0},
 {x:'A mesada chegou mais cedo: recebe 200 €.',a:'money',v:200},
 {x:'Compraste os apontamentos todos na reprografia: paga 50 €.',a:'money',v:-50},
 {x:'Vendeste os livros do ano passado: recebe 50 €.',a:'money',v:50},
 {x:'Reembolso do IRS: recebe 20 €.',a:'money',v:20},
 {x:'Fazes anos! Cada jogador dá-te 10 € para os finos.',a:'collectEach',v:10},
 {x:'Explicações a caloiros: recebe 100 €.',a:'money',v:100},
 {x:'Bilhete geral para a Queima das Fitas: paga 100 €.',a:'money',v:-100},
 {x:'Bolsa de mérito: recebe 100 €.',a:'money',v:100},
 {x:'Obras na república: paga 40 € por casa e 115 € por hotel.',a:'repairs',v:[40,115]},
 {x:'Foste apanhado a copiar no exame: vai diretamente para a Prisão.',a:'jail'},
 {x:'Cartão "Sai da Prisão". Guarda-o até precisares.',a:'card'},
];

/* ===================== REGRAS ===================== */
const groupOf = g => SQ.map((s,i)=>s.g===g?i:-1).filter(i=>i>=0);
const fmt = n => (n<0?'−':'')+Math.abs(n).toLocaleString('pt-PT')+' €';
const roll6 = () => 1+Math.floor(Math.random()*6);
function log(st,msg){ st.log=[msg,...(st.log||[])].slice(0,50) }
function pname(st,i){ return st.players[i]?.name||'?' }
function ownsGroup(st,pi,g){ return groupOf(g).every(i=>st.props[i]&&st.props[i].o===pi) }
function countType(st,pi,t){ return SQ.reduce((n,s,i)=>n+(s.t===t&&st.props[i]&&st.props[i].o===pi?1:0),0) }
function rentFor(st,i,dice){
  const s=SQ[i], pr=st.props[i]; if(!pr||pr.m) return 0;
  if(s.t==='prop'){ return pr.h>0 ? s.r[pr.h] : s.r[0]*(ownsGroup(st,pr.o,s.g)?2:1) }
  if(s.t==='rail'){ return 25*Math.pow(2,countType(st,pr.o,'rail')-1) }
  if(s.t==='util'){ return dice*(countType(st,pr.o,'util')===2?10:4) }
  return 0;
}
function pay(st,from,to,amt){
  if(from!==null) st.players[from].money-=amt;
  if(to!==null) st.players[to].money+=amt;
}
function moveBy(st,pi,steps){
  const p=st.players[pi], np=((p.pos+steps)%40+40)%40;
  if(steps>0 && np<p.pos){ p.money+=GO_MONEY; log(st,`${p.name} passou pela Partida e recebeu ${fmt(GO_MONEY)}.`) }
  p.pos=np;
}
function moveTo(st,pi,target){
  const p=st.players[pi];
  if(target<p.pos || target===0){ p.money+=GO_MONEY; log(st,`${p.name} passou pela Partida e recebeu ${fmt(GO_MONEY)}.`) }
  p.pos=target;
}
function sendJail(st,pi){
  const p=st.players[pi]; p.pos=10; p.inJail=true; p.jailTurns=0; st.again=false;
  log(st,`${p.name} foi para a Prisão.`);
}
function land(st,pi,dice,depth=0){
  const p=st.players[pi], i=p.pos, s=SQ[i];
  if(BUYABLE(s.t)){
    const pr=st.props[i];
    if(!pr){ st.phase='buy'; st.pendingBuy=i; return }
    if(pr.o===pi) return;
    if(pr.m){ log(st,`${s.n} está hipotecada: ${p.name} não paga renda.`); return }
    const r=rentFor(st,i,dice); pay(st,pi,pr.o,r);
    log(st,`${p.name} pagou ${fmt(r)} de renda a ${pname(st,pr.o)} (${s.s}).`);
  } else if(s.t==='tax'){ pay(st,pi,null,s.p); log(st,`${p.name} pagou ${fmt(s.p)} de ${s.n}.`) }
  else if(s.t==='gotojail'){ sendJail(st,pi) }
  else if((s.t==='chance'||s.t==='chest') && depth<3){
    const deck=s.t==='chance'?CHANCE:CHEST, c=deck[Math.floor(Math.random()*deck.length)];
    st.card={deck:s.n,x:c.x,by:pi}; log(st,`${p.name} tirou ${s.n}: ${c.x}`);
    applyCard(st,pi,c,dice,depth);
  }
}
function applyCard(st,pi,c,dice,depth){
  const p=st.players[pi], others=st.players.map((q,j)=>j).filter(j=>j!==pi&&!st.players[j].out);
  switch(c.a){
    case 'money': p.money+=c.v; break;
    case 'moveTo': moveTo(st,pi,c.v); land(st,pi,dice,depth+1); break;
    case 'back': moveBy(st,pi,-c.v); land(st,pi,dice,depth+1); break;
    case 'rail': { let t=p.pos; do{t=(t+1)%40}while(SQ[t].t!=='rail'); moveTo(st,pi,t); land(st,pi,dice,depth+1); break }
    case 'jail': sendJail(st,pi); break;
    case 'card': p.cards=(p.cards||0)+1; break;
    case 'repairs': { let tot=0; Object.entries(st.props).forEach(([i,pr])=>{ if(pr.o===pi&&pr.h) tot+= pr.h===5?c.v[1]:pr.h*c.v[0] }); pay(st,pi,null,tot); log(st,`${p.name} pagou ${fmt(tot)} em obras.`); break }
    case 'payEach': others.forEach(j=>pay(st,pi,j,c.v)); break;
    case 'collectEach': others.forEach(j=>pay(st,j,pi,c.v)); break;
  }
}
function nextPhase(st,pi){ st.phase = (st.again && !st.players[pi].inJail) ? 'roll' : 'end' }
function alive(st){ return st.players.map((p,i)=>i).filter(i=>!st.players[i].out) }
function advanceTurn(st){
  const n=st.players.length; let t=st.turn;
  for(let k=0;k<n;k++){ t=(t+1)%n; if(!st.players[t].out) break }
  st.turn=t; st.phase='roll'; st.dbl=0; st.again=false; st.pendingBuy=null;
  log(st,`Vez de ${pname(st,t)}.`);
}
function bankrupt(st,pi,why){
  const p=st.players[pi]; p.out=true; p.money=0; p.cards=0;
  Object.keys(st.props).forEach(k=>{ if(st.props[k].o===pi) delete st.props[k] });
  log(st,why||`${p.name} declarou falência. As propriedades voltaram ao banco.`);
  if(st.trade && (st.trade.from===pi||st.trade.to===pi)) st.trade=null;
  const a=alive(st);
  if(a.length<=1){ st.status='ended'; st.winner=a[0]??null; st.phase='over'; log(st,`${pname(st,a[0])} ganhou o jogo!`); return }
  if(st.turn===pi) advanceTurn(st);
}
function tradeable(st,i){ const s=SQ[i]; if(s.t!=='prop') return true; return groupOf(s.g).every(j=>!st.props[j]||!st.props[j].h) }

/* ===================== AÇÕES (correm dentro de mutate) ===================== */
const A = {
  join(st,{name}){
    if(st.players.some(p=>p.id===me.id)) return true;
    if(st.status!=='lobby') return 'O jogo desta sala já começou.';
    if(st.players.length>=MAXP) return `A sala está cheia (máx. ${MAXP}).`;
    const used=st.players.map(p=>p.color);
    st.players.push({id:me.id,name:name.slice(0,18),color:COLORS.find(c=>!used.includes(c))});
    log(st,`${name} entrou na sala.`);
  },
  leave(st){
    if(st.status!=='lobby') return 'Não podes sair a meio do jogo; declara falência.';
    const i=st.players.findIndex(p=>p.id===me.id); if(i<0) return false;
    log(st,`${st.players[i].name} saiu da sala.`); st.players.splice(i,1);
    if(st.host===me.id && st.players[0]) st.host=st.players[0].id;
  },
  kick(st,{idx}){
    if(st.host!==me.id) return 'Só o anfitrião pode retirar jogadores.';
    if(st.status==='lobby'){ log(st,`${st.players[idx].name} foi retirado.`); st.players.splice(idx,1); return }
    if(st.status==='playing') bankrupt(st,idx,`${st.players[idx].name} foi retirado pelo anfitrião.`);
  },
  start(st){
    if(st.host!==me.id) return 'Só o anfitrião pode começar.';
    if(st.players.length<2) return 'São precisos pelo menos 2 jogadores.';
    st.players.sort(()=>Math.random()-.5);
    st.players.forEach(p=>Object.assign(p,{pos:0,money:START_MONEY,inJail:false,jailTurns:0,cards:0,out:false}));
    Object.assign(st,{status:'playing',turn:0,phase:'roll',dice:[1,1],dbl:0,again:false,props:{},card:null,trade:null,pendingBuy:null,winner:null,startedAt:Date.now()});
    log(st,`O jogo começou! ${st.players[0].name} joga primeiro.`);
  },
  roll(st){
    const pi=myTurn(st); if(pi<0||st.phase!=='roll') return false;
    const p=st.players[pi]; if(p.money<0) return 'Tens saldo negativo: vende ou hipoteca antes de lançar.';
    const d=[roll6(),roll6()], sum=d[0]+d[1], doubles=d[0]===d[1];
    st.dice=d; st.rollId=(st.rollId||0)+1; st.card=null;
    log(st,`${p.name} lançou ${d[0]} + ${d[1]}${doubles?' (duplos)':''}.`);
    if(p.inJail){
      if(doubles){ p.inJail=false; p.jailTurns=0; log(st,`${p.name} saiu da Prisão com duplos.`); st.again=false; moveBy(st,pi,sum); land(st,pi,sum) }
      else { p.jailTurns++;
        if(p.jailTurns>=3){ pay(st,pi,null,JAIL_FEE); p.inJail=false; p.jailTurns=0; log(st,`${p.name} pagou ${fmt(JAIL_FEE)} e saiu da Prisão.`); st.again=false; moveBy(st,pi,sum); land(st,pi,sum) }
        else { st.phase='end'; return } }
    } else {
      if(doubles){ st.dbl=(st.dbl||0)+1; if(st.dbl>=3){ log(st,`Três duplos seguidos!`); sendJail(st,pi); st.phase='end'; return } }
      st.again=doubles; moveBy(st,pi,sum); land(st,pi,sum);
    }
    if(st.phase!=='buy') nextPhase(st,pi);
  },
  payJail(st){
    const pi=myTurn(st), p=st.players[pi]; if(pi<0||!p.inJail||st.phase!=='roll') return false;
    if(p.money<JAIL_FEE) return 'Não tens dinheiro para a fiança.';
    pay(st,pi,null,JAIL_FEE); p.inJail=false; p.jailTurns=0; log(st,`${p.name} pagou a fiança de ${fmt(JAIL_FEE)}.`);
  },
  useCard(st){
    const pi=myTurn(st), p=st.players[pi]; if(pi<0||!p.inJail||!p.cards) return false;
    p.cards--; p.inJail=false; p.jailTurns=0; log(st,`${p.name} usou o cartão "Sai da Prisão".`);
  },
  buy(st){
    const pi=myTurn(st); if(pi<0||st.phase!=='buy') return false;
    const i=st.pendingBuy, s=SQ[i], p=st.players[pi];
    if(p.money<s.p) return 'Não tens dinheiro suficiente.';
    pay(st,pi,null,s.p); st.props[i]={o:pi,h:0,m:false}; st.pendingBuy=null;
    log(st,`${p.name} comprou ${s.n} por ${fmt(s.p)}.`); nextPhase(st,pi);
  },
  pass(st){
    const pi=myTurn(st); if(pi<0||st.phase!=='buy') return false;
    log(st,`${st.players[pi].name} não comprou ${SQ[st.pendingBuy].n}.`); st.pendingBuy=null; nextPhase(st,pi);
  },
  end(st){
    const pi=myTurn(st); if(pi<0||st.phase!=='end') return false;
    if(st.players[pi].money<0) return 'Resolve o saldo negativo antes de passar a vez.';
    advanceTurn(st);
  },
  build(st,{i}){
    const pi=myTurn(st); if(pi<0) return 'Só podes construir na tua vez.';
    const s=SQ[i], pr=st.props[i], p=st.players[pi], hc=G[s.g].hc, grp=groupOf(s.g);
    if(!pr||pr.o!==pi||s.t!=='prop') return false;
    if(!ownsGroup(st,pi,s.g)) return 'Precisas de ter todas as propriedades desta cor.';
    if(grp.some(j=>st.props[j].m)) return 'Há propriedades hipotecadas neste grupo.';
    if(pr.h>=5) return 'Já tem hotel.';
    if(pr.h>Math.min(...grp.map(j=>st.props[j].h))) return 'Constrói de forma equilibrada no grupo.';
    if(p.money<hc) return 'Não tens dinheiro suficiente.';
    pay(st,pi,null,hc); pr.h++; log(st,`${p.name} construiu ${pr.h===5?'um hotel':'uma casa'} em ${s.s} (${fmt(hc)}).`);
  },
  sell(st,{i}){
    const pi=myTurn(st); if(pi<0) return 'Só podes vender na tua vez.';
    const s=SQ[i], pr=st.props[i], grp=groupOf(s.g);
    if(!pr||pr.o!==pi||!pr.h) return false;
    if(pr.h<Math.max(...grp.map(j=>st.props[j].h))) return 'Vende de forma equilibrada no grupo.';
    const v=G[s.g].hc/2; pr.h--; pay(st,null,pi,v); log(st,`${st.players[pi].name} vendeu uma construção em ${s.s} (+${fmt(v)}).`);
  },
  mortgage(st,{i}){
    const pi=myTurn(st); if(pi<0) return 'Só podes hipotecar na tua vez.';
    const s=SQ[i], pr=st.props[i]; if(!pr||pr.o!==pi||pr.m) return false;
    if(s.t==='prop' && groupOf(s.g).some(j=>st.props[j]&&st.props[j].h)) return 'Vende primeiro as construções deste grupo.';
    pr.m=true; pay(st,null,pi,s.p/2); log(st,`${st.players[pi].name} hipotecou ${s.s} (+${fmt(s.p/2)}).`);
  },
  unmortgage(st,{i}){
    const pi=myTurn(st); if(pi<0) return 'Só podes pagar a hipoteca na tua vez.';
    const s=SQ[i], pr=st.props[i]; if(!pr||pr.o!==pi||!pr.m) return false;
    const c=Math.ceil(s.p*0.55); if(st.players[pi].money<c) return 'Não tens dinheiro suficiente.';
    pr.m=false; pay(st,pi,null,c); log(st,`${st.players[pi].name} recuperou ${s.s} (${fmt(c)}).`);
  },
  bankrupt(st){
    const pi=st.players.findIndex(p=>p.id===me.id); if(pi<0||st.status!=='playing') return false;
    bankrupt(st,pi);
  },
  propose(st,{to,give,get,gm,tm}){
    const pi=st.players.findIndex(p=>p.id===me.id); if(pi<0||st.status!=='playing') return false;
    if(st.trade) return 'Já há uma proposta em curso.';
    if(!give.length&&!get.length&&!gm&&!tm) return 'A proposta está vazia.';
    st.trade={from:pi,to,give,get,gm,tm}; log(st,`${pname(st,pi)} fez uma proposta a ${pname(st,to)}.`);
  },
  accept(st){
    const t=st.trade, pi=st.players.findIndex(p=>p.id===me.id); if(!t||t.to!==pi) return false;
    const f=st.players[t.from], o=st.players[t.to];
    const ok = t.give.every(i=>st.props[i]&&st.props[i].o===t.from&&tradeable(st,i)) && t.get.every(i=>st.props[i]&&st.props[i].o===t.to&&tradeable(st,i));
    if(!ok){ st.trade=null; return 'A proposta já não é válida (as propriedades mudaram).' }
    if(f.money<t.gm||o.money<t.tm){ st.trade=null; return 'Um dos jogadores já não tem esse dinheiro.' }
    t.give.forEach(i=>st.props[i].o=t.to); t.get.forEach(i=>st.props[i].o=t.from);
    f.money+=t.tm-t.gm; o.money+=t.gm-t.tm; st.trade=null;
    log(st,`${o.name} aceitou a troca com ${f.name}.`);
  },
  reject(st){
    const t=st.trade, pi=st.players.findIndex(p=>p.id===me.id); if(!t||(t.to!==pi&&t.from!==pi)) return false;
    log(st,t.from===pi?`${pname(st,pi)} cancelou a proposta.`:`${pname(st,pi)} recusou a proposta.`); st.trade=null;
  },
};
function myTurn(st){ const i=st.turn; return st.status==='playing'&&st.players[i]&&st.players[i].id===me.id ? i : -1 }

async function mutate(fn,arg){
  if(!code||!db) return;
  const ref=db.doc('rooms/'+code); let msg=null, out=null;
  try{
    await db.runTransaction(async tx=>{
      msg=null; out=null;
      const snap=await tx.get(ref);
      if(!snap.exists){ msg='Esta sala já não existe.'; return }
      const st=structuredClone(snap.data());
      const res=fn(st,arg||{});
      if(typeof res==='string'){ msg=res; return }
      if(res===false||res===true) return;
      st.rev=(st.rev||0)+1; st.updatedAt=Date.now();
      tx.set(ref,st); out=st;
    });
    if(msg) toast(msg);
    if(out){ state=out; render() }
  }catch(e){
    toast(e&&e.code==='permission-denied'?'Sem permissão para guardar. Confirma as regras do Firestore.':'Não consegui guardar a jogada. Tenta de novo.');
  }
}

      <div class="panel detail" id="detail" ${sel===null?'hidden':''}></div>
      <div class="panel"><div class="row" style="justify-content:space-between"><h2>Jogadores</h2>${meIdx>=0&&st.status==='playing'&&!st.players[meIdx].out?`<button class="btn small" id="tradebtn">Propor troca</button>`:''}</div><div class="players" id="players"></div></div>
      ${meIdx>=0?`<div class="panel"><h2>As tuas propriedades</h2><div class="chips" id="myprops"></div></div>`:''}
      <div class="panel"><h2>Registo</h2><div class="log">${(st.log||[]).map(l=>`<div>${esc(l)}</div>`).join('')}</div></div>
      ${isHost&&st.status==='ended'?`<button class="btn danger" id="delroom">Apagar sala</button>`:''}
    </div>
  </div>`;
  renderActions(meIdx); renderPlayers(); renderDetail(meIdx); renderMyProps(meIdx);
  $('#copycode').onclick=()=>copy(code);
  app.querySelectorAll('.cell[data-i]').forEach(c=>c.onclick=()=>{ sel=+c.dataset.i===sel?null:+c.dataset.i; render() });
  $('#tradebtn')&&($('#tradebtn').onclick=()=>openTrade(meIdx));
  $('#delroom')&&($('#delroom').onclick=delRoom);
  if(st.rollId&&st.rollId!==lastRollShown){ lastRollShown=st.rollId; app.querySelectorAll('.die').forEach(d=>d.classList.add('roll')) }
}
function copy(t){ navigator.clipboard.writeText(t).then(()=>toast('Copiado!')).catch(()=>toast(t)) }
async function delRoom(){ try{ await db.doc('rooms/'+code).delete(); location.hash='' }catch(e){ toast('Não consegui apagar a sala.') } }

function renderLobby(meIdx){
  const st=state, isHost=st.host===me.id, nick=ls.get('mv-nick')||'';
  app.innerHTML=`
  <div class="topbar">
    <div class="row"><button class="btn small" onclick="location.hash=''">← Salas</button><h1>Sala de espera</h1></div>
  </div>
  <div class="cards">
    <div class="panel">
      <div class="eyebrow">Código para partilhar</div>
      <div class="row"><span class="code" style="font-size:40px">${esc(code)}</span><button class="btn small" id="copycode">Copiar</button><button class="btn small" id="copylink">Copiar link da sala</button></div>
      <p class="note" style="margin:0">Manda o link da sala aos teus amigos: abrem, escrevem o nome e entram logo.</p>
      <div class="eyebrow">Jogadores (${st.players.length}/${MAXP})</div>
      <div class="lobbylist">${st.players.map((p,i)=>`<div class="roomitem"><div class="row"><span class="tok" style="background:${p.color};display:inline-block"></span><b>${esc(p.name)}</b>${p.id===st.host?'<span class="pill">anfitrião</span>':''}${p.id===me.id?'<span class="note">(tu)</span>':''}${online.has(p.id)?'<span class="online" title="online"></span>':''}</div>${isHost&&p.id!==me.id?`<button class="btn small danger" data-kick="${i}">Retirar</button>`:''}</div>`).join('')}</div>
    </div>
    <div class="panel">
      ${meIdx<0?`
        <h2>Entrar nesta sala</h2>
        <input id="nick" maxlength="18" placeholder="O teu nome" value="${esc(nick)}">
        <button class="btn primary" id="joinroom" ${me.canWrite===false?'disabled':''}>Entrar</button>
        ${me.canWrite===false?'<p class="note">Tens acesso só de leitura. Pede ao dono para te convidar como Editor.</p>':''}`
      : isHost ? `
        <h2>Pronto?</h2>
        <p class="note" style="margin:0">Cada jogador começa com 1500 €. A ordem de jogo é sorteada.</p>
        <button class="btn primary" id="startbtn" ${st.players.length<2?'disabled':''}>Começar jogo</button>
        ${st.players.length<2?'<p class="note">À espera de pelo menos mais um jogador.</p>':''}
        <button class="btn danger" id="delroom">Apagar sala</button>`
      : `<h2>À espera do anfitrião</h2><p class="note" style="margin:0">O jogo começa quando ${esc(st.players.find(p=>p.id===st.host)?.name||'o anfitrião')} carregar em Começar.</p><button class="btn" id="leavebtn">Sair da sala</button>`}
      <details><summary class="note">Regras rápidas</summary><ul class="note">
        <li>Passar pela Partida dá 200 €.</li><li>Cai numa propriedade livre: compras ou deixas.</li>
        <li>Com a cor completa a renda duplica e podes construir (até 4 casas e um hotel), de forma equilibrada.</li>
        <li>Estações: 25/50/100/200 €. Companhias: 4× ou 10× os dados.</li>
        <li>Três duplos seguidos levam-te à Prisão. Para sair: duplos, 50 € ou cartão.</li>
        <li>Hipoteca dá metade do preço; recuperar custa 55%.</li><li>Ganha o último que não falir.</li></ul></details>
    </div>
  </div>`;
  $('#copycode').onclick=()=>copy(code);
  $('#copylink').onclick=()=>copy(location.href);
  app.querySelectorAll('[data-kick]').forEach(b=>b.onclick=()=>act('kick',{idx:+b.dataset.kick}));
  $('#joinroom')&&($('#joinroom').onclick=()=>{ const n=$('#nick').value.trim(); if(!n) return toast('Escreve o teu nome.'); ls.set('mv-nick',n); act('join',{name:n}) });
  $('#startbtn')&&($('#startbtn').onclick=()=>act('start'));
  $('#leavebtn')&&($('#leavebtn').onclick=async()=>{ await act('leave'); location.hash='' });
  $('#delroom')&&($('#delroom').onclick=delRoom);
}

function cellPos(i){
  if(i<=10) return [11,11-i];
  if(i<=20) return [11-(i-10),1];
  if(i<=30) return [1,1+(i-20)];
  return [1+(i-30),11];
}
const ICON={chest:'✉',chance:'?',tax:'€',rail:'⇄',util:'⚡'};
function boardHTML(st){
  let h='<div class="board">';
  SQ.forEach((s,i)=>{
    const [r,c]=cellPos(i), pr=st.props?.[i], toks=st.players.filter(p=>!p.out&&p.pos===i);
    const corner=i%10===0, own=pr?st.players[pr.o]?.color:null;
    let inner='';
    if(corner){
      const sub={0:`recebe ${GO_MONEY} €`,10:'só de visita',20:'descanso',30:'diretamente'}[i];
      inner=`${esc(s.s)}<small>${sub}</small>`;
    } else {
      inner = (s.t==='prop'?`<div class="band" style="background:${G[s.g].c}"></div>`:'')+
        `<div class="nm">${esc(s.s)}</div>`+(s.t!=='prop'?`<div class="icon">${s.t==='util'&&s.s==='Água'?'≈':s.t==='util'?'🍽':ICON[s.t]||''}</div>`:'')+
        (s.p?`<div class="pr">${s.p}€</div>`:'');
      if(pr&&pr.h) inner+=`<div class="houses">${pr.h===5?'<i class="hotel"></i>':'<i></i>'.repeat(pr.h)}</div>`;
    }
    if(own) inner+=`<div class="own" style="background:${own}"></div>`;
    if(pr&&pr.m) inner+=`<div class="mort"></div>`;
    if(toks.length) inner+=`<div class="tokens">${toks.map(p=>`<span class="tok" style="background:${p.color}" title="${esc(p.name)}"></span>`).join('')}</div>`;
    h+=`<button class="cell ${corner?'corner':''} ${sel===i?'sel':''}" style="grid-row:${r};grid-column:${c}" data-i="${i}" aria-label="${esc(s.n)}">${inner}</button>`;
  });
  const d=st.dice||[1,1];
  h+=`<div class="center"><div class="logo">Mais-Valias</div><div class="eyebrow">edição Coimbra</div><div class="dice">${dieHTML(d[0])}${dieHTML(d[1])}</div>
    ${st.card?`<div class="cardnote"><b>${esc(st.card.deck)}</b>${esc(st.card.x)}</div>`:''}
    ${st.status==='ended'?`<div class="cardnote"><b>Fim de jogo</b>${esc(pname(st,st.winner))} ganhou!</div>`:''}</div>`;
  return h+'</div>';
}
function dieHTML(n){
  const on={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n]||[];
  return `<div class="die" aria-label="${n}">${[...Array(9)].map((_,k)=>`<i class="${on.includes(k)?'on':''}"></i>`).join('')}</div>`;
}
function renderActions(meIdx){
  const st=state, el=$('#actions'), cur=st.players[st.turn], mine=meIdx>=0&&st.turn===meIdx;
  let h='';
  if(st.status==='ended'){ el.innerHTML=`<div class="turn">${esc(pname(st,st.winner))} ganhou!</div><p class="note" style="margin:0">Volta às salas para começar outro jogo.</p>`; return }
  const t=st.trade;
  if(t&&(t.to===meIdx||t.from===meIdx)){
    const list=a=>a.length?a.map(i=>esc(SQ[i].s)).join(', '):'nada';
    h+=`<div class="banner"><div class="eyebrow">Proposta de troca</div>
      <p style="margin:6px 0"><b>${esc(pname(st,t.from))}</b> dá: ${list(t.give)}${t.gm?` + ${fmt(t.gm)}`:''}<br><b>${esc(pname(st,t.to))}</b> dá: ${list(t.get)}${t.tm?` + ${fmt(t.tm)}`:''}</p>
      <div class="row">${t.to===meIdx?`<button class="btn primary small" data-a="accept">Aceitar</button><button class="btn small" data-a="reject">Recusar</button>`:`<span class="note">À espera de resposta.</span><button class="btn small" data-a="reject">Cancelar</button>`}</div></div>`;
  }
  h+=`<div class="row" style="justify-content:space-between"><div class="turn"><span class="tok" style="background:${cur.color};display:inline-block;vertical-align:middle"></span> ${mine?'É a tua vez':'Vez de '+esc(cur.name)}</div></div>`;
  if(!mine){
    h+=`<p class="note" style="margin:0">${{roll:'A lançar os dados…',buy:`A decidir se compra ${esc(SQ[st.pendingBuy]?.n||'')}.`,end:'A gerir propriedades antes de passar a vez.'}[st.phase]||''}</p>`;
    if(meIdx<0) h+=`<p class="note" style="margin:0">Estás a assistir.</p>`;
  } else {
    const p=st.players[meIdx];
    if(p.money<0) h+=`<div class="banner warn">Estás com ${fmt(p.money)}. Vende construções ou hipoteca propriedades (toca nelas no tabuleiro) até ficares positivo, ou declara falência.</div>`;
    if(st.phase==='roll'){
      if(p.inJail){
        h+=`<p class="note" style="margin:0">Estás na Prisão (tentativa ${p.jailTurns+1} de 3).</p><div class="row">
          <button class="btn primary" data-a="roll" ${p.money<0?'disabled':''}>Tentar duplos</button>
          <button class="btn" data-a="payJail" ${p.money<JAIL_FEE?'disabled':''}>Pagar ${fmt(JAIL_FEE)}</button>
          ${p.cards?`<button class="btn" data-a="useCard">Usar cartão</button>`:''}</div>`;
      } else h+=`<button class="btn primary" data-a="roll" ${p.money<0?'disabled':''}>${st.dbl?'Duplos! Lançar outra vez':'Lançar dados'}</button>`;
    } else if(st.phase==='buy'){
      const s=SQ[st.pendingBuy];
      h+=`<p style="margin:0">Caíste em <b>${esc(s.n)}</b>, que está à venda por <span class="money">${fmt(s.p)}</span>.</p>
        <div class="row"><button class="btn primary" data-a="buy" ${p.money<s.p?'disabled':''}>Comprar</button><button class="btn" data-a="pass">Não comprar</button></div>
        ${p.money<s.p?'<p class="note" style="margin:0">Não tens dinheiro. Podes hipotecar algo primeiro.</p>':''}`;
      if(sel!==st.pendingBuy){ sel=st.pendingBuy; setTimeout(()=>renderDetail(meIdx)) }
    } else if(st.phase==='end'){
      h+=`<div class="row"><button class="btn primary" data-a="end" ${p.money<0?'disabled':''}>Terminar vez</button></div>`;
    }
    h+=`<p class="note" style="margin:0">Toca numa propriedade tua para construir, vender ou hipotecar.</p>`;
  }
  if(meIdx>=0&&!st.players[meIdx].out&&st.players[meIdx].money<0) h+=`<button class="btn danger small" data-a="bankrupt" id="bkbtn">Declarar falência</button>`;
  if(st.host===me.id) h+=`<details><summary class="note">Anfitrião</summary><p class="note">Se alguém abandonar o jogo, podes retirá-lo (as propriedades voltam ao banco).</p><div class="row">${st.players.map((p,i)=>!p.out&&p.id!==me.id?`<button class="btn small danger" data-kickg="${i}">Retirar ${esc(p.name)}</button>`:'').join('')}</div></details>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    if(b.dataset.a==='bankrupt'){ if(b.dataset.sure){ act('bankrupt') } else { b.dataset.sure=1; b.textContent='Confirmar falência?' } return }
    act(b.dataset.a);
  });
  el.querySelectorAll('[data-kickg]').forEach(b=>b.onclick=()=>{ if(b.dataset.sure) act('kick',{idx:+b.dataset.kickg}); else { b.dataset.sure=1; b.textContent='Confirmar?' } });
}
function worth(st,i){ let w=st.players[i].money; Object.entries(st.props||{}).forEach(([k,pr])=>{ if(pr.o===i){ const s=SQ[k]; w+=pr.m?s.p/2:s.p+(pr.h?pr.h*G[s.g].hc:0) } }); return w }
function renderPlayers(){
  const el=$('#players'); if(!el||!state) return; const st=state;
  el.innerHTML=st.players.map((p,i)=>`<div class="pl ${i===st.turn&&st.status==='playing'?'cur':''} ${p.out?'out':''}">
    <span class="dot" style="background:${p.color}"></span>
    <div class="who">${esc(p.name)}${p.id===me.id?' <small>(tu)</small>':''}${online.has(p.id)?'<span class="online" title="online"></span>':''}<br><small>${p.inJail?'na Prisão · ':''}${esc(SQ[p.pos]?.s||'')}${p.cards?' · cartão':''}</small></div>
    <div style="text-align:right"><div class="money ${p.money<0?'neg':''}">${fmt(p.money)}</div><small class="note">património ${fmt(worth(st,i))}</small></div></div>`).join('');
}
function renderMyProps(meIdx){
  const el=$('#myprops'); if(!el) return;
  const owned=Object.keys(state.props||{}).map(Number).filter(i=>state.props[i].o===meIdx).sort((a,b)=>a-b);
  el.innerHTML=owned.length?owned.map(i=>{const s=SQ[i],pr=state.props[i];return `<button class="chip ${pr.m?'m':''}" data-sel="${i}"><span class="sw" style="background:${s.t==='prop'?G[s.g].c:'var(--muted)'}"></span>${esc(s.s)}${pr.h?` · ${pr.h===5?'hotel':pr.h+'🏠'}`:''}</button>`}).join(''):'<span class="note">Ainda não tens propriedades.</span>';
  el.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{ sel=+b.dataset.sel; render(); $('#detail')?.scrollIntoView({behavior:'smooth',block:'nearest'}) });
}
function renderDetail(meIdx){
  const el=$('#detail'); if(!el) return; if(sel===null){ el.hidden=true; return } el.hidden=false;
  const st=state, s=SQ[sel], pr=st.props?.[sel];
  const col=s.t==='prop'?G[s.g].c:'#33427A';
  let h=`<div class="head" style="background:${col}">${esc(s.n)}</div>`;
  if(s.t==='prop'){
    h+=`<table><tr><td>Renda</td><td>${fmt(s.r[0])}</td></tr><tr><td>Com a cor completa</td><td>${fmt(s.r[0]*2)}</td></tr>
      ${[1,2,3,4].map(k=>`<tr><td>Com ${k} casa${k>1?'s':''}</td><td>${fmt(s.r[k])}</td></tr>`).join('')}<tr><td>Com hotel</td><td>${fmt(s.r[5])}</td></tr>
      <tr><td>Preço · construção</td><td>${fmt(s.p)} · ${fmt(G[s.g].hc)}</td></tr><tr><td>Hipoteca</td><td>${fmt(s.p/2)}</td></tr></table>`;
  } else if(s.t==='rail'){ h+=`<table><tr><td>1 estação</td><td>25 €</td></tr><tr><td>2 estações</td><td>50 €</td></tr><tr><td>3 estações</td><td>100 €</td></tr><tr><td>4 estações</td><td>200 €</td></tr><tr><td>Preço</td><td>${fmt(s.p)}</td></tr></table>` }
  else if(s.t==='util'){ h+=`<p class="note" style="margin:0">Renda: 4× o valor dos dados com uma companhia, 10× com as duas. Preço ${fmt(s.p)}.</p>` }
  else if(s.t==='tax'){ h+=`<p style="margin:0">Paga ${fmt(s.p)} ao banco.</p>` }
  else { h+=`<p class="note" style="margin:0">${{go:'Recebe 200 € sempre que passares aqui.',jail:'Se estás só de visita, não acontece nada.',free:'Descansa. Não acontece nada.',gotojail:'Vais direto para a Prisão.',chance:'Tira uma carta de Sorte.',chest:'Tira uma carta da Caixa Comum.'}[s.t]}</p>` }
  if(pr){
    h+=`<p style="margin:0">Dono: <b>${esc(pname(st,pr.o))}</b>${pr.h?` · ${pr.h===5?'hotel':pr.h+' casa(s)'}`:''}${pr.m?' · <span class="neg">hipotecada</span>':''}</p>`;
    if(pr.o===meIdx && st.turn===meIdx && st.status==='playing'){
      const can=s.t==='prop';
      h+=`<div class="row">${can?`<button class="btn small" data-p="build">Construir (${fmt(G[s.g].hc)})</button>${pr.h?`<button class="btn small" data-p="sell">Vender construção</button>`:''}`:''}
        ${pr.m?`<button class="btn small" data-p="unmortgage">Pagar hipoteca (${fmt(Math.ceil(s.p*.55))})</button>`:`<button class="btn small" data-p="mortgage">Hipotecar (+${fmt(s.p/2)})</button>`}</div>`;
    }
  } else if(BUYABLE(s.t)) h+=`<p class="note" style="margin:0">À venda.</p>`;
  h+=`<button class="btn small" id="closedet">Fechar</button>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>act(b.dataset.p,{i:sel}));
  $('#closedet').onclick=()=>{ sel=null; render() };
}

/* ---------- TROCAS ---------- */
function openTrade(meIdx){
  const st=state, others=st.players.map((p,i)=>i).filter(i=>i!==meIdx&&!st.players[i].out);
  if(!others.length) return;
  if(st.trade) return toast('Já há uma proposta em curso.');
  const m=$('#modal');
  const propsOf=pi=>Object.keys(st.props).map(Number).filter(i=>st.props[i].o===pi&&tradeable(st,i)).sort((a,b)=>a-b);
  const box=(pi,name)=>propsOf(pi).map(i=>`<label><input type="checkbox" name="${name}" value="${i}"><span class="chip" style="padding:2px 6px"><span class="sw" style="background:${SQ[i].t==='prop'?G[SQ[i].g].c:'var(--muted)'}"></span>${esc(SQ[i].s)}</span></label>`).join('')||'<span class="note">Nada para trocar.</span>';
  const draw=to=>{
    m.innerHTML=`<div class="modal" role="dialog" aria-label="Propor troca"><h2>Propor troca</h2>
      <div class="row"><label class="eyebrow" for="tto">Com</label><select id="tto">${others.map(i=>`<option value="${i}" ${i===to?'selected':''}>${esc(st.players[i].name)}</option>`).join('')}</select></div>
      <div class="tcols"><div><div class="eyebrow">Tu dás</div>${box(meIdx,'give')}<label for="tgm" class="eyebrow" style="margin-top:8px">Dinheiro</label><input id="tgm" type="number" min="0" step="10" value="0"></div>
      <div><div class="eyebrow">Recebes de ${esc(st.players[to].name)}</div>${box(to,'get')}<label for="ttm" class="eyebrow" style="margin-top:8px">Dinheiro</label><input id="ttm" type="number" min="0" step="10" value="0"></div></div>
      <p class="note" style="margin:0">Propriedades com construções no grupo não podem ser trocadas.</p>
      <div class="row"><button class="btn primary" id="tsend">Enviar proposta</button><button class="btn" id="tclose">Cancelar</button></div></div>`;
    $('#tto').onchange=e=>draw(+e.target.value);
    $('#tclose').onclick=()=>m.hidden=true;
    $('#tsend').onclick=()=>{
      const v=n=>[...m.querySelectorAll(`input[name=${n}]:checked`)].map(x=>+x.value);
      const gm=Math.max(0,Math.floor(+$('#tgm').value||0)), tm=Math.max(0,Math.floor(+$('#ttm').value||0));
      if(gm>st.players[meIdx].money) return toast('Não tens esse dinheiro.');
      m.hidden=true; act('propose',{to,give:v('give'),get:v('get'),gm,tm});
    };
  };
  draw(others[0]); m.hidden=false;
  m.onclick=e=>{ if(e.target===m) m.hidden=true };
}

boot();
</script>
</body>
</html>
